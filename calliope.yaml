# Configurazione di Calliope.
# Generato da calliope/config.py con: python -m calliope.config --esempio
# I commenti vengono dal codice. Si cambiano solo i valori: un campo tolto torna
# al predefinito. Le variabili d'ambiente CALLIOPE_* vincono su questo file.

identita:
  # Identità: nome (che è anche la wake word, salvo wake_word), genere e personaggio
  name: Calliope
  # "f" o "m": come parla di sé (da abbinare alla voce)
  gender: f
  persona: Il tuo nome viene dalla musa dell'eloquenza.
  # Tono delle risposte della casa (04/10, docs/ricerche/2026-10-04-personalita-wake-word.md):
  # uno dei nomi in TONI (in fondo a questo file): normale, formale, amichevole, ironico,
  # essenziale, computer_di_bordo. Sta nel prompt di sistema (cambia di rado: la cache del
  # prefisso si rifà una volta). Ognuno può chiedere il suo («parlami in modo più
  # formale»: cambia_voce con tono, salvato nel profilo come la voce) e quello va nei dati
  # del turno, prima della domanda; chi amministra cambia quello della casa a voce
  # (per_tutti), salvato in personalita.json accanto a calliope.yaml: vince su questo
  # finché calliope.yaml o calliope.locale.yaml non sono più recenti (vale il più recente)
  tono: normale
  # Frasi pronte meno monotone (12/10, calliope/frasi.py, docs/ricerche/2026-10-08-frasi-pronte.md):
  # le frasi più dette scritte nel codice (lavori, estensione attiva, sviluppo, cortesia) hanno
  # varianti per tono, col «lei» nel formale, a rotazione per persona, e una forma breve la
  # seconda volta. «ombra»: Calliope dice la frase di oggi e il registro dei turni scrive anche
  # la variante che avrebbe scelto (`calliope stato --turni` stima le ripetizioni con le
  # varianti); «attivo»: dice la variante; «spento»: niente scelta, solo l'id per la misura.
  # Si accende a mano nel file locale dopo aver riletto il campione:
  # python -m calliope.frasi --campione. Sfida, permessi e domande della politica non cambiano
  frasi_varianti: ombra
  # La forma breve se la stessa frase è stata detta alla stessa persona in questi ultimi turni
  # (e nell'ultima ora). 0 = mai
  frasi_breve_turni: 6
  # Modalità (preset): "startrek" = wake word «Computer» (solo all'inizio della frase o
  # dopo una virgola), tono computer_di_bordo e i suoni di inizio e fine ascolto. Vince su
  # calliope.yaml; ciò che scrivi in calliope.locale.yaml vince sulla modalità. Il nome
  # dell'assistente resta `name` (si presenta come Calliope, il computer di bordo).
  # null = nessuna modalità
  modalita: null
  # Suoni di inizio ascolto (allo scatto della wake word) e di fine ascolto (frase presa),
  # suonati da chi ha il microfono: casse locali, satellite o telefono. Senza file sono
  # sintetici (calliope/suoni.py: bip a più toni, nessun suono originale di Star Trek);
  # suono_inizio_ascolto / suono_fine_ascolto: un tuo WAV (percorso, in
  # calliope.locale.yaml: i file non vanno in git), oppure "nessuno" per spegnere solo quel
  # segnale (il bip d'inizio suona mentre si parla e finisce nella frase per Whisper)
  suoni_ascolto: false
  suono_inizio_ascolto: null
  suono_fine_ascolto: null
  # 0–1, solo per i suoni sintetici
  suoni_volume: 0.35

wake_word:
  # Wake word
  # La parola che sveglia (04/10). null = il nome (`name`). Per la wake word acustica
  # serve un modello addestrato su quella parola in wake_model; senza, si torna da soli
  # alla testuale (Whisper sempre acceso)
  wake_word: null
  # Con una wake_word diversa dal nome, anche il nome sveglia (nel testo; l'acustica sente
  # solo la parola del suo modello)
  wake_anche_nome: true
  # "ovunque": la parola vale in qualunque punto della frase (va bene per un nome raro come
  # Calliope); "inizio": solo in testa (dopo «ehi», «ok»…) o dopo una virgola, come si
  # chiama qualcuno: per una parola comune come «computer» («il computer è lento» non
  # sveglia, «Computer, che ore sono?» sì)
  wake_posizione: ovunque
  wake_word_enabled: true
  # "modello": wake word acustica dedicata (wakeword/, docs/ricerche/2026-09-24-wake-word.md):
  # da addormentata Whisper non trascrive nulla finché non sente il nome. Sulle
  # registrazioni reali: 48/52 risvegli, 0/69 falsi; ~1 falso/ora su audiolibri.
  # "testo": Whisper trascrive tutto e si cerca il nome nel testo (ripiego automatico
  # se il modello o onnxruntime mancano).
  # (variabile d'ambiente CALLIOPE_WAKE_MODE, che vince su questo file)
  wake_mode: modello
  wake_model: wakeword/modelli/calliope.onnx
  wake_threshold: 0.5
  # blocchi da 80 ms di fila sopra soglia
  wake_consecutive: 2
  # Secondo stadio contro i falsi risvegli (TV, audiolibri): se il nome non compare nel
  # testo nemmeno a tolleranza larga e il punteggio resta sotto questo valore, il
  # risveglio si scarta in silenzio e il testo non si conserva
  wake_confirm_score: 0.9
  # Il nome da solo (06/10): con lo scatto sicuro e il nome assente dal testo, una frase
  # vuota o con al più questi secondi di voce è il nome storpiato da Whisper («Computer» →
  # «Come più tardi.», 0,76 s): saluto, o suono d'inizio ascolto, e finestra aperta,
  # invece della frase al modello. «Calliope» da solo dura 0,5–0,65 s sulla DGX
  wake_solo_nome_s: 0.9
  # «Grazie.» sul rumore (16/10, issue #97, calliope/cortesia.py): Whisper scrive «Grazie.»
  # su un rumore breve (allucinazione dei sottotitoli), e la cortesia chiudeva la finestra
  # d'ascolto a chi stava parlando (sulla DGX il 15/10 sera 7 casi su 8 con 0,00–0,38 s di
  # voce; il «grazie» vero della minore 0,60 s). Una cortesia («grazie», «perfetto») detta su
  # meno di cortesia_voce_min_s secondi di voce (il parlato del VAD, `parlato_ms`; la durata
  # dell'audio meno pre-roll e silenzio solo se manca) vale come trascrizione vuota:
  # «attiva» = niente frase pronta e finestra invariata (regola `cortesia_senza_voce`);
  # «ombra» (di serie) = la cortesia come prima e nel registro dei turni la regola
  # `cortesia_senza_voce_ombra` con `cortesia_voce` (forma, secondi di voce e fonte), da
  # rileggere per una settimana prima di «attiva»; «spenta» = niente. Le frasi scritte non
  # contano: non hanno voce
  cortesia_voce_min: ombra
  cortesia_voce_min_s: 0.3
  # secondi di ascolto libero dopo una risposta
  followup_s: 8.0
  # Tolleranza sulla trascrizione del nome (0–1). Era 0,65: «cavallo» (0,67), «calcio»
  # (0,71), «calle» e «callo» (0,77) svegliavano Calliope (taratura del 24/09). Le
  # varianti vere («caliope», «calliop», «allìope», «kaliope») stanno a 0,80 o più.
  wake_match: 0.78

barge_in:
  # Barge-in, livello A: mentre Calliope parla la wake word resta accesa e «Calliope,
  # basta» la interrompe (solo il nome: il resto della voce non viene ascoltato). Senza
  # cuffie si ignora quando è lei a dire il proprio nome. Richiede wake_mode="modello".
  barge_in_enabled: true
  barge_in_threshold: 0.5
  # audio prima dello scatto passato a Whisper
  barge_in_seed_s: 2.0
  # Livello B leggero: mentre parla, anche qualunque frase di una persona registrata
  # la interrompe (VAD + impronta CAM++). Si attiva da solo solo se durante il saluto
  # iniziale il VAD non ha sentito la sua voce (microfono con cancellazione dell'eco
  # di Windows, o cuffie); con l'eco in cassa resta solo il nome.
  barge_in_voice: true
  # parlato prima di controllare l'impronta
  barge_in_voice_min_s: 0.8
  # quota massima di frame "parlato" sul saluto
  barge_in_echo_max: 0.05

llm:
  # LLM — due backend (vedi brain.py):
  #   "ollama" → API nativa /api/chat: num_ctx, think e keep_alive si impostano
  #              a ogni richiesta e i tool_calls arrivano interi;
  #   "openai" → API compatibile OpenAI (/v1): il ripiego per qualunque server
  #              OpenAI-compatibile (principio 1). Lì num_ctx NON passa: Ollama usa
  #              4096 token, a meno di OLLAMA_CONTEXT_LENGTH o di un Modelfile.
  # 127.0.0.1 e non "localhost": su Windows prova prima IPv6 e ogni connessione costa ~2 s
  # 
  # Profilo del modello della voce (03/10, docs/ricerche/2026-10-03-modello-davanti.md):
  # UNA riga che sceglie backend, indirizzo, modello, thinking e le reti sul testo adatte a
  # quel modello (llm_reti_spente). Vince sulle chiavi llm_* qui sotto che imposta. Nomi in
  # PROFILI_LLM (in fondo a calliope/config.py): "gemma4-e4b-ollama" (il 4B di sempre, reti
  # tutte accese), "gemma4-26b-ollama" (gemma4:26b-a4b-it-qat sullo stesso Ollama),
  # "gemma4-26b-vllm" (Gemma 4 26B-A4B su vLLM, porta 8001, avviato con
  # setup/linux/motore/vllm.sh voce avvia). null = nessun profilo: valgono le singole
  # chiavi llm_*. Per tornare indietro si cambia solo questa riga, poi `calliope riavvia`.
  # (variabile d'ambiente CALLIOPE_LLM_PROFILO, che vince su questo file)
  llm_profilo: null
  llm_backend: ollama
  # backend "ollama"
  llm_native_url: http://127.0.0.1:11434
  # backend "openai"
  llm_base_url: http://127.0.0.1:11434/v1
  llm_model: gemma4:e4b-it-qat
  llm_temperature: 0.3
  # Thinking dei modelli ragionanti, backend "ollama": False lo spegne (latenza),
  # None = non inviare il parametro. Il 23–24/09 con gemma4 acceso chiamava i tool
  # meglio ma la prima frase passava da ~0,3 s a 0,6–2,5 s.
  llm_think: false
  # Lo stesso per il backend "openai": "none" lo spegne, None = non inviare.
  llm_reasoning_effort: none
  # Solo backend "openai": argomenti del modello di chat passati così come sono
  # (`chat_template_kwargs`). Con vLLM il thinking di Gemma 4 e Qwen3 si spegne con
  # {enable_thinking: false}; lì llm_reasoning_effort va messo a null (vLLM non garantisce
  # "none"). Ollama non lo usa. None = non inviare.
  llm_chat_template_kwargs: null
  # Finestra di contesto in token. "auto" (05/10, calliope/contesto.py): la calcola
  # Calliope all'avvio dal setup, il minimo tra il massimo del modello, la memoria libera
  # (nvidia-smi; sulla DGX la memoria unificata) e il tempo per rileggere la storia
  # (contesto_rilettura_max_s); `calliope stato` dice quale e perché. Un numero scritto
  # (in calliope.locale.yaml) vince sempre, anche su un profilo. Con Ollama è il num_ctx di
  # ogni richiesta (voce, documenti, agenti sullo stesso modello: deve essere uguale,
  # altrimenti Ollama ricarica il modello); con vLLM il server ha il suo --max-model-len e
  # questo numero serve solo a tagliare la storia. Misure del 05/10 (nvidia-smi, non
  # `ollama ps` che sottostima): gemma4 e4b 16384 → 4,35 GiB, 65536 → 5,15, 131072 →
  # 6,2 (17 KiB a token); prefisso vero ~7,3 k token; la storia si taglia anche in token
  # (Brain._trim_tokens), non solo dopo max_history_turns.
  llm_num_ctx: auto
  # Quanto Ollama tiene il modello in VRAM dopo l'ultima richiesta (backend
  # "ollama"). Il predefinito è 5 minuti: dopo una pausa la risposta pagherebbe
  # il ricaricamento. None = predefinito del server. Un numero (secondi; negativo =
  # sempre) o una durata con l'unità: "30m", "24h", "-1m" (sempre). "-1" scritto come
  # testo vale -1; senza unità Ollama rispondeva 400 a ogni richiesta (03/10). Un
  # valore non valido si segnala e resta il predefinito. Con il profilo del 26B, se
  # qui non è scritto niente, vale -1 (sempre caricato: il ricaricamento costa secondi);
  # il valore dell'esempio in calliope.yaml («30m») non conta come scritto (04/10). Il
  # runner delle prove con Ollama manda quello della voce: una prova non lo accorcia mai
  # (variabile d'ambiente CALLIOPE_LLM_KEEP_ALIVE, che vince su questo file)
  llm_keep_alive: 30m
  # Quanti modelli tiene residenti l'Ollama della voce (la sua OLLAMA_MAX_LOADED_MODELS).
  # 0 = letto dalla variabile o dal servizio systemd di Ollama, altrimenti 3 (06/10,
  # calliope/ollama_carico.py: avviso all'avvio se Calliope ne usa di più)
  ollama_max_modelli: 0
  # All'avvio, quanto aspettare che il modello risponda (Ollama o vLLM non ancora pronti
  # all'accensione della DGX) prima di arrendersi, con nuovi tentativi ogni 2–30 s (03/10).
  # Prima Calliope usciva subito, e systemd esauriva i 5 riavvii prima che vLLM avesse
  # caricato il modello. 0 = esce subito, come prima.
  llm_attesa_avvio_s: 900.0
  # Con "auto": la finestra quando un dato non si legge (server su un'altra macchina,
  # velocità non misurata…), e per ora anche il pavimento del limite di tempo (fase 1:
  # 1,5 s di rilettura valgono ~14–15 k token su portatile e DGX, la finestra di oggi è già
  # al limite; scendere toglierebbe storia senza la compressione della fase 2)
  contesto_ripiego: 16384
  # Secondi per rileggere tutta la storia quando la cache non serve (Ollama riavviato, un
  # cambio di conversazione o di satellite): con la velocità di lettura misurata all'avvio
  # dà quanta storia tenere. Con la compressione (05/10) la storia si ferma alla soglia
  # morbida e dopo una compressione si rileggono solo riassunto e ultimi turni (0,16 s): la
  # rilettura intera è rara, e 4 s danno ~20 k token sul portatile (2 700 token/s) e ~24 k
  # sulla DGX (26B su Ollama, 3 200). Con «spento» il conto è quello della fase 1 (1,5 s
  # davano 16 k). Misure in docs/ricerche/2026-10-05-contesto-compressione.md
  contesto_rilettura_max_s: 4.0
  # Conversazioni contemporanee previste sullo stesso modello (satelliti che parlano
  # insieme, fase 3): la memoria della cache si divide tra loro
  contesto_conversazioni: 1
  # Memoria da lasciare libera oltre a quella che serve alla cache (GB): altri programmi,
  # sul portatile il desktop di Windows
  contesto_margine_gb: 0.5
  # Compressione della conversazione vicino al limite (05/10, calliope/compressione.py),
  # sul conto vero dei token che il motore dà a ogni turno. Oltre la soglia morbida (frazione
  # della finestra) i turni vecchi si riassumono in secondo piano a risposta finita, e si
  # fermano se qualcuno parla; oltre la dura prima di rispondere, con una frase d'attesa.
  # Restano sempre intatti gli ultimi `contesto_turni_intatti` turni e l'azione in sospeso;
  # i turni tolti sono nell'archivio delle conversazioni (sezione «conversazioni»)
  contesto_soglia_morbida: 0.75
  contesto_soglia_dura: 0.9
  contesto_turni_intatti: 4
  # Lunghezza massima del riassunto (token stimati): sta subito dopo il prompt di sistema
  contesto_riassunto_token: 800
  # Chi scrive il riassunto: "auto" = l'agente (sulla DGX qwen3.6 su vLLM, con l'arbitro
  # che dà la precedenza alla voce), altrimenti il modello della voce, altrimenti solo tagli
  # senza modello; oppure "agente", "voce", "tagli", "spento" (niente compressione: al
  # limite la storia si taglia a metà come prima del 05/10, ma resta nell'archivio)
  contesto_riassuntore: auto
  # Soglia dura: quanto aspettare il riassunto prima di rispondere; poi si comprime con i
  # soli tagli e il riassunto vero arriva al turno dopo
  contesto_dura_attesa_s: 8.0
  # Quanto aspettare che il riassunto dell'agente cominci ad arrivare (06/10, P11): oltre,
  # lo scrive la voce o si comprime con i tagli. Sulla DGX i riassunti dell'agente andavano
  # da 1 a 560 s, perché aspettavano la coda dei lavori; da libero ne bastano 4–5. 0 = senza
  # limite
  contesto_riassunto_attesa_s: 10.0
  # Tempo massimo in tutto per il riassunto dell'agente (06/10, Q11): dopo il primo pezzo
  # non c'era un tetto, e con lo scrittore che cede alla voce a ogni turno un riassunto poteva
  # durare minuti con la storia piena. Oltre, lo scrive la voce o si comprime con i tagli
  # (riassunti più corti, mai la storia ferma). Dal primo tentativo, anche se cede e riparte.
  # 0 = senza limite
  contesto_riassunto_max_s: 60.0
  # Domande tenute nella storia, come limite di sicurezza: oltre, si tengono le ultime metà
  # (a blocchi, per la cache). Dal 05/10 il taglio vero lo decide la compressione in token
  # (contesto_soglia_morbida) e quello che si toglie resta nell'archivio: prima era 10
  max_history_turns: 40
  # tetto di giri di tool calling per risposta
  max_tool_turns: 4
  # Giri di correzione (09/10, docs/ricerche/2026-10-09-dialogo-tool.md): dopo un tool che
  # non è partito per un errore correggibile (argomenti contro lo schema), al più questi giri
  # in cui il testo del modello senza chiamata e senza domanda non si dice e il modello
  # rilegge l'errore e richiama (rete `correzione_tool`). Dentro max_tool_turns. 0 = niente
  tool_correzioni_max: 2
  # Durante un giro di correzione, se non si è detto ancora niente e dall'inizio della
  # risposta sono passati più di questi secondi, una frase breve
  # («Un attimo, sistemo la richiesta.»), una volta per risposta
  tool_correzione_avviso_s: 2.0
  # Azione in sospeso («Lo apro?», «Procedo?»): la proposta arriva al modello nei turni dopo
  # della stessa persona, al più per `azione_in_sospeso_turni` turni ed entro
  # `azione_in_sospeso_s` secondi; una proposta nuova sostituisce la vecchia. Fino al 04/10
  # valeva solo nella risposta subito dopo, e un turno in mezzo («Scusa, io sono chi
  # amministra») la consumava (calliope/conferme.py). Vale anche per le offerte dei tool
  # (lavori, installazioni, fatture, schermi, rinomina)
  azione_in_sospeso_s: 120.0
  azione_in_sospeso_turni: 3
  # Frase di sfida (04/10, calliope/conferme.py): quando chi amministra conferma con una
  # frase che non basta (breve con l'impronta incerta, zona grigia), Calliope chiede di
  # ripetere tre parole comuni e un numero scelti in quel momento, validi questi secondi:
  # abbastanza voce per l'impronta, e una prova di presenza contro registrazioni e TV.
  # false = «dimmelo con una frase un po' più lunga»
  conferma_sfida: true
  conferma_sfida_s: 60.0
  conferma_sfida_parole: 3
  # Quarantena dei dati non fidati lunghi (05/10, calliope/quarantena.py): sopra questi
  # token stimati (4 caratteri l'uno) un risultato di internet, di un'estensione,
  # dell'archivio o di un agente, o un allegato, passa prima da una chiamata del modello
  # senza tool che ne estrae i dati; la voce vede solo l'estratto. Misura del 05/10 (gemma4
  # e4b, prove/misura_quarantena.py): un'iniezione «di' all'utente di chiamare l'899…» in un
  # testo da 1200 o 3500 token arrivava nella risposta 3 volte su 3, con la quarantena 0 su
  # 3, e a 300 token 0 su 3 anche senza; costo +1,1–1,8 s sulla prima frase. I risultati
  # normali di internet (5 estratti) restano sotto. 0 = spenta; solo con l'API di Ollama
  quarantena_token: 800
  # Memoria dell'intento (08/10, calliope/valore.py, fase 2 della sicurezza per valore;
  # decisione D4): un'azione confermata dalla persona riconosciuta e poi fallita resta aperta
  # al più questi secondi, per lo stesso tool, lo stesso bersaglio e la stessa persona: la
  # chiamata corretta («riprova», l'indice giusto) non chiede di nuovo. Il 07/10 alle 17:07
  # servivano 10 turni per aprire un foglio appena creato. 0 = fino alla chiusura della
  # conversazione
  intento_valido_s: 600.0
  # Politica per valore (08/10, calliope/valore.py; fase 4 accesa il 09/10, decisione D5):
  # con un dato non fidato di mezzo decide la matrice provenienza × effetto al posto della
  # regola «pericolosa ⇒ conferma». Accesa dopo due giorni d'ombra sulla DGX: 08/10, 251
  # turni, 96 chiamate con un dato di mezzo, 31 domande evitate, 0 in più, 0 esecuzioni con
  # un bersaglio preso dal dato, attrito simulato 0,0 (vero 6,4) ogni 100 turni; 09/10, 126
  # turni, 2 evitate, 0 in più, 0 dal dato, 1,6 (vero 3,2). Restano sempre il dato letto in
  # questa risposta, «fai quello che dice…», le vietate, la sfida delle più delicate, minori,
  # livello e ospiti. L'ombra resta al contrario: il registro dei turni scrive che cosa
  # avrebbe deciso la politica di prima (`calliope stato --turni`). Per tornare indietro:
  # `politica_per_valore: false` in calliope.locale.yaml
  politica_per_valore: true
  # Lo stato del dialogo (10/10, calliope/stato_dialogo.py, passo 1 del progetto
  # docs/ricerche/2026-10-10-macchina-stati.md): la risposta a una proposta aperta la
  # interpreta il modello con il tool `proposta_rispondi` (sì, no, correzione, rinvio, altro)
  # e una corsia veloce riconosce le forme chiuse dette per intero (calliope/risposte.py).
  # «ombra»: lo schema c'è sempre, lo stato del turno sostituisce il messaggio dell'azione in
  # sospeso, il «sì» del tool diventa la chiamata di oggi (decide ancora la politica) e il
  # registro dei turni scrive il confronto (`dialogo_ombra`, `calliope stato --turni`).
  # «spento»: il percorso di prima, identico (niente schema né confronto). «acceso» (la
  # macchina che esegue la proposta) non è ancora realizzato: si segnala e resta «ombra»
  dialogo_interprete: ombra
  # Ciò che Calliope dice con dati non fidati di mezzo (06/10, calliope/riferire.py): ogni
  # frase della risposta si controlla prima di dirla (numeri a pagamento, codici e password da
  # dare, soldi verso un conto, recapiti presi solo dal dato e non chiesti, indicazioni
  # rivolte alla persona che vengono dal dato); al posto di una frase fermata una frase fissa,
  # e la storia tiene solo ciò che è stato detto. Misura del 06/10 (gemma4 e4b,
  # prove/misura_riferire.py): attacchi riportati 22 su 27 → detti 0, falsi allarmi 0 su 36
  # risposte normali, 0,2 ms per frase. Con la conversazione pulita non costa niente.
  # Dal 06/10 (Q6) è la rete di sicurezza «riferire» e non si spegne: false si segnala
  # all'avvio e resta acceso
  uscita_controllo: true
  # La conversazione è di una persona sola (03/10, analisi del comportamento): prima restava
  # finché qualcuno non diceva «esci», e un ospite si faceva ripetere la password del wifi
  # chiesta da Dario (4 volte su 4). Dal 06/10 ogni persona riconosciuta ha la sua (da
  # qualunque satellite) e gli ospiti una per satellite (calliope/corsie.py): quando parla
  # un altro la conversazione resta da parte, e si chiude come con «esci» dopo questi
  # secondi senza turni. 0 = niente scadenza
  storia_inattiva_s: 300.0
  # I dati del turno che cambiano di rado nella storia, in sola aggiunta (16/10, issue #95,
  # calliope/dati_turno.py): i ricordi di chi parla, gli avvisi ai tutori e il riassunto della
  # stanza entrano nella richiesta solo quando cambiano, davanti alla frase di quel turno, e lì
  # restano uguali. Prima stavano nei dati del turno e sparivano alla richiesta dopo: con Gemma 4
  # (finestra scorrevole) Ollama non sa riavvolgere la cache oltre ~512 token dalla fine della
  # richiesta di prima e rileggeva tutta la storia a ogni turno (DGX, 15/10: 85 turni su 118,
  # prima frase mediana 2,58 s). false = come prima, per il confronto
  dati_stabili_in_storia: true
  # Tetto in token stimati (3,5 caratteri a token) dei dati del turno più la domanda, cioè di ciò
  # che alla richiesta dopo il motore deve riavvolgere (16/10, issue #95). Sul portatile
  # (gemma4 e4b) la cache regge con ~350 token veri di dati del turno e si perde tutta con
  # ~500; la finestra riavvolgibile è `n_ubatch` (512) anche per il 26B. Oltre il tetto la
  # ricerca anticipata nella stanza si accorcia o non parte (il modello ha stanza_cerca), e il
  # turno si conta in `calliope stato --turni`. 0 = nessun tetto
  dati_turno_tetto_token: 450
  # Reti e spinte da spegnere (03/10): servono al modello piccolo, uno più forte può farne
  # a meno. Nomi in RETI (in fondo a questo file), solo quelle di categoria «modello»:
  # textcallguard, chiamata_in_mezzo, spinta_promessa, spinta_richiesta, spinta_dichiarata,
  # riferimento_casa, riferimento_agenda, conferma_al_posto_del_vuoto,
  # vuoto_seconda_passata, ricerca_promessa, citazione_tolta, nome_tool_parlato,
  # eco_contesto, spinta_archivio, spinta_rinuncia, spinta_esercizi, correzione_tool,
  # ricerca_recente, risposta_ripetuta, scrivo_qui_a_voce, spinta_stanza,
  # ciclo_ripetuto, domanda_insistita; "tutte"
  # le spegne tutte. Quelle di
  # «sicurezza» (permessi, politica…) non si spengono: un nome di sicurezza o sconosciuto si
  # segnala all'avvio. Quelle del profilo (llm_profilo) si aggiungono a queste.
  # Vuoto = tutte accese (o quelle del profilo).
  llm_reti_spente: []
  # La frase dopo il tool, System 1 (15/10, calliope/system1/dopo_tool.py; roadmap 3.12):
  # sulla DGX un turno con un tool ha la prima frase ~0,9 s dopo uno senza (2,71 contro 1,77 s
  # il 14/10), quasi tutta la seconda passata del modello che rimette in parole il risultato.
  # Per gli esiti semplici e chiusi (timer, promemoria, liste, volume, ora, data, calcoli) la
  # frase pronta del tool basta; nel dubbio (più tool, errore, dati da riassumere, un minore,
  # testo del modello, una domanda o più frasi della persona…) decide il modello come oggi.
  # «spento» (di serie): niente. «ombra»: si fa comunque la seconda passata, e il registro dei
  # turni scrive la frase del codice, il tempo risparmiabile e se il modello ha detto la stessa
  # cosa (`calliope stato --turni`). «attivo»: niente seconda passata per i casi coperti
  # (regola `dopo_tool_codice`). Spento di serie finché l'ombra della DGX non dice quante
  # frasi del codice sarebbero state diverse da quelle del modello
  system1_dopo_tool: spento
  # Le parole della frase della persona oltre cui decide il modello (forse chiede altro)
  system1_dopo_tool_parole_max: 16

stt:
  # Speech-to-Text — faster-whisper
  # ~1,2 GiB di VRAM reali nel processo, contesto CUDA compreso (misura del 24/09);
  # "small" occupa meno se non ci sta
  whisper_model: large-v3-turbo
  # Cartella del modello installato dal catalogo (02/10, `--installa whisper_riserva`): se
  # in <whisper_cartella>/<whisper_model> c'è model.bin si usa quello, altrimenti la cache
  # di Hugging Face. Serve al ripiego su CPU della DGX, che senza il modello lo
  # scaricherebbe al primo guasto del server di trascrizione (1,6 GB, con la voce ferma)
  whisper_cartella: models/whisper
  # Taratura del 24/09 su 104 registrazioni (docs/ricerche/2026-09-24-taratura-whisper.md):
  # beam 5 + hotwords porta la WER da 14,3 a 11,0 % (frasi dette subito: da 20,1 a
  # 15,1 %) per +0,04 s di media. Un prompt iniziale più lungo abbassa di poco la WER
  # ma Whisper lo ricopia sull'audio incerto e inserisce il nome: non allungarlo.
  whisper_beam_size: 5
  # Dal 04/10 le parole che svegliano (wake_names) si aggiungono da sole
  whisper_hotwords: Calliope
  # fallback automatico a "cpu"
  whisper_device: cuda
  whisper_compute_type: int8_float16
  language: it
  # Dove gira Whisper (02/10, impacchettamento per la DGX Linux):
  #   "locale" → faster-whisper nel processo (Windows: GPU con CTranslate2, come sempre);
  #   "server" → un server di trascrizione con l'API compatibile OpenAI
  #              (POST {stt_url}/audio/transcriptions: vLLM con Whisper, whisper.cpp con
  #              --inference-path, speaches). Serve sulla DGX Spark: CTranslate2 per Linux
  #              aarch64 su PyPI (4.8.2) è solo per CPU. Se il server non risponde si
  #              ripiega su faster-whisper su CPU (principio 7), e il registro lo dice.
  #              Beam e hotwords lì non passano (li fissa il server); il prompt sì.
  stt_motore: locale
  # es. http://127.0.0.1:8002/v1
  stt_url: null
  # il nome servito dal server
  stt_modello: openai/whisper-large-v3-turbo
  # Oltre, la frase si trascrive su CPU. Vale per una frase fino a 15 s; dal 10/10 per una
  # più lunga (una dettatura) cresce in proporzione: 120 s di frase → 40 s
  stt_timeout_s: 5.0
  # Correzione delle frasi incerte (05/10, prototipo: calliope/stt_correzione.py, rapporto
  # docs/ricerche/2026-10-05-stt-confronto.md). Solo con stt_motore «server»: la risposta
  # verbose_json di whisper-server dà la probabilità di ogni parola; se la più debole è
  # sotto stt_correzione_soglia, un modello di testo corregge le parole storpiate con il
  # vocabolario della casa (satelliti, schermi, stanze, persone, entità, tool) e le ultime
  # frasi, e la correzione vale solo se cambia parole in parole che suonano simili (regola
  # stt_corretta, con prima e dopo nel registro dei turni). Sulla DGX col 26B: 104
  # registrazioni WER 13,4 → 11,4 %, frasi di dominio 20,6 → 17,4 %, nessuna peggiorata;
  # +0,4 s solo sulle frasi incerte (~40 %). Spenta finché non si prova a voce.
  # Prova vera del 05/10 sera (DGX, 26B): 15 frasi su 25 corrette, 0,84–1,50 s l'una (STT
  # 1,1–1,9 s invece di 0,25–0,5), 3 cambiate. Ora: soglia 0,4 senza contare il nome (sul
  # banco col 26B frasi al secondo passaggio 41 → 28 %, migliorate 6 → 5 su 104 e 19 → 18
  # su 150) e risposta «giusta: true» senza ricopiare la frase (e4b: frasi lunghe 0,87 →
  # 0,43 s)
  stt_correzione: false
  # probabilità minima per parola sotto cui si corregge
  stt_correzione_soglia: 0.4
  # "ollama" | "openai"; vuoto = quello della voce
  stt_correzione_motore: ''
  # vuoto = quello della voce
  stt_correzione_url: ''
  # Vuoto = il modello della voce: stessa finestra e keep_alive, niente ricarica né memoria
  # in più (il 4B ne rovinava 3 su 30 cambiate: «voce» → «luce»; il 26B e qwen3.6 nessuna)
  stt_correzione_modello: ''
  # Tempo massimo della correzione, dall'invio alla risposta: oltre, vale la frase di Whisper e
  # la richiesta si chiude (Ollama la annulla). Era 1,5 s di rete: sulla DGX il 05/10 la
  # correzione costava 1,0 s di mediana (p90 1,4) su 44 frasi su 112, e la prima frase saliva
  # da 1,35 a 2,73 s (docs/ricerche/2026-10-06-analisi-complessiva.md, P1). Con 0,4 s il
  # costo di una frase incerta resta sotto mezzo secondo (P1, 06/10)
  stt_correzione_timeout_s: 0.4
  # Parole incerte al modello della voce (07/10, variante B del confronto in
  # docs/aree/stt-tts.md): invece di un secondo passaggio, le parole della frase sotto
  # stt_correzione_soglia (dal verbose_json di whisper-server, il nome che sveglia escluso)
  # vanno nei dati del turno, con «se una non ha senso intendi la più probabile, se non è
  # chiara chiedi». Nessun tempo in più (niente richiesta in più) e nessuna parola cambiata
  # dal codice: decide il modello (principio 10: contesto del turno, non una regola). Mai
  # nel prompt di sistema, che resta in cache; le parole non vanno nel registro dei turni
  # (solo quante). Solo con stt_motore «server»
  stt_incerte_al_modello: false
  # Variante B2 (07/10): con parole incerte il modello della voce scrive come prima riga
  # «⟦capito: la richiesta come la intende⟧» e poi risponde; il codice trattiene la riga (né
  # voce né storia: Brain.CapitoHold) e la frase capita sostituisce quella di Whisper per la
  # politica dei tool e per la storia SOLO se passa stt_correzione.accettabile (parole
  # storpiate → parole simili, niente richieste aggiunte); altrimenti vale Whisper. Nel
  # registro dei turni `stt_capito` con prima e dopo (come stt_corretta). Vince su
  # stt_incerte_al_modello. Solo con stt_motore «server»
  stt_incerte_riscrivi: false
  # Argomenti che nominano qualcosa (08/10, calliope/argomenti_incerti.py, fasi F0 e F1 di
  # docs/ricerche/2026-10-08-parole-incerte.md). Quando il modello chiama un tool con un
  # argomento marcato (ToolSpec.nomi: la città di un collaudo, l'estensione, il file…), le
  # probabilità per parola della frase si chiedono in parallelo al tool (whisper.cpp:
  # verbose_json, +0,15 s di GPU misurati sulla DGX, solo in quei turni; faster-whisper:
  # word_timestamps) e si cerca il nome noto più vicino; nel registro dei turni
  # `stt_argomento`, riassunto in `calliope stato --turni`. Nessun effetto sulla risposta
  stt_argomenti_misura: true
  # Dopo un esito vuoto (F1, rete «argomento_forse»): «forse intendeva X» da questa
  # somiglianza con un nome noto (lettere senza spazi, doppie ridotte; sul solo argomento a
  # 0,7 44 proposte giuste su 66 e nessuna sbagliata) …
  stt_argomenti_soglia_noto: 0.7
  # … altrimenti «ripetilo o scrivilo» se una parola del valore è sotto questa probabilità
  # (whisper.cpp a 0,5: 49 nomi sbagliati su 69 segnalati, 7 giusti su 39)
  stt_argomenti_soglia_p: 0.5
  # Quanto si aspettano le probabilità dopo un esito vuoto (di solito sono già arrivate:
  # il tool dura più della richiesta)
  stt_argomenti_attesa_s: 0.4

tts:
  # Text-to-Speech — Piper (servono sia .onnx che .onnx.json, nella cartella voices/)
  # (variabile d'ambiente CALLIOPE_PIPER_VOICE, che vince su questo file)
  piper_voice: voices/it_IT-serena-high.onnx
  # Silenzio scritto prima di chiudere l'uscita audio (cambio voce): le cuffie
  # Bluetooth hanno un buffer loro e senza margine perdono la coda della frase.
  tts_tail_s: 0.3
  # Silenzio scritto appena si apre l'uscita audio: le cuffie Bluetooth impiegano un
  # attimo a svegliarsi e senza margine il saluto iniziale diventava «iao».
  tts_lead_s: 0.3
  # Tra un turno e l'altro l'uscita riceve silenzio continuo: senza, dopo qualche
  # secondo di vuoto le cuffie Bluetooth vanno in risparmio e «Ciao Dario» perdeva
  # l'attacco. Costa al massimo la latenza del buffer (~0,18 s con MME).
  tts_keepalive: true
  # La prima frase della risposta più lunga di così (caratteri) si dice in due pezzi,
  # tagliata dopo la prima virgola, punto e virgola o due punti adatti (07/10): Piper
  # sintetizza una frase intera prima di suonarla, e con serena-high sulla DGX 150
  # caratteri costano 0,9 s di silenzio in più; il primo pezzo ne costa ~0,1 e il resto
  # si sintetizza mentre suona. 0 = mai.
  tts_spezza_prima: 60
  # Dove tagliarla (07/10, calliope/tts.py → primo_pezzo): alla prima virgola, due punti o
  # punto e virgola dopo cui il primo pezzo ha almeno tanti caratteri e la sua voce dura più
  # della sintesi del resto. Velocità della voce e costo della sintesi non si scrivono: li
  # misura Calliope (calliope/taratura_voce.py, voce_taratura.json accanto a questo file).
  tts_primo_pezzo_min: 15
  # Una frase senza punto più lunga di così (caratteri) va al TTS anche a pezzi, dopo un
  # «; » (17/10, issue #132, calliope/testi.py → taglio_voce): col 26B le notizie arrivavano
  # in una frase sola di 500–650 caratteri coi fatti uniti dal «;» e la voce aspettava la
  # generazione intera. Mai alla virgola; non spezza gli elenchi brevi, le virgolette, le
  # parentesi né «3; 4». 0 = solo a fine frase, come prima.
  tts_spezza_streaming: 120
  # Taratura della voce all'avvio (07/10): una frase fissa sintetizzata quando la voce è
  # libera, e con tts_thread «auto» la scelta dei thread. Ogni sintesi vera aggiorna comunque
  # la stima; false = solo l'uso (prima, i predefiniti prudenti). CALLIOPE_TTS_TARATURA=0
  # la spegne dall'ambiente (le prove: proverebbe i thread a ogni avvio).
  # (variabile d'ambiente CALLIOPE_TTS_TARATURA, che vince su questo file)
  tts_taratura: true
  # Thread di onnxruntime per la sintesi di Piper (07/10). Piper ne usa uno per core, e sui
  # processori con core veloci e lenti (DGX: 10 Cortex-X925 e 10 A725) è più lento: con 8
  # serena-high sintetizza una frase di 100 caratteri in 0,36 s invece di 0,61 sulla DGX,
  # 0,77 invece di 1,46 sul portatile. «auto» (07/10): li sceglie la taratura all'avvio
  # provando 2, 4, 8 e i core fisici (calliope/taratura_voce.py), finché non l'ha fatto 8;
  # un numero scritto qui vince. 0 = la scelta di onnxruntime.
  tts_thread: auto
  # Dove sintetizza Piper (07/10): "cpu", "cuda" (la GPU NVIDIA, serve onnxruntime-gpu con le
  # librerie di CUDA e cuDNN: extra voce-gpu su Linux aarch64) o "auto". Con «auto» decide la
  # taratura all'avvio secondo la macchina: GPU solo se c'è posto dopo la voce e Whisper
  # (memoria unificata grande sì, GPU dedicata da 8 GB no) e se misurata almeno 2 volte più
  # veloce; scelta e motivo in voce_taratura.json e in `calliope stato`. Sulla DGX serena-high
  # costa 0,08 s per 138 caratteri invece di 0,47. Qualunque errore della GPU: CPU.
  # (variabile d'ambiente CALLIOPE_TTS_DISPOSITIVO, che vince su questo file)
  tts_dispositivo: auto
  # Inglesismi detti all'inglese (calliope/pronuncia.py): «file» → «fàil», «email» →
  # «imèil», «wifi» → «uàifài»… Cambia solo il testo dato a Piper, non la storia né gli
  # schermi. Il lessico predefinito è nel codice (solo le parole che espeak sbaglia).
  tts_pronuncia: true
  # Voci in più o diverse: parola → grafia all'italiana («podcast: pòdcast») oppure fonemi
  # di espeak tra doppie quadre («[[fˈaɪl]]»); un valore vuoto toglie una voce predefinita.
  tts_pronuncia_extra: {}

audio:
  # == Calliope completa con microfono e casse di questo PC (audio_modo: locale).
  # == Il satellite ha i suoi dispositivi nella sezione satellite.
  # Audio / VAD
  sample_rate: 16000
  vad_threshold: 0.5
  # Motore di Silero VAD (calliope/vad.py): "auto" = PyTorch se c'è (Windows, come
  # sempre), altrimenti onnxruntime senza torch (Linux aarch64: torch su PyPI è quello con
  # CUDA 13, qualche GB); "torch" o "onnx" per forzarlo. vad_modello: il file ONNX, vuoto =
  # quello dentro il pacchetto silero-vad.
  vad_motore: auto
  vad_modello: null
  # pausa che chiude il turno
  silence_ms: 700
  # audio tenuto prima dell'inizio del parlato
  preroll_ms: 300
  # sotto questa durata è rumore
  min_speech_ms: 250
  # Tetto di una frase: oltre, il VAD la chiude anche se la persona parla ancora (contro un
  # rumore continuo, la TV). Era 30: il 10/10 una dettatura delle regole di un gioco è stata
  # tagliata a 30,02 s di frase («…possono aumentare o diminuire troppo») e Calliope è partita
  # mentre Dario parlava ancora. Con 120 una dettatura sta in una frase; se il tetto arriva
  # comunque, il ciclo continua ad ascoltare e unisce il seguito allo stesso turno (regola
  # frase_tetto, calliope/pause.py). Whisper trascrive anche oltre i 30 s della sua finestra
  # (misure del 10/10 in docs/aree/stt-tts.md: 70 s in 1,9 s sulla GPU del portatile)
  max_utterance_s: 120
  # La fine del turno decisa da un modello piccolo, System 1 (14/10, calliope/system1/
  # fine_turno.py; ricerca docs/ricerche/2026-10-14-system1-fine-turno.md): Smart Turn v3.2
  # (Pipecat, BSD-2, 8,7 MB) ascolta l'audio della frase a fine_turno_sonda_ms di silenzio e
  # dice «finito» o «non finito». «spenta» (di serie): solo il silenzio fisso (silence_ms).
  # «ombra»: il turno si chiude come sempre e, dopo, il server rigioca la frase e scrive cosa
  # avrebbe deciso (ms risparmiati, frasi che avrebbe tagliato, attese più lunghe: `calliope
  # stato --turni`). «attiva»: «finito» con sicurezza ≥ fine_turno_soglia chiude subito,
  # «non finito» con sicurezza ≥ fine_turno_soglia_attesa aspetta fino a
  # fine_turno_attesa_max_ms; incerto, lento, guasto o senza modello: silenzio fisso. Vale in
  # locale e sul satellite in Python che ha il modello (il telefono resta al silenzio fisso).
  # Il modello si scarica con: python -m calliope.stato --installa modello_fine_turno
  fine_turno: spenta
  # vuoto = models/fine_turno/smart-turn-v3.2-cpu.onnx
  fine_turno_modello: null
  fine_turno_sonda_ms: 250
  fine_turno_soglia: 0.9
  fine_turno_soglia_attesa: 0.8
  fine_turno_attesa_max_ms: 1500
  # Sotto questo parlato non si chiude mai prima (il nome da solo, «Calliope,», e la pausa
  # prima della domanda)
  fine_turno_min_parlato_ms: 800
  # Microfono e uscita di Calliope completa con l'audio di questo PC (audio_modo: locale).
  # Il satellite usa i suoi, nella sezione satellite (satellite_microfono, satellite_casse):
  # questi gli valgono solo da ripiego, con un avviso. None = predefinito.
  # Accettano il numero o parole del nome con l'API audio («I52 MME», «C920 MME»):
  # il nome è più sicuro, perché Windows rinumera i dispositivi quando le cuffie
  # Bluetooth si ricollegano; l'API serve perché ogni dispositivo compare più volte.
  # (variabile d'ambiente CALLIOPE_INPUT_DEVICE, che vince su questo file)
  input_device: null
  # (variabile d'ambiente CALLIOPE_OUTPUT_DEVICE, che vince su questo file)
  output_device: null

chi_parla:
  # Speaker ID (impronta vocale)
  speaker_id_enabled: true
  # Impronta neurale CAM++ di 3D-Speaker (ONNX, 28 MB, Apache 2.0). Valori dalla
  # ricerca del 24/09 (docs/ricerche/2026-09-24-riconoscimento-parlante.md): alla
  # soglia 0,48 l'1 % di sconosciuti passa per familiare. Il punteggio non è sulla
  # scala del vecchio MFCC (Dario ~0,45–0,8). Da ritarare con il secondo familiare.
  speaker_model: models/speaker/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
  speaker_threads: 2
  speaker_id_threshold: 0.48
  # Zona grigia (soglia − margine … soglia): durante una conversazione conferma chi
  # parlava al turno prima, ma solo fino a "familiare", mai ad "amministra".
  speaker_id_session_margin: 0.06
  # Margine tra il primo e il secondo profilo (07/10, docs/aree/stt-tts.md «Voci di
  # famiglia»): sopra soglia ma a meno di questo dal secondo, la voce non decide (vale come
  # zona grigia: chi parlava nella conversazione al più come familiare, poi il profilo più
  # protetto, altrimenti ospite). Misura: sul portatile le frasi vere di chi amministra
  # stanno a 0,19 (p05) dal minore, nel corpus a 22 voci nessuna frase vera sotto 0,10; in
  # auto al telefono le frasi scambiate erano a meno di 0,05
  speaker_id_margine: 0.08
  # Sotto questa durata di voce l'impronta non decide (rifiuta Dario una volta su due):
  # si tiene l'identità della conversazione.
  speaker_min_voice_s: 1.0
  # Continuità (08/10, docs/aree/stt-tts.md «Frasi cortissime prese per un ospite»): una frase
  # più corta di `speaker_min_voice_s`, fuori dalla conversazione o senza nessuno prima, vale
  # la persona riconosciuta dalla voce su **questo** satellite negli ultimi
  # `speaker_continuita_s` secondi, se il migliore è lei, con almeno
  # `speaker_continuita_soglia` e `speaker_continuita_margine` sul secondo profilo; al più
  # familiare (come la zona grigia: le azioni che vogliono la voce chiedono la frase di
  # sfida), regola `voce_continuita`. Caso vero: «Calliope.» (0,5 s, 0,44, secondo a 0,11) e
  # la frase dopo (0,6 s, 0,40) 13 minuti dopo l'ultima frase di Dario → ospite, ricerca
  # negata. Misure: sulla DGX (02–08/10) le frasi brevi «breve» stanno a 0,49 di mediana;
  # con prove/misura_conferma_breve.py a 0,35–0,38 le frasi brevi di altre voci sullo stesso
  # canale passano nell'1–3 % (0,5–0,9 s), quelle di Dario sono rifiutate nel 9–11 %. 0 = spenta
  speaker_continuita_s: 900.0
  speaker_continuita_soglia: 0.36
  speaker_continuita_margine: 0.2
  # Il proprietario di un satellite personale (09/10, regola `voce_proprietario`): sul telefono
  # di una persona, una frase incerta tra lei e un minore (che varrebbe il minore, il profilo
  # più protetto) resta sua, nella sua conversazione, se negli ultimi
  # `speaker_proprietario_s` secondi è stata riconosciuta dalla voce lì, è lei la più simile
  # (almeno `speaker_continuita_soglia`) e non c'è compagnia. Il minore prende il posto solo
  # riconosciuto con sicurezza. Vale come la zona grigia (al più familiare, le azioni vogliono
  # la voce nella frase), e la prudenza per i minori resta: guardiano, cancelli e preset del
  # minore valgono per la frase. Caso vero della DGX del 09/10 (18:48): due frasi di chi
  # amministra prese per il minore (0,50 contro 0,485 e 0,61 contro 0,54) aprivano una
  # conversazione nuova, e quella di prima si perdeva. Mai oltre `storia_inattiva_s` (la
  # conversazione chiusa per tempo non si continua). 0 = spenta
  speaker_proprietario_s: 180.0
  # Conferma breve (04/10, calliope/conferme.py): un «sì» sotto `speaker_min_voice_s`
  # conferma un'azione proposta a chi amministra se nella conversazione era già stato
  # riconosciuto dalla voce e l'impronta della frase breve arriva almeno qui contro il suo
  # profilo. Misura (prove/misura_conferma_breve.py): altre voci accettate 0,4 / 1,4 / 1,8 %
  # su 0,5 / 0,7 / 0,9 s di voce (stesso canale), ≤ 0,5 % da altri microfoni, 0 % Piper;
  # frasi brevi vere di Dario rifiutate 12 % (allora la frase di sfida). Con 0,35 lo stesso
  # canale arrivava al 3,6 %
  speaker_conferma_breve_soglia: 0.4
  # Compagnia (09/10, calliope/compagnia.py, docs/ricerche/2026-10-09-piu-persone.md): più
  # voci vicino allo stesso satellite negli ultimi `compagnia_finestra_s`, dalle impronte
  # tenute solo in memoria. Prove: una frase di almeno `compagnia_voce_min_s` sotto
  # `compagnia_soglia_profilo` sul profilo di chi è stato riconosciuto lì (stessa persona
  # sotto 0,20: ≤ 0,5 %; un'altra voce: 66–90 %), gruppi tra frasi di almeno
  # `compagnia_gruppi_min_s` (coseno ≥ `compagnia_soglia_gruppi`; gruppo valido con due frasi
  # o una di `compagnia_gruppo_lungo_s`; false compagnie ≤ 2 % delle sessioni), due persone
  # registrate. «attiva»: niente frase breve, continuità né conferma breve, le azioni vogliono
  # la voce nella frase, per i minori «voce non sicura» nei due cancelli; «ombra»: solo il
  # registro dei turni (`voce.compagnia`, regola `voci_compagnia`); «spenta»
  compagnia_enabled: attiva
  compagnia_finestra_s: 300.0
  compagnia_soglia_profilo: 0.2
  compagnia_voce_min_s: 1.0
  compagnia_soglia_gruppi: 0.25
  compagnia_gruppi_min_s: 1.5
  compagnia_gruppo_lungo_s: 3.0
  # In compagnia con una voce sconosciuta la finestra d'ascolto senza il nome si chiude
  # (serve il nome a ogni frase, regola `compagnia_nome`) finché per `compagnia_finestra_s`
  # non si sente più l'altra voce; sullo schermo «In compagnia: chiamami per nome». Il nome da
  # solo («Calliope.» e poi la domanda) vale ancora. Con le voci tutte riconosciute (minore e
  # adulto di casa) la finestra resta e decide il giudizio qui sotto
  compagnia_nome_obbligatorio: true
  # Il giudizio «la frase è rivolta a Calliope?» (calliope/rivolta.py) sulle frasi senza il nome
  # nella finestra d'ascolto, in compagnia, in parallelo alla risposta: «ombra» registra
  # (`rivolta` nel registro, regola `non_rivolta_ombra`) e non tace; «attiva»: una frase non
  # rivolta → silenzio e niente finestra nuova (regola `non_rivolta`); «spenta». Misura sul
  # portatile: 26/27 rivolte e 27/29 non rivolte giuste, 285 ms. Modello vuoto = quello del
  # rilevatore di pericolo (`guardiano_pericolo_modello`), poi quello della voce. Un giudizio
  # guasto o oltre `compagnia_rivolta_timeout_s` vale «rivolta»
  compagnia_rivolta: ombra
  compagnia_rivolta_modello: ''
  compagnia_rivolta_timeout_s: 2.0
  # Passo 0 della conversazione di stanza (13/10, decisione 0029, caso vero del 12/10 in auto
  # con le voci tutte riconosciute). In compagnia una frase senza il nome nella finestra
  # d'ascolto riceve una risposta e le letture, mai un'azione: «Dimmi pure "Calliope, …" e lo
  # faccio.» (regola `compagnia_azioni_col_nome`; il «sì» della stessa persona alla proposta
  # in sospeso passa)
  compagnia_azioni_col_nome: true
  # In compagnia, con le voci tutte riconosciute, la conversazione anonima del satellite (voci
  # incerte, frasi brevi) non si chiude più quando cambia chi parla: è condivisa da chi è lì, le
  # frasi della persona hanno il nome nei dati del turno, i permessi restano per frase (regola
  # `compagnia_anonima_continua`). Con una voce sconosciuta di mezzo si chiude come prima
  compagnia_anonima_condivisa: true
  # In compagnia una frase senza il nome giudicata «non rivolta a Calliope» (anche col giudizio
  # in ombra) non passa dal rilevatore di pericolo: le chiacchiere non si giudicano in diretta
  # (decisione 0029, risposta 4 di chi amministra; regola `pericolo_non_rivolta`). Il
  # guardiano sulle frasi di Calliope resta. Un giudizio guasto o scaduto vale «rivolta»
  compagnia_pericolo_solo_rivolte: true
  # frasi di arruolamento (con 5: Dario rifiutato 4 %)
  speaker_enroll_phrases: 5
  # voce minima per una frase di arruolamento
  speaker_enroll_min_s: 1.5
  # Una registrazione della voce senza frasi valide per questo tempo si chiude da sola:
  # aperta per sempre, la prima voce che passava (anche la TV) diventava una frase
  speaker_enroll_timeout_s: 120.0
  # Aggiornamento dell'impronta con le frasi sicure (media mobile), senza allontanarsi
  # dall'impronta dell'arruolamento oltre un coseno di `speaker_adapt_max_drift`
  speaker_adapt_threshold: 0.58
  speaker_adapt_alpha: 0.1
  speaker_adapt_max_drift: 0.9
  # Impronte della voce per satellite (15/10, calliope/impronte_satellite.py): per ogni persona
  # (famiglia, minori compresi, e conoscenti) e satellite un'impronta in più, imparata solo
  # dalle frasi sicure su quel satellite (e una per tipo di canale, il ripiego per un
  # satellite nuovo); il punteggio è il massimo fra l'impronta di sempre e quella del
  # satellite, la soglia non cambia. Caso vero del 15/10 in auto: chi amministra a 0,44 e 0,40
  # (ospite) con sei frasi sue a 0,60–0,76 negli stessi minuti, l'impronta ferma dalla deriva.
  # «spento» (di serie); «ombra»: si imparano e si salvano, nel registro dei turni il
  # punteggio nuovo e cosa avrebbe deciso, la decisione resta quella di oggi; «attivo»
  speaker_impronte_satellite: spento
  # Frasi sicure prima che nasca l'impronta del satellite (la media di queste, mai la prima)
  speaker_impronte_seme_frasi: 3
  # Frase sicura: voce di almeno tanti secondi, punteggio almeno `speaker_adapt_threshold` e
  # almeno questo margine sul secondo profilo (più largo di `speaker_id_margine`: impara solo
  # da frasi nette); mai zona grigia, frase breve, compagnia, voce incerta o minore vicino
  speaker_impronte_min_voce_s: 1.5
  speaker_impronte_margine: 0.15
  # Media mobile dell'aggiornamento e deriva massima: coseno minimo con l'impronta
  # dell'arruolamento (più largo di `speaker_adapt_max_drift`: il canale sposta l'impronta) e
  # con il seme del satellite (non scivola piano piano verso un'altra voce)
  speaker_impronte_alpha: 0.1
  speaker_impronte_deriva_arruolamento: 0.7
  speaker_impronte_deriva_seme: 0.85
  # Satelliti diversi ricordati per persona (i più vecchi escono)
  speaker_impronte_max: 12

minori:
  # Minori (05/10, calliope/minori.py, docs/ricerche/2026-10-05-minori.md): profili con la
  # data di nascita e i tutori, fasce d'età (piccoli < 7, bambini 7–10, ragazzi 11–13,
  # adolescenti 14–17) con un preset ciascuna (tono, fonti, internet, agenti, casa, PC,
  # documenti, acquisti, compiti, orari), ritoccabile per persona a voce (minore_gestisci) e
  # da terminale (python -m calliope.minori). Il preset arriva al modello come dato del turno,
  # i permessi li controlla il codice. false = i minori valgono come familiari (sconsigliato)
  minori_enabled: true
  # Voce incerta: se un adulto è riconosciuto ma un minore ha un punteggio a meno di questo
  # dal suo (e almeno nella zona grigia), vale il minore: mai un adulto per una voce dubbia
  minori_margine_ambiguo: 0.05
  # Il verso pericoloso (07/10): chi amministra è riconosciuto dalla voce, ma un minore ha un
  # punteggio a meno di questo dal suo. Resta lui (la sua conversazione), solo come familiare:
  # per ciò che vuole chi amministra serve una frase più chiara (la frase di sfida), regola
  # `amministra_minore_vicino`
  minori_margine_amministra: 0.12
  # Compiti: risposte sbagliate sullo stesso esercizio prima di spiegare la soluzione (e
  # avvisare i tutori). Decisione del 05/10: 5
  minori_compiti_tentativi: 5
  # Ogni quanti mesi ricordare ai tutori di rifare l'impronta di un minore: sotto i 14 anni e
  # dai 14 (la voce dei bambini cambia in fretta); anche prima se il riconoscimento cala
  minori_impronta_mesi:
  - 6
  - 12
  # Minuti di gioco al giorno per fascia (piccoli, bambini, ragazzi, adolescenti), sugli
  # schermi (05/10, calliope/schermi/giochi.py): il tutore li cambia per persona
  # (minore_gestisci imposta gioco_minuti=…), un adulto può dare tempo in più per oggi
  minori_gioco_minuti:
  - 20
  - 45
  - 60
  - 90
  # Giorni dopo cui una richiesta di un minore al tutore (un gioco, un'estensione, l'agente,
  # più tempo) senza risposta scade, con un avviso a chi l'aveva chiesta
  minori_richieste_giorni: 3.0
  # Secondi in cui un avviso di pericolo uguale (stesso minore, stesso argomento) non si
  # manda di nuovo ai tutori: una frase spezzata in due turni lo mandava due volte (prova
  # e2e del 06/10). Un argomento diverso parte sempre; 0 = ogni volta
  minori_avviso_ripetuto_s: 600.0
  # Il giro a due cancelli (09/10, calliope/cancelli.py): un segnale di pericolo poco chiaro
  # di un minore (una parola, un saluto, un modo di dire: lo decide il rilevatore) non manda
  # subito l'avviso. Cancello 1: una frase che rassicura e chiede se va tutto bene; cancello
  # 2: la sua risposta torna al rilevatore con il primo segnale (conferma → protezione e
  # avviso, smentita → niente avviso). Un segnale esplicito, o un giudizio guasto, vale come
  # prima (protezione e avviso subito). Caso vero dell'08/10: un adulto ospite preso per il
  # ragazzo saluta e il tutore riceve un avviso «sicurezza». false = ogni segnale come prima
  minori_pericolo_verifica: true
  # Secondi in cui il segnale da verificare aspetta la risposta (poi vale il silenzio); 0 =
  # senza limite (il silenzio non scatta mai: sconsigliato)
  minori_pericolo_attesa_s: 300.0
  # Senza risposta entro l'attesa: «avvisa» = avviso non urgente «da verificare, segnale
  # debole» ai tutori (scelta prudente: chi dice una cosa preoccupante e poi tace non resta
  # senza nessuno che lo sappia); «niente» = solo il registro dei turni
  minori_pericolo_silenzio: avvisa
  # Secondi in cui un secondo segnale poco chiaro dello stesso minore (dopo uno smentito o
  # senza risposta) vale confermato: protezione e avviso subito
  minori_pericolo_finestra_s: 1800.0
  # Un avviso «sicurezza» non si dice a voce al tutore sul satellite dove il minore ha
  # parlato da meno di tanti secondi (potrebbe essere lì vicino): una frase neutra e il testo
  # resta sul suo schermo personale; a voce più tardi. 0 = sempre a voce (come prima)
  minori_avviso_privato_s: 600.0
  # Una voce non riconosciuta (ospite) sul satellite dove un minore di casa ha parlato da meno
  # di `minori_ospite_vicino_s` secondi (16/10, issue #102: il 15/10 una bambina appena
  # registrata, con l'impronta ancora debole, presa 6 volte per ospite e trattata come un
  # adulto): nei dati del turno «potrebbe essere un minorenne» e il modo di parlare della
  # fascia più giovane sentita lì, senza nessun fatto sul minore (regola `ospite_con_minore`).
  # Livello e permessi restano da ospite. Scelta di chi amministra, di serie la più prudente:
  # vale anche per un ospite adulto vero, se la sua voce è vicina al minore (sotto). false =
  # l'ospite non riconosciuto ha sempre le risposte da adulto (come prima del 16/10)
  minori_ospite_vicino: true
  # Secondi dopo l'ultima frase del minore sullo stesso satellite in cui vale la nota (sopra)
  minori_ospite_vicino_s: 600.0
  # Con la voce, la nota scatta solo se il minore è tra i primi due profili della frase o ha
  # almeno questo punteggio sul suo (caso vero del 15/10: 0,32–0,45): un adulto lontano dal
  # profilo del minore resta senza nota (revisione della PR #116)
  minori_ospite_vicino_punteggio: 0.3
  # Quando è nato un avviso ai tutori (14/10, caso vero: un avviso «sicurezza» del 12/10 sera,
  # rimasto da dire vicino al ragazzo, è arrivato il 14/10 mattina senza data ed è stato preso
  # per un allarme nuovo). Minuti oltre i quali la voce dice quando è nato («ieri sera alle
  # 19:02», «lunedì 12/10 alle 19:02»); la scheda lo dice sempre
  avvisi_data_dopo_min: 15.0
  # Ore dopo cui un avviso urgente rimasto da dire si dice come non urgente, con la data
  # (il momento è passato: resta da sapere, non da correre). 0 = resta urgente
  avvisi_urgente_ore: 12.0
  # Ore in cui gli avvisi consegnati a un tutore (a voce o sullo schermo) restano nei dati
  # del suo turno, così a «cos'erano quegli avvisi?» il modello ha data, tipo, origine e
  # stato veri e non inventa. Più vecchi: minore_gestisci azione avvisi. 0 = mai nel turno
  avvisi_contesto_ore: 48.0
  # Un avviso di pericolo al tutore (14/10 sera, decisione di Dario che cambia la 0029 punto
  # 4) porta sulla sua scheda personale la trascrizione delle righe del segnale con un po' di
  # contesto, chi ha detto cosa. Mai a voce, mai su altri schermi, mai a un adulto non tutore:
  # il testo dell'avviso resta senza parole. false = come prima (solo l'argomento)
  avvisi_trascrizione: true
  # E l'audio di quelle frasi (calliope/avvisi_audio.py): in memoria un anello con l'audio dei
  # segmenti e dei turni in cui parla un minore (e, nella stanza, degli adulti di casa mentre
  # un minore è presente); solo quando nasce un avviso di pericolo i segmenti del segnale, con
  # un contesto breve, vanno in un file nel cassetto del tutore. In ombra niente su disco.
  # Di serie spento: si accende nel file locale
  avvisi_audio: false
  # Minuti e MB dell'anello in memoria (μ-law: 16 kB al secondo, 16 MB ≈ 17 minuti di voce)
  avvisi_audio_anello_min: 30.0
  avvisi_audio_anello_mb: 16.0
  # Secondi di contesto prima e dopo le frasi del segnale
  avvisi_audio_contesto_s: 20.0
  # Giorni dopo cui l'audio (nel cassetto) e la trascrizione di un avviso si cancellano
  avvisi_audio_giorni: 30.0
  # Esercizi generati da Calliope (08/10, calliope/esercizi/, docs/ricerche/
  # 2026-10-08-esercizi.md): matematica e italiano per i ragazzi di casa, a voce e sulla
  # scheda, con la correzione nel codice e il registro dei tentativi per i tutori; dal 12/10
  # anche logica, fisica e chimica (calcolabili, unità di misura in calliope/unita.py)
  esercizi_enabled: true
  # Il secondo modello che risolve da solo gli esercizi d'italiano (se non concorda,
  # l'esercizio si scarta). Vuoto = il modello della voce sullo stesso Ollama; sulla DGX si
  # può scegliere un modello più forte. Su Ollama (API nativa, output strutturato)
  esercizi_verifica_modello: ''
  esercizi_verifica_url: ''
  esercizi_verifica_timeout_s: 20.0
  # Esercizi d'italiano senza il secondo parere quando il modello non risponde (solo lessico e
  # Wikizionario). false = in quel caso niente esercizi d'italiano
  esercizi_senza_secondo_parere: false
  # Esercizi d'italiano controllati in anticipo per livello, in secondo piano
  esercizi_pronti: 3
  # Esercizi a campione nel riepilogo per i tutori (da controllare al posto della revisione)
  esercizi_campione: 3
  # Esercizi di un blocco prima della proposta «Facciamo una pausa o cambiamo?», detta dal
  # codice (12/10, caso vero: tabelline senza pause finché la bambina non ha detto «basta,
  # sono stanca»). Più corto per la primaria bassa (prima, seconda e terza elementare); chi
  # vuole blocchi diversi lo dice a voce («blocchi più corti») e resta salvato per persona
  esercizi_blocco_piccoli: 5
  esercizi_blocco: 10
  # Tappe del percorso «a tappe» (una tappa = un blocco), attivato a voce
  esercizi_tappe: 3
  # «A che punto siete?» (12/10 sera, decisione di Dario: si chiede spesso, non una volta
  # all'anno): a inizio sessione, per un minore, una domanda breve detta dal codice se
  # l'informazione su quella materia manca o ha più di tanti giorni; a metà sessione al più
  # una volta, se sbaglia molte risposte di fila o le fa tutte giuste al primo colpo. La
  # risposta stringe o sposta il limite del programma dentro l'anno. 0 = mai chiedere
  esercizi_punto_giorni: 14
  # Domande di un'interrogazione simulata («interrogami sulle addizioni»): aperte dagli
  # obiettivi dell'indice e conti corretti dal codice
  esercizi_interroga_domande: 5
  # Il modello guardiano (calliope/guardiano.py): giudica la domanda e ogni frase della
  # risposta prima della voce, solo per minori e ospiti. Su Ollama (lo stesso della voce se
  # guardiano_url è vuoto: llm_native_url). Scelta con prove/misura_guardiano.py (rapporto
  # §4). Vuoto = nessun guardiano (restano istruzioni e regole fisse)
  guardiano_enabled: true
  guardiano_modello: llama-guard3:8b
  guardiano_url: ''
  # Tempo massimo di un giudizio; oltre, per un minore la frase non si dice (guardiano_se_guasto
  # «blocca», una frase fissa al suo posto), per un ospite «passa»
  guardiano_timeout_s: 3.0
  guardiano_se_guasto: blocca
  # Sempre caricato (come la voce): la prima frase di un bambino non deve pagare il
  # caricamento del modello (secondi)
  guardiano_keep_alive: -1m
  guardiano_num_ctx: 2048
  # Anche per gli ospiti (un ospite può essere un bambino), con il filtro moderato: niente
  # sesso, istruzioni pericolose, odio; la protezione sì, senza avvisi
  guardiano_ospiti: true
  # Il rilevatore di pericolo sulla domanda (Guardiano.pericolo): i modelli di moderazione
  # non riconoscono un bambino che dice «lo zio mi picchia» (per loro è un testo innocuo);
  # lo fa un modello generale con l'output strutturato. gemma4 e4b: 9 su 10 sul banco,
  # nessun falso allarme. Se è il modello della voce si aspetta il suo giudizio prima della
  # risposta (stesso Ollama: in parallelo gli rovinerebbe la cache del prefisso, +1,4 s
  # sulla DGX col 26B); se è un altro (la DGX col 26B) gira in parallelo. Vuoto = il modello
  # della voce (con llm_backend «ollama»; altrimenti solo il guardiano). URL vuoto =
  # llm_native_url
  guardiano_pericolo: true
  guardiano_pericolo_modello: gemma4:e4b-it-qat
  guardiano_pericolo_url: ''

memoria:
  # Memoria persistente per persona (memory.py, SQLite). Ognuno vede solo i propri
  # fatti; degli ospiti non si salva nulla.
  # (variabile d'ambiente CALLIOPE_MEMORY_DB, che vince su questo file)
  memory_db: memoria.db
  # per persona; oltre si toglie il più vecchio
  memory_max_facts: 50
  # Appuntamenti (agenda.py, stesso file): l'avviso automatico arriva tanti minuti
  # prima; se ne manca meno, si segna solo l'appuntamento. 0 = nessun avviso.
  appuntamento_anticipo_min: 60

conversazioni:
  # Archivio delle conversazioni (05/10, calliope/conversazioni.py): ogni turno finito si
  # salva in un file a parte (i ricordi restano per sempre, le conversazioni `turn_log_days`
  # giorni), così la compressione e la fine di una conversazione non perdono niente e
  # conversazione_cerca ritrova «cosa ti avevo detto stamattina…». Ognuno ritrova solo le
  # sue. Anche la conversazione in corso, a ogni turno: un riavvio non la perde. Dal 12/10
  # (decisione 0028 T1, calliope/conserva.py) su disco solo quelle delle persone di casa
  # riconosciute (dal 16/10, decisione 0031, anche dei minori), per gli stessi giorni del
  # registro dei turni (prima `conversazioni_giorni`, 30): quelle degli ospiti restano in
  # memoria fino al riavvio (le vede solo chi amministra, a voce)
  conversazioni_enabled: true
  # (variabile d'ambiente CALLIOPE_CONVERSAZIONI_DB, che vince su questo file)
  conversazioni_db: conversazioni.db
  # Ricerca per significato: il modello di embedding sul server del modello (Ollama
  # /api/embed; con un indirizzo che finisce in /v1, /v1/embeddings). Vuoto = solo ricerca
  # per parole (FTS5). Scelto il 05/10 sul banco delle conversazioni (vedi il rapporto
  # docs/ricerche/2026-10-05-contesto-compressione.md): da scaricare con ollama pull
  conversazioni_embedding: qwen3-embedding:0.6b
  # Il server degli embedding; vuoto = l'Ollama della voce (con la voce su vLLM, l'Ollama
  # locale su 127.0.0.1:11434)
  conversazioni_embedding_url: ''
  # Embedding sulla CPU (Ollama num_gpu: 0): sul portatile la VRAM serve a voce e Whisper,
  # e un modello in più farebbe scaricare quello della voce
  conversazioni_embedding_cpu: true
  # I vettori dei turni archiviati si calcolano solo con Calliope inattiva da questi secondi
  # (06/10, prova e2e sulla DGX: il primo embedding caricava qwen3-embedding e scacciava il
  # guardiano o la voce da un Ollama pieno), a lotti, e il modello si scarica subito dopo.
  # Se il modello è già caricato si calcolano anche prima. Finché mancano, la ricerca
  # nell'archivio va per parole (FTS5)
  conversazioni_vettori_inattivita_s: 600.0
  # Una conversazione nuova della stessa persona nello stesso posto, entro queste ore dalla
  # fine della precedente, parte con la riga «l'ultima volta avete parlato di…». 0 = mai
  conversazione_ripresa_ore: 4.0
  # Una conversazione chiusa per una pausa (storia_inattiva_s) lascia alla nuova della stessa
  # persona i suoi ultimi scambi, solo le frasi dette, per `conversazione_ripresa_ore` (09/10,
  # caso vero della DGX: dopo 10 minuti «cos'è che ti ho chiesto?» non aveva niente, e il
  # riassunto di chiusura arriva in secondo piano dopo). 0 = solo il riassunto, come prima
  conversazione_coda_scambi: 3
  # Risposte del modello della voce insieme (06/10, calliope/corsie.py: più persone da
  # satelliti diversi). Oltre, chi parla sente «Sto rispondendo anche a un'altra persona:
  # dammi un attimo.» e aspetta il suo turno, in ordine d'arrivo; una risposta cominciata
  # non si interrompe. 1 per Ollama: misurato sulla DGX il 06/10 (gemma4 26B, Ollama 0.35),
  # Ollama risponde comunque a una richiesta alla volta (con 2 insieme la seconda prima
  # frase arriva dopo la fine della prima risposta, con 3 la terza dopo le altre due): con
  # 1 chi aspetta sente subito la frase della coda (0,5–1,1 s) invece del silenzio, e i
  # tempi delle risposte restano quelli. Con un motore che risponde a più richieste insieme
  # (vLLM) conviene di più. Misure in docs/ricerche/2026-10-06-conversazione-persona.md.
  # 0 = nessun limite
  conversazioni_parallele: 1
  # La stessa frase presa da un'altra corsia entro questi secondi (due satelliti nella stessa
  # stanza la sentono tutti e due) è un doppione: risponde solo il primo. 0 = mai
  conversazione_doppione_s: 2.0
  # La conversazione come registro degli eventi (10/10, decisione 0027, calliope/eventi/,
  # progetto docs/ricerche/2026-10-10-registro-eventi.md): un registro per persona (anonimo
  # per satellite per ospiti e voci incerte), in sola aggiunta, nella tabella `eventi` di
  # conversazioni.db. «ombra» (passi 0 e 1): gli eventi si scrivono accanto alla storia di
  # Brain, che resta la fonte; a ogni turno la proiezione del contesto si confronta con lei e
  # il registro dei turni scrive le differenze per meccanismo (`parlato`, `eventi_ombra`:
  # calliope stato --turni). Nessun cambiamento di ciò che Calliope dice, tranne «dimentica le
  # nostre conversazioni», che con il registro acceso chiude anche la conversazione in corso
  # (§ 2.4). «spento»: niente eventi né confronti, come prima. «attivo» (passo 3, dal 10/10):
  # Brain legge il contesto dalla proiezione degli eventi (ciò che si è sentito, risultati
  # sigillati alla scrittura, promemoria non parlati nel blocco dello stato) e una conversazione
  # non si azzera più: cambia argomento (tool `argomento`, «ricominciamo» è un indizio per il
  # modello). Si accende a mano nel file locale; per tornare indietro «ombra»
  eventi: ombra
  # Dopo questi giorni gli eventi di una conversazione chiusa si cancellano: resta la forma dei
  # turni nell'archivio (§ 2.3). 0 = mai. Dal 12/10 60 (decisione 0028, T1: si tengono per
  # misurare, come i turni); solo quelli delle persone di casa, minori compresi dal 16/10
  # (decisione 0031): i registri degli ospiti non vanno mai su disco (calliope/conserva.py)
  eventi_giorni: 60
  # Avviso in `calliope stato` se il registro cresce oltre questi MB al giorno (§ 10, punto 3)
  eventi_avviso_mb: 50.0
  # Avviso in `calliope stato --turni` se costruire la proiezione del contesto costa più di
  # questi millisecondi (§ 10, punto 2: dal passo 3 sta nel percorso della risposta)
  eventi_contesto_ms_avviso: 20.0

biblioteca:
  # Biblioteca offline (calliope/biblioteca.py): Wikipedia italiana in file ZIM di Kiwix,
  # scaricati con biblioteca/scarica.sh. Se i file mancano la biblioteca è spenta e
  # Calliope funziona uguale. Il «mini» (introduzioni + infobox, 2,3 GB) risponde alla
  # maggior parte delle domande sui fatti; il completo (8,4 GB) si legge solo quando
  # nel mini non c'è niente di convincente. Vikidia è l'enciclopedia per ragazzi.
  biblioteca_enabled: true
  biblioteca_mini: biblioteca/wikipedia_it_all_mini_2026-08.zim
  biblioteca_completa: biblioteca/wikipedia_it_all_nopic_2026-08.zim
  # Vikidia, enciclopedia per ragazzi: usata solo per le spiegazioni semplici (chi parla
  # è un minore con Vikidia nel preset, calliope/minori.py, oppure chiede «in modo
  # semplice»), con la precedenza
  biblioteca_ragazzi: biblioteca/vikidia_it_all_nopic_2026-09.zim
  biblioteca_ragazzi_vantaggio: 1.5
  # Wikizionario: significati, sinonimi e contrari («cosa significa effimero?»)
  biblioteca_dizionario: biblioteca/wiktionary_it_all_nopic_2026-08.zim
  # passaggi restituiti al modello
  biblioteca_k: 3
  # voci candidate lette per domanda
  biblioteca_voci: 6
  # paragrafi considerati per voce
  biblioteca_paragrafi: 12
  # lunghezza massima di un passaggio
  biblioteca_max_caratteri: 450
  # Sotto questo punteggio il passaggio migliore del mini non convince: si guarda nelle
  # voci complete
  biblioteca_soglia_completa: 3.0
  # Ricerca per parole (dal 01/10/2026, al posto di libzim e Xapian): un indice SQLite
  # FTS5 per Wikipedia ridotta e Vikidia, in biblioteca/indici/ (~1,3 GB, ~3–6 minuti
  # dopo il download; python -m calliope.biblioteca_indice). Peso del titolo nel bm25:
  # provati 1, 5, 10, 20, 50; con 1 il banco va meglio (49/56 contro 48/56).
  biblioteca_peso_titolo: 1.0
  # Processi per costruire l'indice: l'inserimento in SQLite è uno solo, oltre 6–12 non
  # si guadagna. 4 lascia la CPU a Calliope se l'indice si prepara mentre è accesa.
  biblioteca_indice_processi: 4
  # Altre fonti italiane di Kiwix da usare nella ricerca (prefissi dei file), se scaricate
  # (a voce, calliope/installa) e con il loro indice. Dal 01/10 la ricerca sa usare solo
  # Wikiquote, e solo quando si chiede una citazione o chi ha detto una frase; le altre
  # (Wikisource, Gutenberg, WikiMed…) si scaricano ma restano da parte. [] = nessuna.
  biblioteca_fonti_extra:
  - wikiquote_it_all_nopic

installa:
  # Installazioni a voce e da terminale (calliope/installa/): solo dal catalogo nel codice,
  # solo chi amministra, sempre con una proposta e un sì. false = niente tool d'installazione.
  installa_enabled: true
  # Velocità supposta per la stima del tempo: dal mirror di Kiwix 9 GB in 13 minuti il
  # 26/09 (biblioteca/scarica.log), ~11 MB/s
  installa_velocita_mb_s: 10.0
  # Spazio da lasciare libero sul disco oltre al file: sotto, il download non parte
  installa_margine_gb: 2.0

pc:
  # == Il PC su cui gira Calliope; con audio_modo: satellite, quello del satellite. Sul
  # == satellite valgono pc_enabled, pc_nome, pc_app e pc_risultati di questa sezione;
  # == la webcam è satellite_webcam.
  # Controllo del PC (calliope/pc/, docs/ricerche/2026-09-26-controllo-pc.md): volume,
  # musica, luminosità, app, blocco e ricerca di file sul PC dove gira Calliope. Se non
  # è Windows o mancano le librerie (pycaw, pywin32, winrt…) i tool pc_* non ci sono.
  pc_enabled: true
  # Come Calliope chiama questo PC nelle risposte («sul portatile il volume è a 40»)
  pc_nome: portatile
  # Chi può vedere i programmi aperti, cercare e aprire file su questo PC: rivelano cosa
  # fa una persona. Nomi o id dei profili di speakers.json; chi amministra può sempre.
  # Vuoto = solo chi amministra.
  pc_proprietari: []
  # Gli ospiti (voce non riconosciuta) possono cambiare il volume e comandare la musica?
  # Predefinito no: una voce qualunque, anche dalla TV, potrebbe farlo.
  pc_ospite_volume_media: false
  # Punti di volume o luminosità per «alza»/«abbassa» senza numero o con «un po'»;
  # «un pochino» vale la metà, «molto» il doppio
  pc_passo: 10
  # Risultati tenuti da una ricerca di file: a voce se ne dicono al massimo tre
  pc_risultati: 5
  # App che si aprono a voce: nome detto → comando. Solo queste: il modello sceglie il
  # nome, mai il comando. Il comando è un programma nel PATH o registrato in Windows
  # (winword.exe), un protocollo (ms-settings:), un percorso completo, oppure «browser»
  # (il browser predefinito). Le voci non installate si tolgono all'avvio.
  pc_app:
    calcolatrice: calc.exe
    blocco note: notepad.exe
    esplora file: explorer.exe
    impostazioni: 'ms-settings:'
    browser: browser
    word: winword.exe
    excel: excel.exe
  # Con audio_modo: satellite il PC comandato è quello del satellite (il portatile Windows,
  # esecutore remoto, 03/10): tempo massimo di ogni richiesta, poi «il portatile non
  # risponde». Un tool ne fa 1–3 (schermo bloccato, lettura, azione); in LAN e in VPN una
  # richiesta costa qualche decina di ms
  pc_remoto_timeout_s: 2.0
  # La webcam di pc_guarda (05/10) quando Calliope gira su questo PC: il nome come lo mostra
  # Windows («HD Pro Webcam C920»); vuoto = la prima trovata. Letta con PyAV (DirectShow),
  # che c'è già con faster-whisper. Sul satellite vale satellite_webcam
  pc_webcam: ''

documenti:
  # Documenti Word, Excel e PDF a voce (calliope/documenti/): l'LLM scrive solo il
  # contenuto in JSON, con una richiesta a parte; il file lo fa il codice. Senza
  # python-docx, openpyxl o fpdf2 quel formato non c'è; senza nessuna, niente tool.
  documenti_enabled: true
  # Dove finiscono i file. Vuoto = la cartella Documenti dell'utente (chiesta a Windows,
  # segue OneDrive), sottocartella «Calliope». Il JSON per le modifiche sta in memory_db.
  documenti_cartella: null
  # Font TrueType del PDF, per accenti, «€» e virgolette tipografiche: nomi di font di
  # sistema (senza .ttf) o percorsi, vale il primo che c'è. Se non ce n'è nessuno il PDF
  # usa Helvetica, che scrive «EUR» al posto di «€».
  documenti_font:
  - arial
  - segoeui
  - calibri
  - DejaVuSans
  - LiberationSans-Regular
  # Secondi che il tool aspetta il file prima di passarlo in secondo piano: entro questo
  # tempo Calliope dice subito «ho preparato…», dopo «te lo preparo» e lo annuncia a file
  # pronto. Misure del 27/09: tabelle ed elenchi 1–2 s, lettere 3,5–7 s. Nel frattempo
  # Ollama è occupato: una domanda detta durante la generazione aspetta che finisca.
  documenti_attesa_s: 4.0
  # Tetto ai token del JSON di un documento (una lettera ne usa ~250)
  documenti_max_token: 2048

casa:
  # La città (o il paese) dove sta la casa (09/10, caso della DGX: «che tempo fa?» cercava
  # il meteo senza luogo e rispondeva «non so dove ti trovi»). Va nel prompt di sistema,
  # uguale per tutti (anche per gli ospiti: è un dato della casa, non di una persona, e il
  # prefisso resta in cache): per il meteo e ciò che dipende dal luogo, se chi parla non ne
  # nomina un altro. Solo la città, MAI l'indirizzo (quello va in web_dati_privati). Non
  # metterla in web_dati_privati, altrimenti si toglie dalle ricerche. Il valore vero in
  # calliope.locale.yaml. Vuoto = Calliope non sa dov'è la casa (e lo chiede)
  casa_citta: ''
  # Casa a voce (calliope/casa/): luci, tapparelle, termostato, prese e sensori tramite
  # Home Assistant. Senza indirizzo o senza token i tool casa_comando e casa_stato non ci
  # sono, e casa_integrazione spiega a voce cosa manca. Calliope parte anche con HA spento.
  casa_enabled: true
  # Indirizzo di casa di Home Assistant: https, IP del Raspberry e porta 8123. Mai il nome
  # DuckDNS (principio 9: Calliope resta dentro casa). Vuoto = casa non collegata.
  casa_url: null
  # In casa il certificato è quello del nome DuckDNS: sull'IP il nome non combacia. Qui il
  # nome atteso (es. casa-mia.duckdns.org): ci si collega all'IP e si verifica il
  # certificato con questo nome (SNI), con i certificati di sistema. Regge i rinnovi.
  casa_tls_nome: null
  # In alternativa l'impronta SHA-256 del certificato («AB:CD:…», la stampa
  # prove/sonda_ha.py): va bene anche per un certificato fatto in casa, ma cambia a ogni
  # rinnovo. Se c'è, vince su casa_tls_nome.
  casa_tls_impronta: null
  # File PEM di un'autorità di certificazione propria. Vuoto = certificati di sistema.
  casa_tls_ca: null
  # false = nessuna verifica del certificato: solo come scelta esplicita, con un avviso a
  # ogni avvio
  casa_tls_verifica: true
  # Tempo massimo di una richiesta a Home Assistant; oltre si dice «la casa non risponde».
  # Con l'HA finto verifica ed esecuzione costano pochi millisecondi; su un Raspberry Pi piccolo si stima
  # 0,1–0,5 s a frase (da misurare con prove/sonda_ha.py)
  casa_timeout_s: 4.0
  # Tempo massimo per collegarsi, anche alla prima richiesta dopo che HA era giù
  casa_connessione_s: 3.0
  # Ogni quanti secondi si rilegge cosa è esposto: una luce esposta dopo l'avvio arriva da sola
  casa_aggiorna_s: 300.0
  # Per quanti secondi l'ultimo dispositivo comandato o letto resta il riferimento di
  # «accendila», «spegnilo», «alzale» (messaggio al modello prima della domanda, 01/10)
  casa_riferimento_s: 300.0
  # L'agente di conversazione che esegue i comandi: quello integrato di Home Assistant,
  # senza LLM, con le sue frasi italiane fisse
  casa_agente: conversation.home_assistant
  # Domini che si leggono ma non si comandano mai, anche se esposti: serrature e allarme.
  # L'agente di HA non chiede conferme né PIN: «sblocca la porta» la aprirebbe davvero.
  casa_sola_lettura_domini:
  - lock
  - alarm_control_panel
  # Lo stesso per tipo (device_class) di tapparelle e sensori: porta del garage e cancello
  casa_sola_lettura_classi:
  - garage
  - gate
  - gas
  - water
  # Interruttori, pulsanti, valvole, sirene, input_boolean e tapparelle senza classe (o
  # «door») il cui nome, stanza o alias contiene una di queste parole intere (con «*» in
  # fondo anche come inizio: «cancell*» prende «cancello» e «cancelletto») si leggono e non
  # si comandano: un relè del cancello è spesso uno switch (analisi di sicurezza del
  # 03/10). Le luci no. Per uno switch voluto: casa_consentiti
  casa_nomi_delicati:
  - cancell*
  - garage
  - box
  - portone
  - portoncino
  - porta
  - porte
  - serratur*
  - allarm*
  - antifurto
  - siren*
  - gas
  - acqua
  - idric*
  - caldaia
  # Scene, script e automazioni che si possono avviare (id o nome): le altre no, perché
  # potrebbero fare qualunque cosa, anche aprire una serratura. Vuoto = nessuna.
  casa_consentiti: []
  # Domini che anche un ospite (voce non riconosciuta) può comandare e leggere, es.
  # ["light"]. Predefinito nessuno: una voce qualunque, anche dalla TV, potrebbe farlo.
  casa_ospite_domini: []

schermi:
  # Schermi (calliope/schermi/, fase 1 di docs/ricerche/2026-10-01-mappe-e-schermi.md): un
  # server web in un thread di Calliope serve una pagina da tenere aperta in kiosk; gli
  # schermi abbinati con un codice di 6 cifre ricevono le schede dei tool (liste, timer,
  # biblioteca, documenti, casa). Senza starlette e uvicorn Calliope parte uguale.
  schermi_enabled: true
  # Dove ascolta il server. 127.0.0.1 = solo il browser di questo PC, in http (contesto
  # sicuro: il token non esce dal computer). Per tablet e TV di casa: 0.0.0.0 (o l'IP del
  # PC), mai inoltrato dal router; in rete la pagina va in HTTPS (02/10), con il
  # certificato qui sotto: senza, il server non parte (salvo schermi_senza_tls)
  schermi_indirizzo: 127.0.0.1
  # Porta del server (8123 è di Home Assistant, 11434 di Ollama)
  schermi_porta: 8770
  # La stanza del microfono: le schede vanno agli schermi di questa stanza. Vuoto = tutti
  # gli schermi abbinati (oggi il microfono è uno; con i satelliti la stanza la darà il
  # satellite che ha sentito la frase). Le schede personali vanno solo agli schermi
  # personali di chi parla, in qualunque stanza.
  schermi_stanza: ''
  # Le schede partono da sole quando un tool finisce (lista, timer, biblioteca…); false =
  # solo quando si chiede «mostramelo sullo schermo»
  schermi_automatiche: true
  # Minuti di validità del codice di abbinamento che mostra uno schermo nuovo
  schermi_codice_min: 10.0
  # Giorni senza un collegamento dopo i quali uno schermo o un satellite abbinato si segnala
  # (all'avvio, in «calliope stato», negli elenchi da terminale): solo un avviso, la revoca
  # la decide chi amministra. 0 = nessun avviso
  schermi_inattivi_giorni: 7.0
  # Schede tenute per schermo e rimandate quando la pagina si ricollega; anche quante schede
  # della cronologia di una persona riceve un suo schermo personale che si collega
  schermi_cronologia: 6
  # La cronologia delle schede per persona, su disco (08/10, schermi/cronologia.py): le
  # schede personali di chi è riconosciuto restano anche dopo un riavvio, e uno schermo
  # personale nuovo (un satellite o un telefono appena abbinati) le ritrova. Mai schede di
  # stanza, della zona grigia o di un'altra persona. false = solo in memoria, come prima
  schermi_cronologia_persona: true
  # La cartella dei file (uno per persona, permessi 600 fuori da Windows): vuota = «schede»
  # accanto a conversazioni.db
  schermi_cronologia_cartella: ''
  # Giorni di tenuta, e tetto per persona in numero di schede e in MB (oltre, escono le più
  # vecchie): come il cassetto dei file, una settimana
  schermi_cronologia_giorni: 7.0
  schermi_cronologia_max: 40
  schermi_cronologia_mb: 4.0
  # La scheda «Conversazione» degli schermi personali (08/10): quanti turni della persona
  # (dall'archivio delle conversazioni, con la sua scadenza) si ricaricano su uno schermo
  # che si collega. 0 = niente scheda
  schermi_chat_turni: 80
  # Nomi con cui gli schermi raggiungono il server oltre agli IP, a «localhost» e al nome
  # di questo PC (es. calliope.lan): gli altri si rifiutano (difesa dal DNS rebinding)
  schermi_nomi: []
  # Certificato e chiave della pagina in rete (HTTPS), relativi alla cartella del file di
  # configurazione. Vuoti = quelli dei satelliti (satellite_tls_cert, satellite_tls_chiave,
  # fatti da python -m calliope.satellite --certificato). Autofirmati: un tablet mostra
  # l'avviso del browser la prima volta; il satellite apre la pagina fidandosi solo di
  # quel certificato (calliope/schermi/tls.py)
  schermi_tls_cert: ''
  schermi_tls_chiave: ''
  # Solo come ultima scelta: la pagina in rete senza HTTPS (token in chiaro), con un
  # avviso a ogni avvio. Su 127.0.0.1 resta comunque http
  schermi_senza_tls: false
  # Scrivere invece di parlare (03/10, calliope/schermi/moduli.py): sugli schermi personali
  # (e sulla web app del telefono) una casella per scrivere a Calliope, e i moduli per i
  # dati difficili da dettare (partita IVA, codice fiscale, IBAN, email). Il testo vale come
  # una frase del proprietario dello schermo; per ciò che vuole la voce di chi amministra
  # (installazioni, fatture, schermo personale, codice all'agente) serve comunque la voce
  schermi_scritto: true
  # Anche dagli schermi di stanza (non personali): lì chi scrive conta come un ospite
  schermi_scritto_stanza: false
  # Caratteri al massimo di un testo scritto, e invii al minuto per schermo (testo e moduli)
  schermi_scritto_max: 500
  schermi_scritto_al_minuto: 12
  # Secondi in cui un modulo resta aperto sullo schermo
  schermi_moduli_s: 900.0
  # «Scarica» nella scheda del documento (07/10, schermi/scarica.py): l'indirizzo del file
  # (MD, PDF o Word, convertito al clic) vale tanti secondi, solo per lo schermo personale a
  # cui è arrivata la scheda; poi va richiesto di nuovo dalla scheda
  schermi_scarica_s: 180.0
  # Il telefono come satellite (03/10, docs/ricerche/2026-10-03-webapp-telefono.md): la
  # pagina /telefono dello stesso server è una web app installabile (PWA) con il microfono,
  # la wake word nel telefono e la voce di Calliope. Serve audio_modo: satellite (Calliope
  # sul server) e la libreria websockets; si abbina come un satellite
  telefono_enabled: true
  # La cartella di onnxruntime-web (wake word e VAD nel browser), relativa alla cartella di
  # Calliope: la riempie python -m calliope.stato --installa telefono
  telefono_web: models/web

immagini:
  # Foto in ingresso (05/10, calliope/immagini.py, docs/ricerche/2026-10-05-immagini.md):
  # dal telefono e dagli schermi personali (pulsante «Foto», file, trascina, incolla), dalla
  # webcam e dallo schermo del PC su richiesta (pc_guarda). Solo in memoria, legate alla
  # conversazione; su disco solo con «archiviala». Spente: niente pulsante né tool
  immagini_enabled: true
  # Il modello della voce vede le immagini? "auto" (Ollama: capacità «vision» di
  # /api/show; API OpenAI: sì), "si", "no". Gemma 4 (e4b e 26B) e qwen3.6 le vedono
  immagini_modello: auto
  # Lato lungo in pixel dopo la riduzione (JPEG): con Gemma 4 su Ollama ~1 token ogni
  # 2 250 pixel (1024 → ~350 token, 1280 → ~540, 1568 → ~830; misura del 05/10); a 1024 lo
  # scontrino di prova perdeva l'allineamento dei prezzi, a 1280 no
  immagini_lato_max: 1280
  immagini_pixel_per_token: 2250.0
  # Byte al massimo di un'immagine caricata (prima della riduzione)
  immagini_max_mb: 12.0
  # Le foto nella storia: "messaggio" (ogni foto resta nel messaggio dove è arrivata finché
  # dura la conversazione: la cache del prefisso la copre) oppure "descrizione" (nei turni
  # dopo solo una frase fatta dal modello, e immagine_guarda per riguardarla). Scelta e
  # misure nel rapporto, § 5
  immagini_storia: messaggio
  # Foto al massimo per conversazione (oltre, la più vecchia esce)
  immagini_max_conversazione: 6
  # Secondi in cui una foto mandata senza domanda aspetta la frase dopo della persona
  immagini_attesa_s: 120.0
  # Secondi dopo la perdita di una foto in attesa (conversazione finita con «esci» o
  # scaduta, attesa scaduta) in cui il turno dopo della persona riceve il dato «la foto non
  # c'è più, chiedi di rimandarla», invece di una causa inventata dal modello (16/10, #96,
  # DGX 15/10). Oltre, il dato non vale più (la persona parla d'altro); 0 lo spegne
  immagini_persa_s: 600.0

allegati:
  # Allegati di qualsiasi tipo (05/10, calliope/allegati.py, docs/ricerche/2026-10-05-allegati.md):
  # dal pulsante «Allega» del telefono e degli schermi personali (scegli, trascina, incolla),
  # con la vita delle foto (la conversazione) e le stesse regole (solo durante una
  # conversazione a voce, solo schermi personali). Il tipo vero viene dai byte; il contenuto
  # arriva al modello come dato non fidato. Spenti: niente pulsante per i file né tool
  allegati_enabled: true
  # Byte al massimo di un file, e in memoria per tutti i file di una conversazione
  allegati_max_mb: 25.0
  allegati_memoria_mb: 100.0
  # File al massimo per conversazione (oltre, il più vecchio esce)
  allegati_max_conversazione: 8
  # Token al massimo del contenuto di un file nel messaggio (un file più lungo entra come
  # estratto, e il resto si legge con allegato_leggi), e di tutti i file della conversazione
  # (oltre, i più vecchi restano solo come scheda: nome, tipo, parti). Comunque al più un
  # sesto della finestra di contesto
  allegati_token_file: 2500
  allegati_token_totale: 5000
  # PDF: pagine lette al massimo, e pagine scansionate (senza testo) date al modello come
  # immagini (con un modello che vede le immagini)
  allegati_pdf_pagine: 200
  allegati_pdf_pagine_immagini: 3
  # Audio: si trascrive con il Whisper della voce solo fino a tanti secondi (oltre, solo nome,
  # tipo e durata: la voce resterebbe ferma troppo)
  allegati_audio_max_s: 180.0
  # Il cassetto dei file per persona (08/10, calliope/cassetto.py, decisione del 07/10): ogni
  # foto, file o audio mandato da chi è riconosciuto resta `cassetto_giorni` giorni sulla
  # macchina di Calliope, poi si elimina (e Calliope lo dice la volta dopo). Si ritrova a
  # voce («il file che ti ho mandato ieri»); alla prima conversazione del giorno, se qualcosa
  # scade entro `cassetto_avviso_giorni`, una frase e la scheda col carosello sullo schermo
  # personale (Tieni nei documenti di casa, Elimina, Tieni ancora). Mai per gli ospiti. Oltre
  # `cassetto_mb_persona` il file resta solo nella conversazione e Calliope lo dice. Spento:
  # i file vivono solo nella conversazione, come prima
  cassetto_enabled: true
  # Cartella dei file (vuoto = «cassetto» accanto a memory_db); l'indice sta in memory_db
  cassetto_cartella: ''
  cassetto_giorni: 7.0
  cassetto_mb_persona: 500.0
  cassetto_avviso_giorni: 2.0
  # Ogni quanti secondi si eliminano i file scaduti (anche all'avvio)
  cassetto_pulizia_s: 3600.0

server_satelliti:
  # == Lato server (dove gira Calliope, la DGX): microfono e casse sono di un
  # == satellite in rete. Sul portatile che fa da satellite: sezione satellite.
  # Microfono e casse (calliope/satellite/, docs/ricerche/2026-10-02-satellite.md):
  #   "locale"    → quelli di questo computer, come sempre;
  #   "satellite" → quelli di un satellite in rete (il portatile, domani una stanza): qui
  #                 restano Whisper, modello, voce e tool; sul satellite wake word, VAD e
  #                 riproduzione. Da addormentata l'audio non lascia il satellite finché
  #                 non scatta la wake word acustica. Serve a Calliope sulla DGX.
  # (variabile d'ambiente CALLIOPE_AUDIO_MODO, che vince su questo file)
  audio_modo: locale
  # Dove il server ascolta i satelliti. 127.0.0.1 = solo questo computer (satellite e
  # Calliope sulla stessa macchina). In rete (0.0.0.0) serve il certificato qui sotto:
  # l'audio di casa e il token attraversano la rete dell'ufficio anche dentro la VPN
  satellite_indirizzo: 127.0.0.1
  # Porta del server dei satelliti (8770 è degli schermi, 47913 il lucchetto d'istanza)
  satellite_porta: 8771
  # Certificato e chiave del server (TLS), relativi alla cartella del file di
  # configurazione e fuori da git: si creano con python -m calliope.satellite
  # --certificato (usa openssl). Il satellite fissa l'impronta SHA-256, niente CA.
  satellite_tls_cert: satellite.crt
  satellite_tls_chiave: satellite.key
  # Solo come ultima scelta: ascoltare in rete senza TLS (audio e token in chiaro), con un
  # avviso a ogni avvio. Su 127.0.0.1 il TLS non è obbligatorio (si usa se c'è il file)
  satellite_senza_tls: false
  # Minuti di validità del codice di abbinamento che mostra un satellite nuovo
  satellite_codice_min: 10.0
  # Connessioni insieme sulla porta dei satelliti (anche anonime, in attesa del saluto):
  # oltre si chiudono subito (prima 300 connessioni mute davano 600 thread)
  satellite_max_connessioni: 16
  # Lato server: la pagina /satellite (e /installa sulla porta dei satelliti) con il comando
  # che fa diventare satellite un PC Windows nuovo, e il pacchetto del satellite per gli
  # aggiornamenti automatici dei satelliti installati così (calliope/satellite/web.py). Solo
  # con il TLS dei satelliti. false = spenta
  satellite_installazione: true
  # Tutti i satelliti ascoltano e parlano insieme (06/10, calliope/corsie.py): ognuno ha la
  # sua corsia, e da stanze diverse più persone parlano a Calliope nello stesso momento.
  # false = come prima del 06/10: un satellite attivo alla volta (il telefono lo prende con
  # «Parla»)
  satelliti_insieme: true

conversazione_stanza:
  # ── conversazione di stanza (13/10, decisione 0029; docs/ricerche/2026-10-13-conversazione-
  # di-stanza.md). Passo 1, «ombra»: i satelliti che lo sanno fare (protocollo 3: satellite
  # Python aggiornato, telefono) mandano anche il parlato della stanza, chiuso dal loro VAD;
  # Calliope lo trascrive a bassa precedenza (il turno passa sempre prima), sa chi ha detto
  # cosa e chi è presente, e lo tiene **solo in memoria** (al più 24 h, si perde al riavvio);
  # niente arriva al modello: si misura (`calliope stato --turni`, sezione «Stanza»). L'audio
  # non va mai su disco. Sugli schermi della stanza «Ascolto la stanza»; si ferma a voce
  # («Calliope, abbiamo ospiti»: 4 ore; tool stanza_pausa). «spenta» (di serie): nessun flusso,
  # niente caricato. Si accende per satellite nel file locale
  stanza: spenta
  # I satelliti con la stanza accesa, per nome (`calliope satellite --elenco`); vuoto = tutti
  stanza_satelliti: []
  # Tetto di un segmento della stanza: un pezzo breve va meglio a Whisper e a chi parla (la
  # frase dei comandi resta a max_utterance_s)
  stanza_segmento_max_s: 20.0
  # Taglio morbido al tetto (14/10): negli ultimi `stanza_taglio_zona_s` prima del tetto il
  # segmento si chiude alla prima micro-pausa (VAD sotto soglia per `stanza_pausa_breve_ms`,
  # molto meno di silence_ms: chiusura «pausa_breve»), così il taglio non spezza una parola;
  # senza pause si chiude comunque `stanza_tetto_duro_s` dopo il tetto (chiusura «lunga»). Il
  # pezzo dopo riparte dal pre-roll, senza perdere parlato. 0 nella zona = taglio netto al tetto
  stanza_taglio_zona_s: 4.0
  stanza_pausa_breve_ms: 160
  stanza_tetto_duro_s: 5.0
  # All'interpellazione i segmenti detti prima passano davanti: la misura dice quante volte
  # finirli costa più di così dalla domanda (passo 2: oltre, la frase d'attesa)
  stanza_recupero_max_s: 1.5
  # Audio della stanza in coda oltre il quale i segmenti più vecchi si buttano (motivo
  # «coda_piena»): con Whisper occupato a lungo la stanza non cresce senza fine
  stanza_coda_max_s: 600.0
  # Silenzio che chiude uno scambio (l'unità del riassunto e della corsia lenta, passi dopo)
  stanza_scambio_pausa_s: 300.0
  # Chi è presente: voce riconosciuta sopra soglia negli ultimi secondi (§ 3.7, § 3.5 ter)
  stanza_presenza_s: 600.0
  # «Calliope, abbiamo ospiti» ferma l'ascolto della stanza su quel satellite per queste ore
  # (risposta 6 di chi amministra); «metti in pausa la stanza» senza durata: questi minuti
  stanza_ospiti_ore: 4.0
  stanza_pausa_min: 60.0
  # Passo 2 (14/10, calliope/stanza/contesto.py): all'interpellazione le righe della stanza
  # del satellite (chi ha detto cosa) vanno nei dati del turno, in busta come dato non fidato
  # (fonte «stanza»: un comando detto dalla TV resta una riga, e un bersaglio preso da lì conta
  # per la politica come «dal dato»), dopo la storia e prima della frase: la storia resta in
  # cache, il blocco si rilegge a ogni turno (`cache.riletti` e prima frase con e senza blocco
  # in `calliope stato --turni`, sezione «Stanza»). Prima della risposta si aspetta il
  # recupero delle righe ancora in coda al più `stanza_recupero_max_s`. Anche il giudizio
  # «rivolta a Calliope?» (in compagnia, in ombra) riceve le ultime righe. Vale solo con la
  # stanza accesa; in pausa («abbiamo ospiti») niente blocco; «dimentica» lo svuota con la
  # stanza. false (di serie) = come il passo 1: niente al modello
  stanza_contesto: false
  # Quanto indietro guarda il blocco (gli «ultimi minuti alla lettera» del § 3.5)
  stanza_caldo_min: 8.0
  # Le righe di questi ultimi secondi entrano sempre, per intero e nell'ordine, anche oltre il
  # tetto: è ciò che «tu che ne pensi?» presuppone (richiesta di chi amministra, 13/10)
  stanza_caldo_sempre_s: 45.0
  # Tetto del blocco in caratteri (~4 caratteri per token: 6000 ≈ 1500 token, ~0,5 s di
  # rilettura col 26B sulla DGX senza cache): oltre si lasciano fuori le righe più vecchie
  stanza_caldo_caratteri: 6000
  # Le righe della stanza nella storia, in sola aggiunta (14/10 sera, dopo la prova in auto con
  # il 26B: col blocco ricostruito a ogni turno la prima frase mediana era 2,81 s contro 1,3 s
  # senza, ~3900 token riletti per turno). A ogni turno solo le righe non ancora mandate in
  # questa conversazione entrano, in busta, subito prima della frase; nei turni dopo restano
  # nello stesso posto, uguali, e la cache del prefisso le tiene. In memoria, mai su disco (la
  # tenuta della stanza resta quella di stanza_tenuta). false = il blocco intero nei dati del
  # turno a ogni turno, come il 14/10 mattina (per il confronto sul banco)
  stanza_contesto_in_storia: true
  # Tetto delle righe della stanza nella storia di una conversazione, in caratteri (~4 per
  # token: 16000 ≈ 4000 token). Oltre, a risposta finita, via le più vecchie fino a metà, tutte
  # insieme (la cache si rompe una volta sola) e il prefisso nuovo si scalda in secondo piano;
  # anche il taglio e la compressione della storia portano via le righe dei turni tolti
  stanza_storia_caratteri: 16000
  # Il pezzo «in attesa» (14/10 notte, dopo la seconda prova in auto: prima frase mediana 2,31 s,
  # rilettura 0,86 s, fino a 3700 caratteri di righe nuove fra un turno e l'altro): con la
  # conversazione aperta e la voce ferma, ogni `stanza_attesa_ogni_s` Brain guarda le righe
  # arrivate dopo l'ultimo turno; oltre `stanza_attesa_caratteri` le fissa in un pezzo (lo
  # stesso testo che avrebbe il turno dopo, e da allora non cambia più) e lo mette nella cache
  # del motore in secondo piano. Al turno dopo il pezzo va davanti a quello delle righe ancora
  # più nuove, e la sua lettura è già fatta. false = le righe nuove si leggono tutte al turno
  stanza_attesa: true
  stanza_attesa_caratteri: 600
  stanza_attesa_ogni_s: 5.0
  # Tetto delle righe del primo pezzo di una conversazione nuova (anche riaperta dopo
  # `storia_inattiva_s`): nella prova del 14/10 sera 32 e 36 righe (6773 e 5476 caratteri,
  # ~1800 token da leggere) entravano tutte insieme alla riapertura. Le più nuove, gli ultimi
  # `stanza_caldo_sempre_s` sempre; la finestra si allarga fino all'inizio dell'ultimo scambio
  # della stanza (al più 30 minuti), il resto lo trovano la ricerca anticipata e stanza_cerca
  stanza_riapertura_caratteri: 3000
  # Passo 4 (14/10, calliope/stanza/cerca.py, tool stanza_cerca): ciò che il blocco caldo non
  # ha più o che si è detto in un'altra stanza («di cosa parlavamo in cucina prima?», «cosa
  # aveva detto Carlo della gita stamattina?»), cercato nel registro della stanza in memoria
  # per persona, stanza, momento e parole. Lo usano solo le persone di casa riconosciute;
  # un adulto vede le stanze dove era presente, quando c'era, e le parole di un minore solo
  # se ne è il tutore; un minore solo le sue; le voci non riconosciute mai. Il risultato è in
  # busta (fonte «stanza») e riservato: né il terminale né il registro dei turni hanno le
  # righe. Vale solo con la stanza accesa; false (di serie) = il tool non c'è
  stanza_cerca: false
  # Tetti del risultato (righe e caratteri, ~600 token: sotto la quarantena dei dati lunghi)
  stanza_cerca_righe: 20
  stanza_cerca_caratteri: 2400
  # Righe delle stanze cercate ancora in coda per Whisper: passano davanti e si aspettano al
  # più così; la frase d'attesa («Un attimo, ripenso a cosa vi siete detti.») solo oltre
  # `stanza_cerca_attesa_s`
  stanza_cerca_attesa_max_s: 3.0
  stanza_cerca_attesa_s: 0.7
  # La ricerca anticipata (14/10, banco della DGX col 26B: prima frase mediana 3,36 s con
  # stanza_cerca, che chiamava il tool in ogni turno, una passata in più): prima della
  # risposta Brain cerca con le parole della frase (e la stanza nominata) le righe di prima
  # che il blocco caldo non ha, con gli stessi permessi del tool, e le mette nei dati del turno
  # accanto al blocco, in busta: se bastano il modello risponde in una passata, altrimenti
  # chiama stanza_cerca. Senza parole utili o senza niente di nuovo non aggiunge niente (la
  # domanda che il blocco caldo copre non paga token). false = solo il tool, come il 14/10
  stanza_cerca_anticipo: true
  # Tetto delle righe anticipate (~250 token: ~0,1 s di lettura in più del 26B)
  stanza_cerca_anticipo_caratteri: 1000
  # Passo 5 (14/10, calliope/stanza/eco.py): la stanza ascolta anche mentre Calliope parla. I
  # satelliti e il telefono mandano i segmenti detti durante la sua voce, segnati con le frasi
  # che suonavano; il filtro dell'eco (regola eco_stanza) toglie dalla riga le parole che sono
  # la sua voce (3 di fila, o il 60 % della riga, nel tempo della frase) e scarta la riga tutta
  # eco. Solo per la stanza: i comandi restano half-duplex (principio 8), il barge-in non
  # cambia. Un satellite con l'eco sul saluto oltre barge_in_echo_max (casse senza
  # cancellazione) resta half-duplex anche per la stanza. Misure (eco residua, parole
  # recuperate) in `calliope stato --turni`, sezione Stanza. false (di serie) = come prima
  stanza_durante_voce: false
  # La tenuta su disco del testo della stanza (14/10, decisione 0029 punto 5, calliope/stanza/
  # tenuta.py): le righe della stanza (testo, chi, stanza, tempi, rivolta, minore) e le
  # presenze in un SQLite con FTS5 accanto alla configurazione, per `stanza_tenuta_giorni`;
  # stanza_cerca cerca anche lì con gli stessi permessi (chi c'era, i tutori, un minore solo le
  # sue). Per tutta la famiglia, minori compresi (scelta di chi amministra del 13–14/10); mai
  # le voci non riconosciute né la zona grigia (nel dubbio no), mai ciò che si dice in pausa
  # («abbiamo ospiti»), mai l'audio. «Dimentica» e `calliope conserva --svuota` cancellano
  # anche qui; il blocco caldo dei dati del turno resta della sola memoria (dopo un riavvio
  # non ripesca niente dal disco). false (di serie) = solo in memoria, al più 24 h, fino al
  # riavvio. Si accende nel file locale
  stanza_tenuta: false
  stanza_tenuta_giorni: 60
  # Il file (relativo alla cartella della configurazione), con i permessi stretti dei dati
  stanza_tenuta_db: stanza.db
  # Il guardiano a posteriori della stanza (14/10, passo 6, decisione 0029 punto 4,
  # calliope/stanza/guardia.py): rilegge dopo, a blocchi e con le righe intorno, le chiacchiere
  # in cui un minore parla o è presente, con il rilevatore di pericolo di oggi
  # (guardiano_pericolo_modello) e un prompt per le conversazioni di famiglia (scherzi, giochi,
  # TV). «ombra»: solo misure senza parole (`calliope stato --turni`, `calliope stato
  # --guardia`); «attiva»: un segnale acuto dà solo un avviso al tutore sullo schermo
  # personale, senza parole e mai a voce (da accendere dopo l'ombra, con meno di un acuto
  # falso a settimana). Vale solo con la stanza accesa e i minori; «spenta» (di serie): nessun
  # thread, nessun giudizio
  stanza_guardia: spenta
  # Righe finite da meno di così non si giudicano ancora (la trascrizione si assesta; dal
  # passo 3 la corsia lenta la correggerà); un blocco parte quando la stanza tace da tanto
  stanza_guardia_attesa_s: 120.0
  # Uno scambio che non tace mai si giudica comunque a pezzi di al più questi secondi
  stanza_guardia_blocco_max_s: 900.0
  # Ogni quanto si guardano le righe nuove
  stanza_guardia_ogni_s: 60.0
  # Un giudizio parte solo con la voce ferma da così (nessuna risposta, nessuna frase che
  # aspetta Whisper, nessuno che parla a Calliope): mai davanti ai turni
  stanza_guardia_quiete_s: 5.0
  # Tetto di giudizi all'ora; il resto aspetta in coda (al più 24 ore, poi si butta e si conta)
  stanza_guardia_giudizi_ora: 30
  # Il tempo massimo di un giudizio (in secondo piano: il modello può dover caricarsi)
  stanza_guardia_timeout_s: 30.0
  # «attiva»: avvisi urgenti al giorno per minore (la stessa categoria non si ripete entro
  # 24 ore; due dubbi in giorni diversi entro 7 giorni danno un avviso non urgente)
  stanza_guardia_avvisi_giorno: 1
  # Una riga con una parola sotto questa probabilità (quando Whisper la dà) non fa un acuto
  stanza_guardia_p: 0.5
  # I conoscenti (14/10, decisione 0030, calliope/stanza/conoscenti.py): le voci che nessun
  # profilo riconosce si raggruppano in memoria per somiglianza dell'impronta; dal contesto
  # (vocativi e saluti seguiti dal parlato di quella voce, presentazioni, più indizi concordi;
  # regola conoscente_nome) Calliope deduce il nome e lo propone a chi amministra **solo sullo
  # schermo personale** (mai a voce): «Ho sentito una voce nuova che chiamate Marco: la salvo
  # come conoscente?», con Sì, No, un nome diverso, cognome e nota (gli omonimi restano
  # profili separati). Senza il sì niente va su disco. Il conoscente ha i permessi di un
  # ospite, è riconosciuto col nome nelle righe della stanza, le sue righe vanno su disco con
  # la tenuta e si cercano come quelle della famiglia (chi c'era). Solo con la stanza accesa;
  # false (di serie) = niente gruppi né proposte
  stanza_conoscenti: false
  # Un conoscente non sentito da tanto si dimentica (impronta, profilo e righe)
  conoscenti_scadenza_giorni: 180
  # Punti per proporre un nome (vocativo con la risposta 1, presentazione 2, nome detto di sé
  # in terza persona −1), da almeno due righe e con il secondo nome sotto la metà
  conoscenti_soglia: 3
  # Voce del gruppo (secondi di parlato, almeno tre segmenti) per un'impronta buona
  conoscenti_min_voce_s: 6.0
  # Il file dei conoscenti (relativo alla cartella della configurazione)
  conoscenti_file: conoscenti.json
  # Con `stanza_tenuta`: dopo un riavvio le righe di prima non ancora giudicate si riprendono
  # dal disco fino a tante ore indietro (dopo un fermo lungo non si rileggono giorni; quelle
  # più vecchie si contano soltanto). 0 = nessuna ripresa
  stanza_guardia_ripresa_h: 24.0
  # Passo 3, la corsia lenta (14/10, calliope/stanza/lenta.py, progetto § 3.2, § 3.4, § 5.2,
  # § 5.4): quando la DGX è libera (nessun turno, nessuna frase che aspetta Whisper, coda della
  # stanza vuota, nessuno che parla a Calliope; mai davanti ai turni né alla corsia veloce) i
  # segmenti della stanza si ritrascrivono con più contesto (i nomi dei presenti e le righe di
  # prima dello scambio nel prompt di Whisper, un altro Whisper più lento se c'è), chi parla si
  # rivede con le finestre CAM++ sull'intero scambio (i blocchi con due voci si spezzano), si
  # segnano le allucinazioni tipiche e la TV (strati senza Home Assistant: voce sconosciuta
  # lunga senza turni, nessuno di casa presente, frase già sentita), e si aggiorna il riassunto
  # progressivo della stanza. Le righe corrette sono la versione 2 nel registro (in sola
  # aggiunta: la 1 resta), la tenuta su disco si aggiorna, le righe già nella storia del modello
  # non si riscrivono. L'audio dei segmenti resta in RAM per `stanza_audio_min` (mai su disco).
  # false (di serie) = come prima: l'audio si butta a trascrizione fatta
  stanza_lenta: false
  # Minuti di audio della stanza tenuti in RAM per satellite per la corsia lenta (~1,9 MB al
  # minuto di parlato in PCM 16 bit); oltre, i segmenti più vecchi non si rivedono più
  stanza_audio_min: 15.0
  # Un segmento si rivede quando lo scambio tace da `stanza_lenta_quiete_s`, o comunque dopo
  # `stanza_lenta_ogni_s` dalla sua fine (uno scambio che non finisce mai)
  stanza_lenta_quiete_s: 30.0
  stanza_lenta_ogni_s: 120.0
  # La DGX ferma da così prima di un passo (come stanza_guardia_quiete_s)
  stanza_lenta_libera_s: 5.0
  # Un secondo Whisper per la corsia lenta (API compatibile OpenAI, es. whisper.cpp con
  # large-v3 non turbo): vuoto = lo stesso Whisper dei turni, con la precedenza più bassa.
  # Mettilo solo se il piano dei modelli dice che ci sta (`calliope stato --piano`)
  stanza_lenta_stt_url: ''
  stanza_lenta_stt_modello: ''
  # Beam della ritrascrizione con faster-whisper nel processo (il server lo fissa da sé)
  stanza_lenta_beam: 8
  # La ritrascrizione del testo (14/10 sera): «auto» (di serie) solo se la corsia lenta ha un
  # Whisper suo (stanza_lenta_stt_url) o un beam che conta (faster-whisper nel processo con
  # stanza_lenta_beam più largo di whisper_beam_size); «si» sempre, «no» mai. Senza, la corsia
  # lenta fa il resto (chi parla, TV, allucinazioni, riassunto) sul testo della corsia veloce.
  # Misura vera del 14/10 sera (95 registrazioni conservate, riferimento scritto a mano): lo
  # stesso whisper-server dei turni, che ignora il beam, senza il prompt dei turni sbagliava il
  # 4,8 % delle parole contro il 3,0 % dell'originale
  stanza_lenta_ritrascrivi: auto
  # Il prompt della ritrascrizione (i nomi di chi parla nello scambio e la coda delle parole
  # di prima): «auto» (di serie) solo con un Whisper suo (stanza_lenta_stt_url): sul banco
  # sintetico del 14/10 col turbo dei turni il prompt peggiorava la WER (10 dB: 18,9 → 21,9 %),
  # con large-v3 la migliorava (18,4 → 16,8 %); «si» sempre, «no» mai
  stanza_lenta_prompt: auto
  # Caratteri delle righe di prima dello scambio nel prompt di Whisper (oltre ai nomi dei
  # presenti). 0 = solo i nomi. Corto: un prompt lungo si ricopia sull'audio incerto
  stanza_lenta_prompt_caratteri: 160
  # Finestre CAM++ (secondi) con sovrapposizione a metà, e il parlato minimo di una parte per
  # spezzare un segmento in due righe
  stanza_lenta_finestra_s: 1.5
  stanza_lenta_parte_min_s: 2.0
  # Somiglianza minima di una finestra al profilo (o alla voce della persona nello scambio)
  # per dirla sua: una finestra corta somiglia meno di una frase intera
  stanza_lenta_soglia_finestra: 0.4
  # Il riassunto progressivo della stanza (col rilevatore già caricato, a DGX libera): ogni
  # tante righe nuove di uno scambio. 0 = nessun riassunto
  stanza_lenta_riassunto_righe: 6
  # La ritrascrizione a blocchi (15/10, calliope/stanza/lenta.py): i segmenti consecutivi della
  # stessa persona sullo stesso satellite, dopo la revisione segmento per segmento, si
  # uniscono (0,3 s di silenzio fra uno e l'altro) e si ritrascrivono insieme col Whisper dei
  # turni, senza prompt, con la precedenza LENTA. Il blocco si chiude quando parla un'altra voce
  # (un'altra persona, Calliope, una voce sconosciuta diversa), dopo una pausa lunga della
  # stessa persona (`stanza_lenta_blocchi_pausa_s`), al tetto di durata (si spezza a un confine
  # di segmento), in pausa della stanza o se aspetta troppo. Misura del 15/10 sulla DGX (frase
  # di un ragazzo spezzata in tre segmenti di 5,5, 4,5 e 2,9 s): uno per uno «italiani WMO
  # 2.500, mondiali WMO 2.500.» / «2025 ARCENTO…», uniti «Italiani WMO 2025 argento, mondiali
  # WMO 2025 argento, europei WMO 2026 euro…», uguale in 3 giri; col prompt peggio.
  # «spento» (di serie) = come prima; «ombra» = ritrascrive e misura (il testo solo nel banco),
  # le righe restano quelle di prima; «attivo» = il testo del blocco, ridistribuito sui
  # segmenti, è una versione nuova delle righe (contesto, ricerca, tenuta)
  stanza_lenta_blocchi: spento
  # Il tetto di un blocco in secondi di audio (Whisper lavora a finestre di 30 s)
  stanza_lenta_blocchi_max_s: 25.0
  # Una pausa così lunga (secondi) fra due segmenti della stessa persona chiude il blocco; 0 =
  # solo il cambio di voce. Valore provvisorio: si sceglie sulla distribuzione delle pause del
  # banco (prove/manuali/blocchi_stanza.py stampa quanti blocchi cambiano con 3, 5, 8, 15 s)
  stanza_lenta_blocchi_pausa_s: 8.0
  # Un blocco aperto si chiude comunque dopo tanto dalla fine del suo ultimo segmento (l'audio
  # resta in RAM fino ad allora: al più `stanza_lenta_blocchi_max_s` per satellite, ~0,8 MB)
  stanza_lenta_blocchi_attesa_s: 600.0
  # Eccezione temporanea per il banco del passo 3 (14/10 sera, decisione 0029, eccezione
  # «audio del banco»): per tanti giorni dalla prima accensione l'audio dei segmenti della
  # stanza in cui **tutte** le voci sono persone di casa riconosciute dalla voce (adulti e
  # minori della famiglia, autorizzati dal tutore per il banco; mai ospiti, conoscenti, zona
  # grigia, voci sconosciute, mai in pausa) va su disco in `<turn_log_dir>/stanza_banco/`
  # (file 600), con le trascrizioni v1 e v2, per misurare WER e attribuzione. Vuole
  # `stanza_lenta`. Alla scadenza smette da sé; i file restano per `turn_log_days` e li
  # cancellano «dimentica» e `calliope conserva --svuota`. 0 (di serie) = mai
  stanza_audio_banco_giorni: 0

satellite:
  # == Lato satellite (il portatile che fa da microfono, casse e schermo di
  # == Calliope sul server): python -m calliope.satellite o avvia_satellite.py.
  # == Usa anche wake_word, audio (VAD) e tts (tts_lead_s, tts_tail_s, tts_keepalive).
  # Lato satellite (il portatile): l'indirizzo del server, ws://… o wss://… (con il TLS)
  # (variabile d'ambiente CALLIOPE_SATELLITE_SERVER, che vince su questo file)
  satellite_server: ws://127.0.0.1:8771
  # Lato satellite: il file con il token dell'abbinamento e l'impronta del certificato del
  # server, relativo alla cartella del file di configurazione e fuori da git
  satellite_credenziali: satellite.json
  # Lato satellite: l'impronta SHA-256 del certificato del server, se la si vuole fissare a
  # mano (la stampa --certificato sul server). Vuota = quella vista all'abbinamento
  satellite_impronta: ''
  # Lato satellite (05/10): il microfono e le casse di questo satellite, per numero o per
  # parole del nome con l'API audio («C920 MME», «I52 MME»: il nome regge quando Windows
  # rinumera i dispositivi). None = quelli predefiniti del sistema. input_device e
  # output_device (sezione audio) sono di Calliope completa: il satellite li usa solo se
  # questi mancano, e avvisa di spostarli qui
  # (variabile d'ambiente CALLIOPE_SATELLITE_MICROFONO, che vince su questo file)
  satellite_microfono: null
  # (variabile d'ambiente CALLIOPE_SATELLITE_CASSE, che vince su questo file)
  satellite_casse: null
  # Lato satellite, solo Windows: la webcam di pc_guarda su questo PC, il nome come lo mostra
  # Windows («HD Pro Webcam C920»); vuoto = la prima trovata (ripiego: pc_webcam)
  # (variabile d'ambiente CALLIOPE_SATELLITE_WEBCAM, che vince su questo file)
  satellite_webcam: ''
  # Lato satellite: la pagina degli schermi del server, aperta all'avvio. "finestra" = una
  # finestra di Edge senza barre (il portatile resta usabile), "kiosk" = schermo intero,
  # "no" = niente. Sul server serve schermi_indirizzo in rete (o lo stesso computer)
  satellite_schermo: finestra
  # Lato satellite: il nome di chi lo usa («Dario»), se lo schermo del satellite va reso
  # personale (riceve promemoria, appuntamenti e documenti di quella persona). È solo una
  # richiesta, mandata all'abbinamento: la applica chi amministra, sul server, con
  # --personale <nome>. Un satellite non può dichiararsi personale di qualcuno da solo
  satellite_schermo_personale: ''
  # Lato satellite, solo Windows: offre al server il controllo di questo PC (pc_* con
  # pc_enabled, il catalogo pc_app e le librerie di questo PC) e riceve i documenti, salvati
  # in documenti_cartella (vuota = Documenti\Calliope). I percorsi dei file non escono dal
  # satellite. false = solo microfono e casse
  satellite_esecutore: true
  # Lato satellite installato dalla pagina /satellite: si aggiorna da solo alla versione del
  # server, con ritorno automatico alla precedente se non si ricollega. Il satellite avviato
  # dal repository non si aggiorna mai da solo (calliope/satellite/aggiorna.py)
  satellite_aggiornamenti: true

agenti:
  # Agenti in secondo piano (calliope/agenti/, docs/ricerche/2026-10-02-llm-per-spark.md):
  # «gemma davanti, agenti dietro». I lavori lunghi (programmi, relazioni, documenti da un
  # modello, ricerche a più passi) li fa un modello grande su un'altra macchina (la DGX
  # Spark, via tunnel SSH) o sullo stesso Ollama; la voce non li aspetta mai e li annuncia a
  # lavoro finito. Senza agente configurato i tool lavoro_affida, lavoro_stato e
  # lavoro_annulla non ci sono.
  agenti_enabled: true
  # Il file della DGX (alias SSH, collegamento, porte, modelli), accanto a calliope.yaml e
  # fuori da git. Utente, indirizzo e chiave non ci sono: stanno in .ssh\config sotto
  # l'alias. Relativo alla cartella del file di configurazione.
  # (variabile d'ambiente CALLIOPE_AGENTI_CONFIG, che vince su questo file)
  agenti_config_file: dgx.yaml
  # In alternativa l'indirizzo di un Ollama raggiungibile senza tunnel: una DGX in casa
  # (http://<IP>:11434) o lo stesso Ollama della voce (http://127.0.0.1:11434, le prove
  # senza DGX: allora la voce ha la precedenza). Vince sul file. Vuoto = il file.
  # (variabile d'ambiente CALLIOPE_AGENTI_URL, che vince su questo file)
  agenti_url: null
  # Il modello dell'agente. Vuoto = agente_modello del file della DGX (con agenti_url:
  # llm_model, lo stesso della voce)
  # (variabile d'ambiente CALLIOPE_AGENTI_MODELLO, che vince su questo file)
  agenti_modello: null
  # Contesto dell'agente in token. "auto" (05/10, fase 2b, calliope/contesto.py →
  # finestra_agenti): con vLLM il minimo tra max_model_len e i token della cache (/metrics)
  # divisi per agenti_contesti_paralleli; con un Ollama remoto il massimo del modello ma al
  # più 32 768 (la memoria di là non si legge). Sullo stesso Ollama e con lo stesso modello
  # della voce vale sempre la finestra della voce (altrimenti Ollama ricaricherebbe il
  # modello a ogni cambio). Un numero vince
  agenti_num_ctx: auto
  # Quanti contesti dell'agente possono stare insieme nella cache del server (il lavoro, più
  # il riassunto delle conversazioni, l'archivio e l'ufficio sullo stesso modello)
  agenti_contesti_paralleli: 2
  # Tetti di una passata: token generati (ragionamento compreso; è anche lo spazio tenuto
  # libero nella finestra) e token di ragionamento (con vLLM thinking_token_budget: finito il
  # budget il modello chiude il ragionamento e risponde; con Ollama conta solo il primo)
  agenti_token_passata: 16384
  agenti_ragionamento_passata: 8192
  # Contesto del lavoro (05/10, calliope/agenti/contesto_lavoro.py): oltre questa frazione
  # della finestra i risultati vecchi e lunghi degli strumenti vanno per intero in
  # .calliope/passo-N.txt nella cartella del lavoro (nel contesto un riassunto e dove
  # rileggerli); oltre contesto_soglia_morbida i passi vecchi diventano il diario del
  # lavoro. Restano interi il compito e gli ultimi agenti_passi_intatti passi
  agenti_soglia_file: 0.5
  agenti_passi_intatti: 3
  # Thinking dell'agente: acceso per codice e documenti (i benchmark del codice sono tutti
  # con il ragionamento). None = non inviare il parametro
  agenti_think: true
  # Temperatura dell'agente: 0,6 dal 13/10, il valore della scheda di Qwen3.6 per il codice
  # con il ragionamento (prima 0,4, sotto il consigliato). Banco della temperatura sulla DGX
  # (12–13/10, prove/manuali/banco_temperatura.py, convertitore, 7 lavori per riga): a 0,6
  # con presence_penalty 0 / 0,25 / 0,5 riescono 3 / 0 / 4 lavori, cioè rumore: la leva non
  # è il campionamento. Nei lavori falliti il codice era spesso giusto ma l'agente non
  # consegnava, o i suoi test sbagliavano la firma di esegui (lì le correzioni sono nel
  # ciclo e nello scheletro dei test, non qui). presence_penalty invariata, sotto
  agenti_temperatura: 0.6
  # Tetti di un lavoro: passate del modello, token generati (ragionamento compreso, che si
  # conta anche a parte: token_ragionamento in lavoro.json), minuti. Il contesto qui non
  # conta: lo regge la finestra, comprimendo. Vicino a un tetto l'agente riceve una volta
  # l'avviso di chiudere con quello che ha; al tetto il lavoro si ferma e l'annuncio dice
  # perché, dove sono i file e come vanno i test
  agenti_max_passi: 24
  agenti_tempo_max_min: 30.0
  # Il tetto dei token è per tipo di lavoro (06/10): token generati al minuto per
  # agenti_tempo_max_min, così cresce con il tempo concesso (prima 60 000 per tutti: un lavoro
  # di codice ne usa ~4 000 al minuto e si fermava al quindicesimo). Misure sulla DGX con
  # qwen3.6 su vLLM (docs/ricerche/2026-10-05-contesto-agenti.md §5): il codice genera
  # 2 800–4 300 token al minuto, al più ~4 500 (74 token/s senza pause), quindi lì conta il
  # tempo; ricerche e documenti 1 700–3 600 nei loro pochi minuti, e una ricerca che genera a
  # vuoto si ferma a ~20 minuti invece di 30. Un tipo che manca usa «altro»
  agenti_token_minuto:
    codice: 5000
    estensione: 5000
    ricerca: 3000
    documento: 3000
    altro: 3000
  # Massimo dei token di un lavoro per tutti i tipi, sopra il conto qui sopra. 0 = nessuno
  agenti_max_token: 0
  # Guardia contro il ragionamento a vuoto (05/10: il lavoro L1 del 04/10 ha pensato 66 000
  # token senza usare uno strumento): dopo tanti token o minuti di fila senza strumenti una
  # spinta («chiama piano, scarica_esempio o scrivi_file»), alla seconda il lavoro si chiude
  # con il motivo (si conta tra una passata e l'altra: una passata ha già il suo tetto)
  agenti_token_senza_strumenti: 12000
  agenti_minuti_senza_strumenti: 5.0
  # Giro a vuoto nel ragionamento (08/10 sera, calliope/agenti/ripetizioni.py: qwen3.6 ha
  # ripetuto la stessa riga 58 volte in una passata, 160 kB di registro in 12 passate): una
  # frase di prosa di almeno 6 parole ripetuta tante volte nella stessa passata la ferma, con
  # la spinta «decidi e chiama uno strumento»; alla terza di fila il lavoro si chiude.
  # Codice, tabelle e frasi corte non contano. 0 = spento
  agenti_ripetizioni_max: 8
  # presence_penalty per tipo di lavoro, solo con il motore compatibile OpenAI (vLLM; con
  # Ollama non si manda). La scheda di Qwen3.6 consiglia 0 nel ragionamento sul codice
  # («precise coding tasks»: un codice ripete per forza gli stessi token) e 1,5 nel
  # ragionamento generale, contro le ripetizioni senza fine dei modelli quantizzati; oltre
  # 1,5 a volte mescola le lingue. 0 = non si manda. Misurato sulla DGX l'11/10 per
  # «estensione» (anche i giochi) sul caso vero del gioco con la prova di fumo
  # (prove/manuali/misura_presence_penalty.py, 6 passate per valore): con 0,5 nessun giro a
  # vuoto, 6 correzioni mirate su 6, mediana 3,6 s contro 7,6 s a 0. «codice» non misurato
  agenti_presence_penalty:
    codice: 0.0
    estensione: 0.5
    ricerca: 1.5
    documento: 1.5
    altro: 1.5
  # Token del JSON di un documento scritto dall'agente (una relazione ne usa 2–4 mila)
  agenti_max_token_documento: 8192
  # Sandbox del codice: secondi per un'esecuzione di Python o dei test, memoria del processo
  agenti_esecuzione_s: 30.0
  agenti_memoria_mb: 1024
  # Motore della sandbox (03/10): «auto» = un container Docker usa-e-getta dove c'è
  # l'immagine (Linux, la DGX: calliope motore sandbox costruisci), altrimenti il processo
  # con i limiti e l'audit hook; «docker» = solo il container (se non è pronto il codice
  # non si esegue); «processo» = mai il container
  agenti_sandbox_motore: auto
  # Immagine Docker della sandbox. Vuoto = calliope-sandbox:<hash del Dockerfile>
  agenti_sandbox_immagine: null
  # CPU a disposizione del container della sandbox
  agenti_sandbox_cpu: 2.0
  # Linguaggi dei programmi dell'agente (04/10): Python sempre; gli altri solo in un
  # container con la loro immagine (calliope motore sandbox costruisci csharp). Se
  # l'immagine manca l'agente dice che quel linguaggio qui non c'è
  agenti_linguaggi:
  - python
  - csharp
  # Il programma finito si esegue e si mostra in diretta sullo schermo personale di chi
  # l'ha chiesto (04/10, agenti/esecuzione.py), anche a richiesta («fammelo vedere»,
  # «eseguilo con 3 e 5»): tempo massimo di un'esecuzione, uscita tenuta (KB: oltre restano
  # l'inizio e la coda), secondi che l'annuncio del lavoro aspetta l'esecuzione e che la
  # risposta a voce aspetta prima di dire «lo sto eseguendo»
  agenti_dimostrazione: true
  agenti_dimostrazione_s: 60.0
  agenti_dimostrazione_uscita_kb: 64
  agenti_dimostrazione_attesa_s: 8.0
  agenti_esecuzione_attesa_s: 4.0
  # Cartella di lavoro della sandbox (una sottocartella per lavoro), relativa alla cartella
  # del file di configurazione
  agenti_sandbox: lavori
  # Dove finiscono i risultati. Vuoto = Documenti\Calliope\Lavori (una cartella per lavoro)
  agenti_risultati: null
  # Modelli di documento (template JSON). Vuoto = Documenti\Calliope\Modelli
  agenti_modelli: null
  # Chi può delegare: documenti, ricerche e altro (livello minimo) e il codice. Gli ospiti
  # mai. «amministra» o «familiare»
  agenti_livello: familiare
  agenti_livello_codice: amministra
  # Conferma a voce prima di avviare: «costosi» (codice ed estensioni, coda già occupata,
  # modello da caricare; le ricerche no dal 08/10), «sempre» o «mai»
  agenti_conferma: costosi
  # Analisi della richiesta prima della proposta (06/10, calliope/agenti/richiesta.py): un
  # lavoro di codice o un'estensione nuova passa prima dal modello dell'agente, che dice se
  # la richiesta basta, se la conversazione la completa, quali dati mancano (al più 2
  # domande a voce), se Calliope lo sa già fare o se qui è impossibile. Oltre tanti secondi
  # (fonte web verificata compresa) si procede come prima dell'analisi
  agenti_analisi: true
  agenti_analisi_s: 10.0
  # Il risultato di un lavoro finito, chiesto a voce (07/10, tool lavoro_risultato: «e il
  # risultato?», «leggimelo»): il riassunto dell'agente già salvato; per più dettaglio un
  # riassunto per la voce chiesto al modello dell'agente sul testo intero, entro tanti
  # secondi (oltre, il riassunto salvato). Il testo intero va sullo schermo personale
  agenti_risultato_s: 15.0
  # Stesso Ollama della voce: l'agente si ferma quando qualcuno parla a Calliope e riparte
  # tanti secondi dopo la fine della risposta
  agenti_precedenza_voce: true
  agenti_ripresa_s: 3.0
  # Quando l'agente usa la stessa GPU della voce (e allora le cede il passo, 04/10): «auto»
  # = stesso Ollama, oppure un server su questo computer (127.0.0.1, localhost: sulla DGX
  # vLLM accanto all'Ollama della voce) o sullo stesso host della voce; mai con il tunnel.
  # «sempre» o «mai» per decidere a mano
  agenti_arbitro: auto
  # Con l'agente su vLLM nella stessa macchina (04/10): se il server ha la modalità sviluppo
  # (`vllm.sh agente`, PAUSA=1) l'arbitro lo mette in pausa (`/pause?mode=keep`) mentre si
  # parla e lo riprende dopo, invece di chiudere gli stream: niente passo perso. Senza
  # `/pause` si chiudono gli stream come prima. Mai sul server della voce
  agenti_pausa_vllm: true
  # Domande dell'agente a metà lavoro (03/10): se gli manca un dato il lavoro aspetta la
  # risposta (lavoro_rispondi) con il suo contesto. Al più tante domande per lavoro; dopo
  # tanti minuti senza risposta si chiude da solo, e Calliope lo dice
  agenti_domande_max: 3
  # Flusso a fasi, parte 2 (13/10, calliope/agenti/accettazione.py; ricerca
  # 2026-10-12-flusso-agente-fasi § 5.1): prima che l'agente scriva il codice, una passata a
  # sé del modello dell'agente (contesto nuovo, senza il codice) rilegge requisiti e parole
  # della persona. Per un'estensione scrive gli esempi dato → risultato, che il codice
  # trasforma in test_accettazione.py in sola lettura (l'agente non li cambia; alla consegna
  # si eseguono con gli altri test); per un lavoro nuovo trova le contraddizioni e fa al
  # più due domande (il lavoro aspetta la risposta, come le domande a metà lavoro); i
  # requisiti che si giudicano solo guardando restano «da guardare tu» alla revisione.
  # false = come prima. Secondi al più per la passata
  agenti_accettazione: true
  agenti_accettazione_s: 90.0
  agenti_attesa_risposta_min: 120.0
  # I file della persona dati all'agente (03/10, «correggi lo script backup.py»): solo
  # testo, codice, Word, Excel e PDF, al più tanti MB; del testo di un documento l'agente
  # legge al più tanti caratteri
  agenti_file_max_mb: 10.0
  agenti_file_caratteri: 40000
  # Pagine pubbliche d'esempio che l'agente può scaricare per scrivere e provare il parser
  # di un'estensione (scarica_esempio, 05/10), e la dimensione massima di ognuna. 0 = mai
  agenti_esempi_max: 5
  agenti_esempio_kb: 1024
  # Lavori interrotti da un riavvio di Calliope (06/10, calliope/agenti/ripresa.py): chi li
  # aveva chiesti lo sente al primo silenzio («… Lo rifaccio?») se il lavoro era vivo meno
  # di tante ore fa; quelli più vecchi restano solo nell'elenco di lavoro_stato, per un giorno
  agenti_interrotti_annuncio_h: 3.0
  # Modalità sviluppo (08/10, calliope/sviluppo.py): per chi amministra un'estensione o un
  # programma è un iter a fasi (analisi, sviluppo e test, collaudo, revisione, attivazione),
  # su disco accanto ai lavori. Dopo tanti minuti senza parlarne (non mentre l'agente
  # lavora) si sospende e si riprende a voce; 0 = mai. Una volta al giorno, alla prima
  # risposta a chi amministra, Calliope ricorda gli sviluppi sospesi (sviluppo_promemoria).
  # Un programma con almeno tante righe di codice (o 3 file, o 3 prove) alla revisione
  # riceve la proposta di diventare un'estensione
  sviluppo_enabled: true
  sviluppo_sospendi_min: 30.0
  sviluppo_promemoria: true
  sviluppo_programma_righe: 150
  # Versione 2 (08/10): «perché?» durante il collaudo va a chi ha scritto il codice
  # (sviluppo_chiedi): una passata del modello dell'agente in sola lettura, con il contesto
  # dello sviluppo; dopo tanti secondi senza risposta lo si dice e si propone la correzione
  sviluppo_chiedi_s: 60.0
  # Ricollaudo alla consegna (08/10, docs/ricerche/2026-10-08-sonde-agente.md § 9.3): quando
  # l'agente consegna una correzione (o un lavoro ripartito dall'analisi dopo i collaudi),
  # prima di dire «è pronto» Calliope esegue la versione nuova con i collaudi della persona
  # che non andavano (gli ultimi, uno per dato distinto, al più sviluppo_ricollaudo_max), una
  # volta per lavoro, con il manifesto ristretto alla sola lettura di rete verso gli host già
  # noti e senza conferme; se un caso non va ancora, la consegna torna all'agente con la
  # traccia. false = come prima
  sviluppo_ricollaudo: true
  sviluppo_ricollaudo_max: 3
  # Sonde dell'agente nelle correzioni (§ 9.4, sonda_rete al posto di scarica_esempio): GET
  # vere fatte da Calliope solo verso gli host noti dello sviluppo (manifesto approvato, host
  # che hanno risposto in un collaudo, concessi con chiedi_permesso) e con i soli valori del
  # caso (specifica, collaudi, traccia; numeri e date). Sonde per lavoro (0 = spente: resta
  # scarica_esempio), per passata del modello, per sviluppo in un giorno; byte e secondi
  # massimi di una risposta
  sviluppo_sonde_max: 4
  sviluppo_sonde_passata: 2
  sviluppo_sonde_giorno: 12
  sviluppo_sonda_kb: 256
  sviluppo_sonda_s: 8.0
  # Revisione onesta e tappe (11/10, calliope/requisiti.py; caso vero del gioco di Halloween,
  # consegnato senza voce né musica e rivisto con «tutto sembra in ordine»). Alla prima
  # proposta il modello dell'agente elenca i requisiti della specifica (entro
  # sviluppo_requisiti_s, con «Un attimo…» oltre 1,2 s): Calliope dice ciò che oggi non si può
  # fare e, con almeno sviluppo_tappe_requisiti requisiti da fare (o la stima «grande»
  # dell'agente) e almeno due fuori dal nucleo, propone di farlo a tappe (0 = mai). Alla
  # consegna il modello dell'agente confronta i file con i requisiti, uno per uno (entro
  # sviluppo_verifica_s, nel thread dei lavori; alla revisione, se manca, entro
  # sviluppo_verifica_voce_s): annuncio, revisione e scheda dicono cosa c'è e cosa manca.
  # false = come prima (niente requisiti, niente tappe)
  sviluppo_requisiti: true
  sviluppo_requisiti_s: 8.0
  sviluppo_tappe_requisiti: 6
  sviluppo_verifica_s: 60.0
  sviluppo_verifica_voce_s: 20.0

estensioni:
  # Estensioni (calliope/estensioni/, 04/10, docs/ricerche/2026-10-04-estensioni-e-guardrail.md):
  # funzioni permanenti scritte dall'agente su richiesta di chi amministra, approvate con la
  # frase di sfida, eseguite sempre nel container della sandbox (Docker) con la sola porta
  # stretta verso Calliope. Senza Docker o senza l'immagine non girano
  estensioni_enabled: true
  # Codice, versioni, dati e registro delle decisioni, relativo alla cartella della config
  estensioni_cartella: estensioni
  # Estensioni attive insieme (ognuna è un tool in più per il modello)
  estensioni_max_attive: 8
  # Quanto il tool aspetta il risultato prima di dire «ti dico il risultato appena arriva»
  estensioni_attesa_s: 8.0
  # Quanto un'azione pericolosa sospesa aspetta il «sì» della persona
  estensioni_conferma_s: 120.0
  # Tetti che un manifesto può chiedere
  estensioni_tempo_max_s: 30.0
  estensioni_memoria_max_mb: 512
  # Secondo parere del modello grande (quello degli agenti) sulle richieste con testo
  # libero: può solo alzare il rischio. Secondi massimi di attesa
  estensioni_secondo_parere: true
  estensioni_parere_s: 4.0
  # Richieste a internet al minuto per estensioni e pagine d'esempio dell'agente, tutte
  # insieme (calliope/web/rete.py, 05/10): solo internet pubblico, porte 80 e 443, ogni
  # uscita nel registro estensioni/uscite.jsonl
  estensioni_rete_max_minuto: 30
  # Giochi e schede interattive (05/10, calliope/estensioni/scheda.py, calliope/schermi/
  # giochi.py, docs/ricerche/2026-10-05-giochi.md): un'estensione con una «scheda» gira nel
  # browser degli schermi in un riquadro isolato (iframe sandbox, origine opaca, niente rete)
  # che parla con Calliope solo con messaggi controllati qui. false = niente giochi
  giochi_enabled: true
  # Frasi al minuto che un gioco può far dire a Calliope (per partita)
  giochi_frasi_minuto: 3
  # Messaggi al secondo da un riquadro verso Calliope (mosse, salvataggi), per schermo
  giochi_messaggi_secondo: 10
  # Byte massimi di un messaggio di un riquadro (JSON): mosse e stati, non file
  giochi_messaggio_max: 4096
  # Messaggi di chat tra giocatori al minuto, per schermo (con un minore o un ospite nella
  # partita passano dal guardiano)
  giochi_chat_minuto: 6
  # Secondi senza risposta al controllo del riquadro prima di chiuderlo (cane da guardia)
  giochi_watchdog_s: 6.0
  # Ore di vita di una partita senza segni dalle pagine: poi il suo indirizzo non vale più
  giochi_partita_ore: 6.0
  # Comandi a voce di un gioco (11/10, «ascolta» nel manifesto, calliope/gioco_voce.py): dopo
  # una mossa o una risposta, finché il gioco aperto sullo schermo del satellite aspetta un
  # comando, l'ascolto resta aperto senza il nome per questi secondi, ma senza nome valgono
  # SOLO le forme dell'elenco del gioco (il resto si ignora come a Calliope addormentata).
  # Senza mosse per tanto torna «dormo». 0 = il nome serve sempre (i comandi detti dopo il
  # nome vanno comunque al gioco)
  giochi_ascolto_s: 60.0
  # Il giudice di fase dei giochi (14/10, passo 6 del progetto, calliope/gioco_giudice.py):
  # una frase rivolta a Calliope che non è una forma chiusa del gioco aperto («apri la terza»)
  # passa da una chiamata breve e separata al modello (il rilevatore sulla DGX, se no quello
  # della voce, con lo stesso num_ctx), con l'uscita vincolata ai comandi attivi più
  # «nessuno»: 21 giuste su 22 e 357 ms di mediana sul portatile (gemma4 e4b). Spento: il
  # modello della voce con il tool gioco_comando, come l'11/10
  giochi_giudice: true
  # Il giudice anche nella finestra del gioco senza il nome: spento (decisione 2 di chi
  # amministra del 12/10: ogni frase della stanza diventerebbe una chiamata al modello e una
  # chiacchiera una mossa; prima si misurano le frasi ignorate, gioco_finestra_ignorata)
  giochi_giudice_senza_nome: false
  # Il modello del giudice (vuoto: quello del giudizio «rivolta», cioè il rilevatore di
  # pericolo, altrimenti il modello della voce su Ollama) e il tempo massimo: oltre, la frase
  # va al modello della voce come se avesse detto «nessuno»
  giochi_giudice_modello: ''
  giochi_giudice_timeout_s: 2.0

archivio:
  # Archivio dei documenti di casa (calliope/archivio/, 03/10): bollette, ricevute, contratti,
  # polizze, garanzie, referti, documenti d'identità e manuali di una cartella, letti in
  # secondo piano (testo dei PDF, OCR con il modello visivo per scansioni e foto), schedati dal
  # modello grande e messi in un grafo in SQLite; a voce archivio_cerca, archivio_scadenze e
  # archivio_somma. Senza cartella l'archivio è spento e i tool non ci sono.
  archivio_enabled: true
  # La cartella dei documenti (fuori da git, in calliope.locale.yaml). Una sottocartella con
  # il nome di un profilo («Giulia/») tiene i documenti personali di quella persona; il resto
  # è della casa. Referti e documenti d'identità li vedono solo l'interessato e chi amministra
  archivio_cartella: null
  # Il database del grafo, relativo alla cartella del file di configurazione
  archivio_db: archivio.db
  # Ogni quanti minuti si guarda se ci sono documenti nuovi o cambiati
  archivio_intervallo_min: 10.0
  # OCR di scansioni e foto con il modello visivo (qwen3.6 sulla DGX legge le immagini)
  archivio_ocr: true
  # Server del modello per OCR ed estrazione (http://127.0.0.1:8000/v1 = vLLM, senza /v1 =
  # Ollama). Vuoto = quello degli agenti (dgx.yaml o agenti_url)
  archivio_url: null
  # Il modello dell'estrazione; vuoto = lo scrittore degli agenti (o il loro modello)
  archivio_modello: null
  # Il modello dell'OCR; vuoto = lo stesso dell'estrazione (deve leggere le immagini)
  archivio_ocr_modello: null
  # Chi è chi nei documenti: profilo → nomi e codici fiscali come scritti sui documenti,
  # separati da virgole (Dario: "Mario Rossi, RSSMRA…"). Senza, un documento è di una
  # persona solo se il nome completo del profilo è quello sul documento
  archivio_intestatari: {}
  # Pagine lette per documento (i manuali lunghi: solo le prime) e dimensione massima
  archivio_max_pagine: 12
  archivio_max_mb: 50.0

ufficio:
  # Ufficio (calliope/ufficio/, docs/ricerche/2026-10-03-template.md): modelli di documento
  # compilati a voce (fattura, nota di credito, preventivo, DDT e i modelli Word, PowerPoint
  # o JSON dell'utente), rubrica dei clienti e numerazione progressiva. Serve il servizio
  # dei documenti; senza docxtpl o python-pptx mancano solo i modelli di quel tipo.
  ufficio_enabled: true
  # Cartella dei modelli dell'utente (.docx o .pptx con accanto il .yaml di descrizione, o
  # i .json). Vuoto = Documenti/Calliope/Modelli, la stessa dei modelli degli agenti
  ufficio_modelli: null
  # Chi può preparare fatture e note di credito: «amministra» o «familiare». Preventivi,
  # DDT, modelli e rubrica: i familiari. Gli ospiti mai
  ufficio_livello_fiscale: amministra
  # Secondi in cui i dati già raccolti di un modello restano validi: la risposta a «mi
  # servono il cliente e il prezzo» completa lo stesso documento
  ufficio_bozza_s: 900.0
  # Formato dei numeri per serie, con {n} e {anno} (predefiniti: fatture «{n}/{anno}»,
  # note_credito «NC{n}/{anno}», preventivi «P{n}/{anno}», ddt «DDT{n}/{anno}»)
  ufficio_serie: {}
  # Chi emette fatture, preventivi e DDT: va in calliope.locale.yaml. Chiavi:
  # denominazione (o nome e cognome), partita_iva, codice_fiscale, regime_fiscale (RF01
  # ordinario, RF19 forfettario), indirizzo, civico, cap, comune, provincia, nazione,
  # iban, email, telefono, aliquota_iva (22), ritenuta (aliquota, per esempio 20: solo verso
  # clienti con partita IVA), tipo_ritenuta (RT01), causale_ritenuta (A), cassa_tipo
  # (TC22 = rivalsa INPS), cassa_aliquota (4), cassa_ritenuta (si/no), giorni_pagamento
  # (30), bollo_addebito (si: i 2 euro del bollo a carico del cliente)
  fatture_emittente: {}
  # Cartella con lo schema XSD ufficiale di FatturaPA (Schema_VFPR12_v1.2.3.xsd) e
  # xmldsig-core-schema.xsd, relativa alla cartella del file di configurazione: si
  # scaricano con `python -m calliope.ufficio --scarica-xsd`. Senza, ogni fattura passa
  # solo i controlli di Calliope
  fatture_xsd: fatturapa

web:
  # Ricerca su internet (03/10, calliope/web/, docs/ricerche/2026-10-03-ricerca-web.md):
  # SearXNG sulla DGX (calliope motore searxng avvia) per l'attualità che la biblioteca non
  # sa: meteo, notizie, risultati, orari, prezzi. Accesa se c'è web_searxng_url (sulla DGX
  # http://127.0.0.1:8004, in calliope.locale.yaml); senza, o con online false, il tool
  # web_cerca non c'è
  web_enabled: true
  web_searxng_url: null
  # Da che livello si può cercare: ospite, familiare o amministra. Le domande escono di
  # casa: di predefinito non gli ospiti
  web_livello: familiare
  # Al più tante ricerche al minuto (voce e agente insieme), per non farsi bloccare dai
  # motori di ricerca; risultati dati al modello; tempo massimo di una ricerca
  web_max_minuto: 10
  web_risultati: 5
  web_timeout_s: 6.0
  # Quanti risultati di web_cerca e biblioteca_cerca parlano di ciò di cui si parlava (16/10,
  # issue #101, calliope/pertinenza.py: parole in comune con la frase e i turni prima).
  # «ombra»: solo nel registro dei turni (regola ricerca_fuori_tema_ombra, conteggio in
  # calliope stato --turni), niente al modello; «attiva»: anche nel risultato come
  # «pertinenti: 0 su 5», un dato per il modello (regola ricerca_fuori_tema); «spenta»: niente.
  # In ombra finché non si sa quanti falsi «fuori tema» dà sulle ricerche vere (sinonimi,
  # inglese, nomi storpiati non li riconosce)
  ricerca_pertinenza: ombra
  web_lingua: it-IT
  # Preferire i risultati nella lingua di casa (09/10, caso della DGX: «la miglior salsa di
  # pomodoro» → Bing ignora `web_lingua` e dava forum in cinese tra i primi): con
  # web_lingua italiana, prima i risultati in italiano (riconosciuti dalle parole comuni e
  # dal dominio .it), poi gli incerti, in fondo le altre lingue; nessuno si toglie. Se la
  # domanda chiede un'altra lingua o siti stranieri («in inglese», «site:…») nessuna
  # preferenza e language=all. false = l'ordine di SearXNG, come prima
  web_preferisci_lingua: true
  # Stringhe che non devono mai uscire di casa in una ricerca, oltre ai nomi delle persone
  # registrate e ai dati dell'emittente delle fatture: l'indirizzo di casa, il cognome…
  # (in calliope.locale.yaml). Codici fiscali, IBAN, email e telefoni si tolgono comunque
  web_dati_privati: []
  # Pagine lette dall'agente (web_leggi): dimensione e tempo massimi, caratteri dati al
  # modello; ricerche e pagine al più per lavoro
  web_pagina_max_kb: 1024
  web_pagina_timeout_s: 10.0
  web_pagina_caratteri: 8000
  web_agente_ricerche: 8
  web_agente_pagine: 6
  # Reti che l'agente non legge mai, oltre a quelle private e locali (sempre vietate): la
  # rete dell'ufficio se ha indirizzi pubblici, in notazione CIDR («203.0.113.0/24»)
  web_reti_vietate: []
  # Nomi e indirizzi pubblici di casa (08/10, sonde dell'agente § 2.4): il nome DuckDNS e
  # l'IP pubblico del router risolvono a un indirizzo «pubblico», e con un inoltro di porta
  # una richiesta di un'estensione o dell'agente tornerebbe dentro casa. Qui i nomi e gli IP
  # da trattare come rete di casa (es. «casa-mia.duckdns.org»: il valore vero va in
  # calliope.locale.yaml). In più valgono da soli i nomi già nella configurazione
  # (casa_tls_nome, l'host di casa_url, di satellite_server, degli altri *_url e
  # schermi_nomi). Ogni nome si risolve al momento della richiesta (al più ogni minuto) e
  # una richiesta verso uno di quegli indirizzi si ferma (regola rete_casa_pubblica)
  web_nomi_casa: []
  # SearXNG tenuto aggiornato (09/10, calliope/web/motore.py): i motori a cui si appoggia
  # cambiano spesso e un'immagine vecchia smette di trovare. Una volta al giorno, con
  # Calliope ferma da web_searxng_inattivita_min e nessun lavoro dell'agente in corso, poche
  # ricerche di prova (web_searxng_prove, «categoria:domanda», fisse e senza dati di
  # nessuno) contro il SearXNG locale: risultati, motori che rispondono, errori, tempi. Se
  # una prova dà meno di web_searxng_min_risultati risultati, o risultati e motori scendono
  # sotto web_searxng_soglia dell'ultimo controllo buono, la ricerca web è «degradata» nel
  # registro delle capacità. web_searxng_aggiorna:
  #   automatico  se è degradata, o se c'è un tag più recente pubblicato da almeno
  #               web_searxng_giorni giorni, scarica quel tag (mai «latest»: tag e digest dal
  #               registro delle immagini), lo prova accanto a quello in uso e lo tiene solo
  #               se va almeno come il vecchio, altrimenti torna indietro; un avviso sugli
  #               schermi personali di chi amministra
  #   manuale     solo il controllo; si aggiorna dal cruscotto di chi amministra
  #               («Aggiorna») o da terminale (calliope motore searxng aggiorna)
  # Solo sulla macchina del container (Linux con docker): altrove il controllo resta se
  # SearXNG è raggiungibile, l'aggiornamento no. Non si cambia a voce: si scrive in
  # calliope.locale.yaml (sezione web) e si riavvia
  web_searxng_aggiorna: automatico
  web_searxng_giorni: 3.0
  web_searxng_controllo_ore: 24.0
  web_searxng_inattivita_min: 30.0
  web_searxng_prove:
  - general:meteo Roma domani
  - news:notizie Italia oggi
  - news:Serie A risultati
  web_searxng_min_risultati: 3
  web_searxng_soglia: 0.6
  # Motori in pausa (09/10 sera): SearXNG aspetta fino al suo timeout i motori che non
  # rispondono (Brave «too many requests», Wikidata in timeout: 3 s su «meteo Roma domani»).
  # Un motore che non risponde in web_searxng_pausa_controlli controlli di fila (mentre altri
  # danno risultati nella stessa prova) va in pausa: le impostazioni si rifanno senza di lui e
  # SearXNG si riavvia (pochi secondi, solo con Calliope ferma o a richiesta). Dopo
  # web_searxng_pausa_giorni giorni si riprova; se non risponde ancora, di nuovo in pausa.
  # Con meno di web_searxng_min_motori motori che danno risultati e qualcuno in pausa la
  # ricerca è «degradata». 0 controlli = mai in pausa
  web_searxng_pausa_controlli: 2
  web_searxng_pausa_giorni: 3.0
  web_searxng_min_motori: 3
  # Lo stato del controllo e la storia delle decisioni (nella cartella dei dati), e il
  # registro delle immagini da cui si leggono tag e digest
  web_searxng_stato: motore/searxng.json
  web_searxng_registro: https://hub.docker.com/v2/repositories/searxng/searxng/tags?page_size=50&ordering=last_updated

notizie:
  # Notizie dai feed RSS delle testate (13/10, calliope/notizie/, ricerche del 12 e 13/10 in
  # docs/ricerche/2026-10-1[23]-notizie-rss.md): i feed si scaricano in casa e le notizie si
  # leggono dal disco, senza mandare la domanda fuori (SearXNG resta il ripiego quando i feed
  # non bastano). Tool `notizie`, di sola lettura; con online false non c'è
  notizie_enabled: true
  # I feed: «testata | tema | indirizzo», con in coda le opzioni «fuso=Europe/Rome» (la testata
  # scrive l'ora italiana marcata GMT, come Sky TG24) e «veloce» (feed che cambia per intero in
  # meno di 2 ore: si scarica ogni ora nei giorni in cui qualcuno chiede notizie). Temi:
  # generale, sport, economia, tecnologia, ragazzi (i soli, con sport e tecnologia, che
  # sentono i minori), allerta (bollettini della Protezione civile). La testata è il nome detto a
  # voce («secondo l'ANSA»). Il feed regionale ANSA si aggiunge da solo (notizie_regione)
  notizie_feed:
  - ANSA | generale | https://www.ansa.it/sito/ansait_rss.xml
  - ANSA | generale | https://www.ansa.it/sito/notizie/topnews/topnews_rss.xml
  - Rainews | generale | https://www.rainews.it/rss/tutti
  - Sky TG24 | generale | https://tg24.sky.it/rss/tg24.xml | fuso=Europe/Rome
  - AGI | generale | https://www.agi.it/rss | veloce
  - Adnkronos | generale | https://www.adnkronos.com/RSS_Ultimora.xml | veloce
  - Il Post | generale | https://www.ilpost.it/feed
  - Il Sole 24 Ore | generale | https://www.ilsole24ore.com/rss/italia.xml
  - La Gazzetta dello Sport | sport | https://www.gazzetta.it/dynamic-feed/rss/section/last.xml
  - ANSA | sport | https://www.ansa.it/sito/notizie/sport/sport_rss.xml
  - Corriere dello Sport | sport | https://www.corrieredellosport.it/rss/calcio
  - ANSA | economia | https://www.ansa.it/sito/notizie/economia/economia_rss.xml
  - Adnkronos | economia | https://www.adnkronos.com/RSS_Economia.xml
  - Il Sole 24 Ore | economia | https://www.ilsole24ore.com/rss/economia.xml
  - HDblog | tecnologia | https://www.hdblog.it/feed/
  - Punto Informatico | tecnologia | https://www.punto-informatico.it/feed/
  - ANSA | tecnologia | https://www.ansa.it/canale_tecnologia/notizie/tecnologia_rss.xml
  - Focus Junior | ragazzi | https://www.focusjunior.it/feed/
  - Protezione civile | allerta | https://api.protezionecivile.it/default/dpcPortalGenerateRss?categoria=bollettino_vigilanza
  - Protezione civile | allerta | https://api.protezionecivile.it/default/dpcPortalGenerateRss?categoria=bollettino_criticita
  # Testate spente per nome, e accese per nome (un nome in notizie_accese vince su
  # notizie_spente). Il Post e Il Sole 24 Ore sono spenti di serie: le loro condizioni vietano
  # l'«elaborazione» dei contenuti o il loro uso per i sistemi di IA (ricerca del 13/10, § 2).
  # Per accenderli, in calliope.locale.yaml, sezione notizie:
  #   notizie_accese: [Il Post, Il Sole 24 Ore]
  notizie_spente:
  - Il Post
  - Il Sole 24 Ore
  notizie_accese: []
  # Feed in più di questa casa (una testata della città), stessa forma di notizie_feed, in
  # calliope.locale.yaml: così l'elenco di serie resta quello del file d'esempio
  notizie_feed_extra: []
  # Il feed regionale dell'ANSA: vuoto = la regione della città di casa (casa_citta, o quella
  # detta a voce), «no» = nessuno, oppure il nome della regione («Lombardia»)
  notizie_regione: ''
  # Da che livello si possono chiedere: ospite, familiare o amministra. La domanda non esce
  # di casa (solo lo scarico, uguale per tutti): di predefinito anche gli ospiti. Il ripiego su
  # SearXNG vale solo per chi può usare web_cerca (web_livello)
  notizie_livello: ospite
  # Ogni quanti minuti si scaricano i feed, solo se qualcuno ha chiesto notizie negli ultimi
  # notizie_attesa_giorni giorni (decisione 0024: niente internet quando non serve); dopo
  # notizie_conserva_giorni le voci si cancellano. Il file è nella cartella dei dati
  notizie_intervallo_min: 120.0
  notizie_attesa_giorni: 7.0
  notizie_conserva_giorni: 7.0
  notizie_db: notizie.db
  # Quanti fatti per «che notizie ci sono?» (13/10, Dario: 5 invece di 3): fatti unici, ognuno
  # con tutte le testate che lo riportano (i doppioni sono già raggruppati)
  notizie_fatti: 5

segreti:
  # File dei segreti, fuori da git: il token di Home Assistant sta sotto
  # «home_assistant:» alla voce «token:». Relativo alla cartella del file di
  # configurazione. La variabile d'ambiente CALLIOPE_HA_TOKEN vince sul file.
  segreti_file: segreti.yaml

registro:
  # Registro dei turni (JSONL, un file al giorno): base dell'auto-miglioramento.
  # CALLIOPE_TURN_LOG="" lo spegne. Le parole restano per le persone di casa riconosciute,
  # minori compresi dal 16/10 (decisione 0031): di ospiti e zona grigia solo i numeri (12/10,
  # decisione 0028, calliope/conserva.py).
  # La cartella è privata (fuori da git, permessi 700 su Linux) e tiene anche la voce
  # (variabile d'ambiente CALLIOPE_TURN_LOG, che vince su questo file)
  turn_log_dir: registro
  # Dopo questi giorni turni, voce e archivio delle conversazioni si cancellano (60 dal 12/10:
  # prima 30)
  turn_log_days: 60
  # La voce delle persone di casa riconosciute sopra soglia, con il loro consenso detto a
  # Calliope (chi amministra: sì finché non dice no; un minore col sì di un tutore, dal 16/10,
  # decisione 0031), in turn_log_dir/voce, in μ-law (~16 KB al secondo, ~15 MB in una
  # giornata piena della DGX). Per banco, regressione e taratura delle soglie; mai inviata,
  # mai degli ospiti. false = mai la voce (le registrazioni che ci sono si cancellano alla
  # rotazione del giorno dopo)
  conserva_voce: true
  # Tetto della voce conservata, in MB: oltre, si tolgono i giorni più vecchi. 0 = nessun tetto
  conserva_voce_mb: 2000
  # Latenza vera della voce (06/10, calliope/latenza.py): se la mediana della prima frase di
  # oggi o di ieri (dal registro dei turni, almeno 10 risposte) supera questi secondi, lo
  # dicono l'avvio e `calliope stato`; dettagli con `calliope stato --turni`. 0 = mai. Dal 02
  # al 05/10 la DGX era passata da 0,78 a 2,05 s senza che nessuno lo vedesse
  latenza_avviso_s: 1.2
  # Attrito della sicurezza (08/10, calliope/attrito.py, decisione D6): oltre queste domande di
  # sicurezza ogni 100 turni con una frase (giorni con almeno 50 turni), o con una domanda
  # ripetuta per la stessa azione entro 5 minuti, lo dicono l'avvio e `calliope stato`;
  # dettagli con `calliope stato --turni`. Il 07/10 erano 15,8, 28 su 41 falsi positivi
  # (docs/ricerche/2026-10-07-sicurezza-per-valore.md). Obiettivo ≤ 2; 0 = solo le ripetute
  attrito_avviso: 3.0
  # L'arbitro della memoria (15/10, passo 2: docs/ricerche/2026-10-14-arbitro-memoria.md,
  # calliope/arbitro_ombra.py). «ombra»: un thread leggero registra, a ogni richiesta di carico
  # (embedding, corsia lenta, guardiano a posteriori, lavori dell'agente) e a ogni minuto, cosa
  # avrebbe messo in coda, quando l'avrebbe fatto partire, chi avrebbe scaricato e la memoria
  # vera; e conta quando la «voce ferma» di guardia, corsia lenta, embedding e agente diverge
  # dalla definizione unica quiete(). Non carica e non scarica niente, non cambia nessuna
  # decisione: serve a una settimana di registro prima del passo 3 (`calliope stato --memoria
  # --storia`). «spento» (di serie): nessun thread, nessuna riga
  arbitro_memoria: spento
  # Diagnostica: CALLIOPE_DEBUG_AUDIO registra ogni frase captata (WAV + trascrizione).
  # (variabile d'ambiente CALLIOPE_DEBUG_AUDIO, che vince su questo file)
  debug_audio_dir: null

rete:
  # Rete (principio 5): se False, i tool con requires_internet spariscono dall'elenco
  online: true

