<text x='20' y='1162' class='g'>Confini di sicurezza</text>
<text x='20' y='1184' class='r'>C1 rete · C2 azioni (politica unica) · C3 codice dell'agente (container senza rete) · C4 estensioni (container + porta stretta + RetePubblica) · C5 uscita (riferire, guardiano)</text>
<text x='20' y='1204' class='r'>Fattore principale per chi amministra: la voce (CAM++). La frase di sfida ferma registrazioni e TV, non una voce clonata in tempo reale.</text>
<text x='20' y='1224' class='r'>Fonti: CLAUDE.md, docs/aree/, docs/ricerche/2026-10-06-analisi-complessiva.md</text>
