# Aggancio di logica, fisica e chimica (calliope/esercizi/logica.py, fisica.py, chimica.py)
# agli obiettivi ufficiali di matematica e scienze (12/10/2026). Fonti in fonti.yaml. Basta
# l'aggancio (decisione del 12/10): niente mappa per classe e periodo, solo `nota` dove
# l'argomento esce dal primo ciclo.
#
# `obiettivi`: TESTO UFFICIALE. `nota`: INTERPOLAZIONE o confronto nostro.

materia: scienze

obiettivi:
  # ── logica: sequenze, insiemi, vero o falso ──
  - id: in2012.p5.regolarita
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Matematica, Relazioni, dati e previsioni
    citazione: Riconoscere e descrivere regolarità in una sequenza di numeri o di figure.
    argomenti: [sequenze]
  - id: in2025.p5.regolarita
    indicazioni: "2025"
    traguardo: fine_quinta_primaria
    nucleo: Matematica, Relazioni, dati e previsioni
    citazione: Riconoscere e descrivere regolarita' in una sequenza di numeri o di figure.
    argomenti: [sequenze]
  - id: in2025.s3.sequenze
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Matematica, Relazioni e funzioni
    citazione: >-
      Estendere e generalizzare sequenze numeriche e geometriche, costruendo rappresentazioni in
      linguaggio simbolico per esprimere la generalizzazione individuata.
    argomenti: [sequenze]
  - id: in2012.p3.classificare
    indicazioni: "2012"
    traguardo: fine_terza_primaria
    nucleo: Matematica, Relazioni, dati e previsioni
    citazione: >-
      Classificare numeri, figure, oggetti in base a una o più proprietà, utilizzando
      rappresentazioni opportune, a seconda dei contesti e dei fini.
    argomenti: [insiemi]
  - id: in2025.p3.classificare
    indicazioni: "2025"
    traguardo: fine_terza_primaria
    nucleo: Matematica, Relazioni, dati e previsioni
    citazione: >-
      Classificare numeri, figure e oggetti in base alle proprieta' e ricorrendo a
      rappresentazioni opportune a seconda del contesto.
    argomenti: [insiemi]
  - id: in2025.s.operatori_logici
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    tipo: conoscenza
    nucleo: Matematica, Informatica
    citazione: >-
      Concetto di algoritmo e sua esecuzione rigorosa; sistema binario; variabili; strutture di
      controllo; operatori logici elementari
    argomenti: [vero_falso]
  - id: in2012.s.argomentare
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    tipo: traguardo
    nucleo: Matematica
    citazione: >-
      Sostiene le proprie convinzioni, portando esempi e controesempi adeguati e utilizzando
      concatenazioni di affermazioni
    argomenti: [vero_falso]

  # ── fisica: velocità, densità, forze ──
  - id: in2012.p5.concetti_fisici
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Scienze, Oggetti, materiali e trasformazioni
    citazione: >-
      Individuare, nell'osservazione di esperienze concrete, alcuni concetti scientifici quali:
      dimensioni spaziali, peso, peso specifico, forza, movimento, pressione, temperatura,
      calore, ecc.
    argomenti: [densita, forze, velocita]
  - id: in2012.s3.concetti_fisici
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Scienze, Fisica e chimica
    citazione: >-
      Utilizzare i concetti fisici fondamentali quali: pressione, volume, velocità, peso, peso
      specifico, forza, temperatura, calore, carica elettrica, ecc., in varie situazioni di
      esperienza; in alcuni casi raccogliere dati su variabili rilevanti di differenti fenomeni,
      trovarne relazioni quantitative
    argomenti: [velocita, densita, forze]
  - id: in2025.p5.peso_densita
    indicazioni: "2025"
    traguardo: fine_quinta_primaria
    nucleo: Scienze
    citazione: >-
      Differenziare il concetto di peso e quello di densita' attraverso esperienze sul
      galleggiamento
    argomenti: [densita]
  - id: in2025.s3.moto
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Scienze, Fenomeni fisici e astronomici
    citazione: >-
      Esplorare e osservare vari tipi di moto, anche avvalendosi di software di video-analisi e
      simulazioni, e comprenderne la descrizione in termini di posizione, spostamento, velocita'
      e accelerazione.
    argomenti: [velocita]
  - id: in2025.s3.lavoro
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Scienze, Fonti energetiche e trasformazioni
    citazione: >-
      Analizzare le modalita' di trasformazione e trasferimento dell'energia nei sistemi fisici,
      studiando fenomeni come il lavoro, la potenza e il rendimento energetico.
    argomenti: [forze]

  # ── chimica: massa molare, moli, bilanciamento ──
  - id: in2012.s3.trasformazione_chimica
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Scienze, Fisica e chimica
    citazione: >-
      Padroneggiare concetti di trasformazione chimica; sperimentare reazioni (non pericolose)
      anche con prodotti chimici di uso domestico e interpretarle sulla base di modelli semplici
      di struttura della materia
    argomenti: [bilanciamento]
  - id: in2025.s3.modelli_microscopici
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Scienze, Chimica e trasformazioni della materia
    citazione: >-
      Interpretare alcuni fenomeni osservati alla luce dei modelli microscopici della materia.
    argomenti: [massa_molare, bilanciamento]
  - id: in2025.s3.reazioni
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Scienze, Chimica e trasformazioni della materia
    citazione: >-
      Sperimentare reazioni chimiche di base quali le reazioni acido-base attraverso l'utilizzo
      di sostanze comuni per comprendere le trasformazioni della materia.
    argomenti: [bilanciamento]

# Dove l'argomento di Calliope e le Indicazioni non coincidono (interpolazione e confronto
# nostro; le classi sono quelle di ARGOMENTI nei moduli)
note:
  sequenze: >-
    Calliope dalla seconda primaria; il testo le chiede alla fine della quinta (regolarità) e
    della terza media (generalizzare): la seconda e la terza primaria sono un anticipo, con
    sequenze per salti (testo 2012 della terza: «per salti di due, tre»).
  insiemi: >-
    Dalla terza primaria: «classificare» è un obiettivo della terza in tutte e due le
    Indicazioni; i diagrammi di Venn sono la rappresentazione d'uso dei libri (prassi).
  vero_falso: >-
    Dalla quarta primaria; nelle Indicazioni i connettivi logici compaiono come «operatori
    logici elementari» dell'informatica (2025, secondaria). In quarta e quinta è un anticipo.
  velocita: >-
    Dalla prima media: velocità come spazio diviso tempo è della secondaria di primo grado nei
    due testi (2025: «posizione, spostamento, velocita' e accelerazione»).
  densita: >-
    Dalla prima media: peso e densità sono già nella quinta primaria (2025), ma come esperienza
    sul galleggiamento, senza il calcolo; il calcolo (massa diviso volume) è della media.
  forze: >-
    Dalla seconda media: forza peso e lavoro; nel testo 2025 lavoro e potenza sono della fine
    della terza media.
  massa_molare: >-
    Calliope dalla terza media, ma massa molare e moli non sono nelle Indicazioni del primo
    ciclo (che arrivano ai «modelli microscopici della materia»): sono delle superiori, fuori
    da questo indice. In terza media al più un anticipo, solo se la persona lo chiede.
  moli: Solo superiori (anche in Calliope), fuori da questo indice.
  bilanciamento: >-
    Calliope dalla terza media; il testo chiede di «sperimentare reazioni» e interpretarle con
    modelli semplici, non di bilanciarle: il bilanciamento con i coefficienti è delle superiori.
