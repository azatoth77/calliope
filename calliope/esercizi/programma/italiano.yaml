# Indice del programma d'italiano (12/10/2026). Fonti e regole in fonti.yaml; formato come
# matematica.yaml: `obiettivi` è TESTO UFFICIALE, `mappa` è INTERPOLAZIONE.
#
# Calliope genera solo la riflessione sulla lingua (calliope/esercizi/italiano.py): analisi
# grammaticale (livello 1: articolo, nome, aggettivo, verbo; livelli 2 e 3: le nove parti del
# discorso) e analisi logica di base (livello 1: soggetto e predicato; 2: anche il complemento
# oggetto; 3: anche il predicato nominale). Lettura, scrittura, ortografia, ascolto e parlato,
# lessico e letteratura, che nelle Indicazioni sono la parte più grande, non si generano: per
# quelli servono la pagina del libro o il compito (fase B).

materia: italiano

obiettivi:
  # ── Indicazioni 2012 ──
  - id: in2012.p3.frase_completa
    indicazioni: "2012"
    traguardo: fine_terza_primaria
    nucleo: Elementi di grammatica esplicita e riflessione sugli usi della lingua
    citazione: >-
      Riconoscere se una frase è o no completa, costituita cioè dagli elementi essenziali
      (soggetto, verbo, complementi necessari).
    argomenti: [analisi_logica, analisi_grammaticale]
  - id: in2012.p5.frase_minima
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Elementi di grammatica esplicita e riflessione sugli usi della lingua
    citazione: >-
      Riconoscere la struttura del nucleo della frase semplice (la cosiddetta frase minima):
      predicato, soggetto, altri elementi richiesti dal verbo.
    argomenti: [analisi_logica]
  - id: in2012.p5.parti_del_discorso
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Elementi di grammatica esplicita e riflessione sugli usi della lingua
    citazione: >-
      Riconoscere in una frase o in un testo le parti del discorso, o categorie lessicali,
      riconoscerne i principali tratti grammaticali; riconoscere le congiunzioni di uso più
      frequente (come e, ma, infatti, perché, quando)
    argomenti: [analisi_grammaticale]
  - id: in2012.p.traguardo_frase
    indicazioni: "2012"
    traguardo: fine_primaria
    tipo: traguardo
    citazione: >-
      Padroneggia e applica in situazioni diverse le conoscenze fondamentali relative
      all'organizzazione logico-sintattica della frase semplice, alle parti del discorso (o
      categorie lessicali) e ai principali connettivi.
    argomenti: [analisi_grammaticale, analisi_logica]
  - id: in2012.s3.frase_semplice
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Elementi di grammatica esplicita e riflessione sugli usi della lingua
    citazione: >-
      Riconoscere l'organizzazione logico-sintattica della frase semplice.
    argomenti: [analisi_logica]
  - id: in2012.s3.parti_del_discorso
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Elementi di grammatica esplicita e riflessione sugli usi della lingua
    citazione: >-
      Riconoscere in un testo le parti del discorso, o categorie lessicali, e i loro tratti
      grammaticali.
    argomenti: [analisi_grammaticale]

  # ── Indicazioni 2025 ──
  - id: in2025.p3.verbi
    indicazioni: "2025"
    traguardo: fine_terza_primaria
    nucleo: Lingua e letteratura
    citazione: >-
      Tempi e modi verbali. Conoscere e adoperare correttamente i tempi e i modi verbali, a
      cominciare dall'indicativo per indicare il presente, il futuro e le gradazioni del passato.
    argomenti: [analisi_grammaticale]
  - id: in2025.p5.parti_del_discorso
    indicazioni: "2025"
    traguardo: fine_quinta_primaria
    nucleo: Lingua e letteratura
    citazione: >-
      Grammatica e ampliamento del lessico. Conoscere la grammatica per le classi di parole;
      dunque identificare le parti del discorso, attraverso esercizi pratici con equilibrato
      ricorso a definizioni e classificazioni.
    argomenti: [analisi_grammaticale]
  - id: in2025.p5.connessione
    indicazioni: "2025"
    traguardo: fine_quinta_primaria
    nucleo: Lingua e letteratura
    citazione: >-
      riconoscere la funzione di connessione delle preposizioni e congiunzioni, la funzione di
      modificazione propria dell'avverbio
    argomenti: [analisi_grammaticale]
  - id: in2025.p.verbo_soggetto
    indicazioni: "2025"
    traguardo: fine_quinta_primaria
    tipo: conoscenza
    citazione: >-
      si insegnera' a cogliere il rapporto tra verbo e soggetto della frase mediante esercizi
      pratici, rendendo gli allievi attenti al fatto che il soggetto non ha sempre una posizione
      prevedibile
    argomenti: [analisi_logica]
  - id: in2025.p5.scrivere
    indicazioni: "2025"
    traguardo: fine_quinta_primaria
    tipo: competenza
    citazione: >-
      Essere in grado di applicare le conoscenze fondamentali relative all'organizzazione
      logico-sintattica della frase semplice, alle parti del discorso e ai principali
      connettivi
    argomenti: [analisi_grammaticale, analisi_logica]
  - id: in2025.s3.analisi_logica
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Lingua e letteratura
    citazione: >-
      L'analisi logica. Esaminare e conoscere struttura e funzioni delle varie parti di una
      frase complessa. Riconoscere errori e fallacie logiche. Saper analizzare la struttura
      semantica di una frase, identificando il soggetto, il predicato, gli oggetti (diretti e
      indiretti), gli aggettivi attributivi e tutti gli altri elementi che la compongono.
    argomenti: [analisi_logica]
  - id: in2025.s3.parti_del_discorso
    indicazioni: "2025"
    traguardo: fine_terza_secondaria
    nucleo: Lingua e letteratura
    citazione: >-
      riconoscere le parti del discorso, i connettivi sintattici e testuali, tutti i segni
      interpuntivi e la loro funzione
    argomenti: [analisi_grammaticale]

# ─────────────────────────── interpolazione ───────────────────────────
# Campi: livello (del generatore), esempio, generatore_dentro (giudizio, non misura: il
# generatore non ha un limite numerico qui), perche.
mappa:
  analisi_grammaticale:
    elementari-2:
      inizio: {livello: 0, esempio: "", generatore_dentro: false}
      fine: {livello: 1, esempio: "«gatto» è un nome, un verbo o un articolo?", generatore_dentro: true}
      obiettivi: [in2012.p3.frase_completa]
      perche: >-
        In seconda nome, articolo e verbo, poi l'aggettivo (prassi). A inizio anno si lavora
        ancora sulla scrittura: nessun livello adatto.
    elementari-3:
      inizio: {livello: 1, esempio: "nella frase «Il cane corre», «corre» che parte è?", generatore_dentro: true}
      fine: {livello: 1, esempio: "nella frase «La bambina gentile legge», «gentile» che parte è?", generatore_dentro: true}
      obiettivi: [in2012.p3.frase_completa, in2025.p3.verbi]
      perche: >-
        In terza le quattro parti di base e i tempi dell'indicativo (testo 2025). I tempi verbali
        non si generano oggi.
    elementari-4:
      inizio: {livello: 1, esempio: "«alto» che parte è?", generatore_dentro: true}
      fine: {livello: 2, esempio: "«sotto» che parte è?", generatore_dentro: true}
      obiettivi: [in2012.p5.parti_del_discorso, in2025.p5.parti_del_discorso]
      perche: In quarta pronomi, preposizioni, avverbi (prassi).
    elementari-5:
      inizio: {livello: 2, esempio: "«ma» che parte è?", generatore_dentro: true}
      fine: {livello: 2, esempio: "«velocemente» che parte è?", generatore_dentro: true}
      obiettivi: [in2012.p5.parti_del_discorso, in2025.p5.parti_del_discorso, in2025.p5.connessione]
      perche: >-
        Le nove parti del discorso alla fine della quinta (testo ufficiale: «identificare le
        parti del discorso»; congiunzioni e avverbi).
    medie-1:
      inizio: {livello: 3, esempio: "«eppure» che parte è?", generatore_dentro: true}
      fine: {livello: 3, esempio: "«eppure» che parte è?", generatore_dentro: true}
      obiettivi: [in2012.s3.parti_del_discorso, in2025.s3.parti_del_discorso]
      perche: La prima media è l'anno della grammatica (prassi).
  analisi_logica:
    elementari-3:
      inizio: {livello: 0, esempio: "", generatore_dentro: false}
      fine: {livello: 1, esempio: "nella frase «Marta canta», qual è il soggetto?", generatore_dentro: true}
      obiettivi: [in2012.p3.frase_completa]
      perche: >-
        Il testo 2012 chiede già alla fine della terza soggetto e verbo («frase completa»):
        l'argomento in calliope/esercizi/italiano.py comincia dalla quarta, da allargare.
    elementari-4:
      inizio: {livello: 1, esempio: "qual è il predicato?", generatore_dentro: true}
      fine: {livello: 1, esempio: "qual è il soggetto?", generatore_dentro: true}
      obiettivi: [in2012.p5.frase_minima, in2025.p.verbo_soggetto]
      perche: La frase minima (soggetto e predicato) in quarta (prassi).
    elementari-5:
      inizio: {livello: 1, esempio: "qual è il soggetto?", generatore_dentro: true}
      fine: {livello: 2, esempio: "qual è il complemento oggetto?", generatore_dentro: true}
      obiettivi: [in2012.p5.frase_minima, in2025.p5.scrivere]
      perche: >-
        «Altri elementi richiesti dal verbo» (testo 2012): l'espansione diretta, il complemento
        oggetto, alla fine della quinta.
    medie-1:
      inizio: {livello: 2, esempio: "qual è il complemento oggetto?", generatore_dentro: true}
      fine: {livello: 2, esempio: "qual è il complemento oggetto?", generatore_dentro: true}
      obiettivi: [in2012.s3.frase_semplice, in2025.s3.analisi_logica]
      perche: In prima media si riprende la frase semplice.
    medie-2:
      inizio: {livello: 3, esempio: "«è stanco» che cosa è?", generatore_dentro: true}
      fine: {livello: 3, esempio: "«è stanco» che cosa è?", generatore_dentro: true}
      obiettivi: [in2012.s3.frase_semplice, in2025.s3.analisi_logica]
      perche: >-
        La seconda media è l'anno dell'analisi logica (prassi): predicato nominale e i
        complementi indiretti, che il generatore non fa.
