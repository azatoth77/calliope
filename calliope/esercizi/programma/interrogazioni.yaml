# Domande aperte delle interrogazioni (12/10/2026 sera, decisione di Dario: le interrogazioni
# sono una modalità degli esercizi; le domande vengono dagli obiettivi dell'indice o dalla pagina
# del libro).
#
# Ogni domanda è agganciata a obiettivi UFFICIALI dell'indice (matematica.yaml, italiano.yaml)
# che toccano il suo argomento; la domanda e i `criteri` sono INTERPOLAZIONE nostra (cosa deve
# contenere una risposta giusta detta da un bambino o da un ragazzo, con parole sue). Il giudizio
# lo dà il modello leggendo i criteri, con un livello di sicurezza: se non è sicuro, la risposta
# va «da guardare tu» nel riepilogo per i tutori. Le risposte calcolabili restano al codice.
#
# Campi: id (unico), argomento (di calliope/esercizi), classi [dalla, alla] (come
# «elementari-3»), domanda (detta dal codice, finisce con «?»), criteri (2–3 frasi brevi),
# obiettivi (id dell'indice).

domande:
  - id: add.riporto
    argomento: addizioni
    classi: [elementari-2, elementari-5]
    domanda: Spiegami come fai un'addizione in colonna quando le unità insieme fanno più di nove?
    criteri:
      - si comincia dalle unità, la colonna a destra
      - si scrive solo la cifra delle unità del risultato
      - si riporta uno, cioè la decina, nella colonna delle decine
    obiettivi: [in2012.p3.mentale, in2025.p3.operazioni]
  - id: add.ordine
    argomento: addizioni
    classi: [elementari-2, medie-1]
    domanda: Se in un'addizione cambi l'ordine dei numeri, il risultato cambia?
    criteri:
      - il risultato non cambia
      - basta l'idea che l'ordine non conta, anche senza il nome «proprietà commutativa»
    obiettivi: [in2012.p3.mentale, in2025.p3.operazioni]
  - id: sot.prestito
    argomento: sottrazioni
    classi: [elementari-2, elementari-5]
    domanda: In una sottrazione in colonna, cosa fai quando la cifra di sopra è più piccola di quella di sotto?
    criteri:
      - si prende in prestito una decina dalla colonna a sinistra
      - la cifra di sopra aumenta di dieci
      - la cifra della colonna a sinistra diminuisce di uno
    obiettivi: [in2012.p3.mentale, in2025.p3.operazioni]
  - id: sot.prova
    argomento: sottrazioni
    classi: [elementari-2, medie-1]
    domanda: Come puoi controllare se una sottrazione è giusta?
    criteri:
      - si fa la prova con l'addizione
      - il risultato più il numero tolto deve dare il primo numero
    obiettivi: [in2012.p3.mentale, in2025.p3.operazioni]
  - id: mol.significato
    argomento: moltiplicazioni
    classi: [elementari-2, elementari-4]
    domanda: Che cosa vuol dire quattro per tre? Me lo spieghi con un'addizione?
    criteri:
      - è come sommare quattro per tre volte, o tre per quattro volte
      - quattro più quattro più quattro fa dodici
    obiettivi: [in2012.p3.tabelline, in2025.p3.tabelline]
  - id: div.significato
    argomento: divisioni
    classi: [elementari-3, elementari-5]
    domanda: Che cosa vuol dire dividere dodici caramelle tra tre amici?
    criteri:
      - fare parti uguali
      - ognuno riceve quattro caramelle
    obiettivi: [in2012.p3.tabelline, in2025.p3.tabelline]
  - id: div.prova
    argomento: divisioni
    classi: [elementari-3, medie-1]
    domanda: Come controlli se una divisione è giusta?
    criteri:
      - si moltiplica il risultato per il numero per cui si è diviso
      - deve tornare il numero di partenza, aggiungendo il resto se c'è
    obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
  - id: fra.termini
    argomento: frazioni
    classi: [elementari-4, medie-2]
    domanda: In una frazione, che cosa ti dicono il numeratore e il denominatore?
    criteri:
      - il denominatore dice in quante parti uguali si divide l'intero
      - il numeratore dice quante di quelle parti si prendono
    obiettivi: [in2012.p5.frazioni, in2025.p5.frazioni]
  - id: fra.equivalenti
    argomento: frazioni
    classi: [elementari-4, medie-2]
    domanda: Che cosa sono due frazioni equivalenti? Mi fai un esempio?
    criteri:
      - indicano la stessa quantità, la stessa parte dell'intero
      - un esempio giusto, come un mezzo e due quarti
    obiettivi: [in2012.p5.frazioni, in2025.p5.frazioni]
  - id: pro.operazione
    argomento: problemi
    classi: [elementari-2, medie-1]
    domanda: Quando leggi un problema, come capisci quale operazione fare?
    criteri:
      - si legge bene la domanda e si cercano i dati
      - basta l'idea che aggiungere o mettere insieme è un'addizione, togliere o «quanto resta» una sottrazione, più volte la stessa quantità una moltiplicazione, parti uguali una divisione
    obiettivi: [in2012.p.problemi, in2025.p5.problemi]
  - id: pot.significato
    argomento: potenze
    classi: [medie-1, medie-3]
    domanda: Che cosa vuol dire due elevato alla terza?
    criteri:
      - moltiplicare due per sé stesso tre volte
      - fa otto
    obiettivi: [in2012.s3.potenze, in2025.s3.potenze]
  - id: equ.risolvere
    argomento: equazioni
    classi: [medie-3, medie-3]
    domanda: Che cosa vuol dire risolvere un'equazione?
    criteri:
      - trovare il valore dell'incognita, la x
      - il valore che rende vera l'uguaglianza
    obiettivi: [in2012.s3.equazioni, in2025.s3.equazioni]
  - id: gra.nome
    argomento: analisi_grammaticale
    classi: [elementari-2, medie-1]
    domanda: Che cos'è un nome? Mi fai un esempio?
    criteri:
      - è la parola che indica persone, animali, cose, luoghi o idee
      - un esempio giusto
    obiettivi: [in2012.p3.frase_completa, in2025.p5.parti_del_discorso]
  - id: gra.verbo
    argomento: analisi_grammaticale
    classi: [elementari-2, medie-1]
    domanda: Che cos'è un verbo? Mi fai un esempio?
    criteri:
      - è la parola che dice un'azione, un modo di essere o un modo di stare
      - un esempio giusto
    obiettivi: [in2012.p3.frase_completa, in2025.p3.verbi]
  - id: gra.aggettivo
    argomento: analisi_grammaticale
    classi: [elementari-3, medie-1]
    domanda: A che cosa serve un aggettivo?
    criteri:
      - dice com'è un nome, una sua qualità
      - si accorda con il nome a cui si riferisce, oppure un esempio giusto
    obiettivi: [in2012.p5.parti_del_discorso, in2025.p5.parti_del_discorso]
  - id: log.soggetto
    argomento: analisi_logica
    classi: [elementari-3, medie-2]
    domanda: Che cos'è il soggetto di una frase, e come lo trovi?
    criteri:
      - è chi o che cosa compie l'azione, o di chi si parla
      - si trova chiedendo al verbo «chi?» o «che cosa?»
    obiettivi: [in2012.p3.frase_completa, in2025.p.verbo_soggetto]
  - id: log.predicato
    argomento: analisi_logica
    classi: [elementari-4, medie-2]
    domanda: Che cos'è il predicato?
    criteri:
      - è il verbo della frase, che dice che cosa fa o com'è il soggetto
      - basta l'idea, anche senza distinguere verbale e nominale
    obiettivi: [in2012.p5.frase_minima, in2025.p.verbo_soggetto]
  - id: log.oggetto
    argomento: analisi_logica
    classi: [elementari-5, medie-2]
    domanda: Che cos'è il complemento oggetto, e a quale domanda risponde?
    criteri:
      - è la persona, l'animale o la cosa su cui ricade direttamente l'azione
      - risponde alla domanda «chi?» o «che cosa?» dopo il verbo, senza preposizione
    obiettivi: [in2012.p5.frase_minima, in2025.s3.analisi_logica]
