# Indice del programma di matematica (12/10/2026). Fonti e regole in fonti.yaml.
#
# `obiettivi`: TESTO UFFICIALE. Citazioni brevi e letterali dalle Indicazioni (in2025: DM
# 221/2025; in2012: DM 254/2012), con il traguardo a cui appartengono e gli argomenti di
# calliope/esercizi/matematica.py che vi si agganciano.
#
# `mappa`: INTERPOLAZIONE. Per ogni argomento, classe e periodo (inizio: settembre–gennaio,
# fine: febbraio–giugno) cosa Calliope proporrebbe: entro quale numero, con o senza cambio
# (riporto o prestito), il livello del generatore più vicino, un esempio. Le Indicazioni non
# hanno il dettaglio per classe: viene dalla prassi diffusa dei libri di testo e dei curricoli
# d'istituto (prima entro 20, seconda entro 100, terza entro 1000, quarta e quinta oltre), da
# confermare con il libro della persona. `generatore_dentro`: il generatore di oggi a quel
# livello resta dentro il limite? (lo controlla prova_programma su centinaia di semi). Dove è
# false serve il limite della fase B: oggi il livello è troppo largo per quella classe.

materia: matematica

obiettivi:
  # ── Indicazioni 2012 (classi già avviate nel 2025/26: nel 2026/27 dalla seconda primaria in su
  #    e dalla seconda media in su) ──
  - id: in2012.p3.contare
    indicazioni: "2012"
    traguardo: fine_terza_primaria
    nucleo: Numeri
    citazione: >-
      Contare oggetti o eventi, a voce e mentalmente, in senso progressivo e regressivo e per
      salti di due, tre, ...
    argomenti: [addizioni, sottrazioni]
  - id: in2012.p3.mentale
    indicazioni: "2012"
    traguardo: fine_terza_primaria
    nucleo: Numeri
    citazione: >-
      Eseguire mentalmente semplici operazioni con i numeri naturali e verbalizzare le procedure
      di calcolo.
    argomenti: [addizioni, sottrazioni, moltiplicazioni, divisioni]
  - id: in2012.p3.tabelline
    indicazioni: "2012"
    traguardo: fine_terza_primaria
    nucleo: Numeri
    citazione: >-
      Conoscere con sicurezza le tabelline della moltiplicazione dei numeri fino a 10. Eseguire
      le operazioni con i numeri naturali con gli algoritmi scritti usuali.
    argomenti: [addizioni, sottrazioni, moltiplicazioni, divisioni]
  - id: in2012.p3.posizionale
    indicazioni: "2012"
    traguardo: fine_terza_primaria
    nucleo: Numeri
    citazione: >-
      Leggere e scrivere i numeri naturali in notazione decimale, avendo consapevolezza della
      notazione posizionale; confrontarli e ordinarli, anche rappresentandoli sulla retta.
    argomenti: [addizioni, sottrazioni]
  - id: in2012.p5.quattro_operazioni
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Numeri
    citazione: >-
      Eseguire le quattro operazioni con sicurezza, valutando l'opportunità di ricorrere al
      calcolo mentale, scritto o con la calcolatrice a seconda delle situazioni.
    argomenti: [addizioni, sottrazioni, moltiplicazioni, divisioni]
  - id: in2012.p5.resto
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Numeri
    citazione: >-
      Eseguire la divisione con resto fra numeri naturali; individuare multipli e divisori di un
      numero.
    argomenti: [divisioni]
  - id: in2012.p5.frazioni
    indicazioni: "2012"
    traguardo: fine_quinta_primaria
    nucleo: Numeri
    citazione: Operare con le frazioni e riconoscere frazioni equivalenti.
    argomenti: [frazioni]
  - id: in2012.p.problemi
    indicazioni: "2012"
    traguardo: fine_primaria
    tipo: traguardo
    citazione: >-
      Riesce a risolvere facili problemi in tutti gli ambiti di contenuto, mantenendo il
      controllo sia sul processo risolutivo, sia sui risultati.
    argomenti: [problemi]
  - id: in2012.s3.operazioni
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Numeri
    citazione: >-
      Eseguire addizioni, sottrazioni, moltiplicazioni, divisioni, ordinamenti e confronti tra i
      numeri conosciuti (numeri naturali, numeri interi, frazioni e numeri decimali)
    argomenti: [addizioni, sottrazioni, moltiplicazioni, divisioni, frazioni, problemi]
  - id: in2012.s3.potenze
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Numeri
    citazione: >-
      Utilizzare la notazione usuale per le potenze con esponente intero positivo, consapevoli
      del significato, e le proprietà delle potenze per semplificare calcoli e notazioni.
    argomenti: [potenze]
  - id: in2012.s3.frazioni_equivalenti
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Numeri
    citazione: >-
      Utilizzare frazioni equivalenti e numeri decimali per denotare uno stesso numero razionale
      in diversi modi
    argomenti: [frazioni]
  - id: in2012.s3.espressioni
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Numeri
    citazione: >-
      Descrivere con un'espressione numerica la sequenza di operazioni che fornisce la soluzione
      di un problema.
    argomenti: [problemi]
  - id: in2012.s3.equazioni
    indicazioni: "2012"
    traguardo: fine_terza_secondaria
    nucleo: Relazioni e funzioni
    citazione: Esplorare e risolvere problemi utilizzando equazioni di primo grado.
    argomenti: [equazioni]

