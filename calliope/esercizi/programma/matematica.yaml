# ─────────────────────────── interpolazione ───────────────────────────
# Per classe: inizio (settembre–gennaio) e fine (febbraio–giugno). Settembre e ottobre sono di
# ripasso dell'anno prima, per questo «inizio» resta vicino alla «fine» della classe prima.
# Campi: entro (il numero più grande, risultato compreso), cambio (riporto o prestito ammessi),
# livello (del generatore di oggi), esempio, generatore_dentro, perche.
mappa:
  addizioni:
    elementari-1:
      inizio: {entro: 10, cambio: false, livello: 1, esempio: "4 + 3", generatore_dentro: false}
      fine: {entro: 20, cambio: true, livello: 1, esempio: "8 + 7", generatore_dentro: true}
      obiettivi: [in2012.p3.contare, in2025.p3.contare]
      perche: >-
        In prima si conta e si somma entro 10, poi entro 20 (prassi dei libri). Il livello 1 di
        oggi arriva già a 20, anche col cambio: largo per l'inizio della prima.
    elementari-2:
      inizio: {entro: 20, cambio: true, livello: 1, esempio: "9 + 6", generatore_dentro: true}
      fine: {entro: 100, cambio: true, livello: 2, esempio: "47 + 25", generatore_dentro: false}
      obiettivi: [in2012.p3.mentale, in2025.p3.operazioni]
      perche: >-
        In seconda si arriva al 100 con il cambio in colonna. Il livello 2 somma numeri a due
        cifre fino a 168: oltre il 100, da limitare.
    elementari-3:
      inizio: {entro: 100, cambio: true, livello: 2, esempio: "45 + 38", generatore_dentro: false}
      fine: {entro: 999, cambio: true, livello: 3, esempio: "356 + 278", generatore_dentro: false}
      obiettivi: [in2012.p3.tabelline, in2012.p3.posizionale, in2025.p3.operazioni]
      perche: >-
        La terza riprende il 100 e arriva al 1000 (prassi). A ottobre si ripassa il 100: le somme
        a tre cifre (277 + 121 del 12/10) sono dei mesi dopo, e il livello 3 arriva fino a 1798
        (675 + 427 del 12/10), oltre il 1000 della terza.
    elementari-4:
      inizio: {entro: 999, cambio: true, livello: 3, esempio: "468 + 375", generatore_dentro: false}
      fine: {entro: 99999, cambio: true, livello: 3, esempio: "2450 + 1375", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: >-
        In quarta si ripassa il 1000 e si va alle migliaia (prassi). Il generatore non va oltre
        le tre cifre: a fine quarta è più facile del programma.
    elementari-5:
      inizio: {entro: 99999, cambio: true, livello: 3, esempio: "3480 + 2765", generatore_dentro: true}
      fine: {entro: 999999, cambio: true, livello: 3, esempio: "12 500 + 8 760", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: >-
        In quinta i grandi numeri e i decimali (anche le Indicazioni: «numeri decimali»): il
        generatore resta sotto, niente decimali né più di tre cifre.
    medie-1:
      inizio: {entro: 999999, cambio: true, livello: 3, esempio: "4 350 + 2 875", generatore_dentro: true}
      fine: {entro: 999999, cambio: true, livello: 3, esempio: "4 350 + 2 875", generatore_dentro: true}
      obiettivi: [in2012.s3.operazioni, in2025.s3.operazioni]
      perche: In prima media le operazioni si ripassano come proprietà ed espressioni.
  sottrazioni:
    elementari-1:
      inizio: {entro: 10, cambio: false, livello: 1, esempio: "9 − 4", generatore_dentro: false}
      fine: {entro: 20, cambio: true, livello: 1, esempio: "15 − 7", generatore_dentro: true}
      obiettivi: [in2012.p3.contare, in2025.p3.contare]
      perche: Come le addizioni; il livello 1 parte da numeri fino a 20.
    elementari-2:
      inizio: {entro: 20, cambio: true, livello: 1, esempio: "17 − 9", generatore_dentro: true}
      fine: {entro: 100, cambio: true, livello: 2, esempio: "72 − 38", generatore_dentro: true}
      obiettivi: [in2012.p3.mentale, in2025.p3.operazioni]
      perche: Il prestito entro il 100 è della seconda (prassi).
    elementari-3:
      inizio: {entro: 100, cambio: true, livello: 2, esempio: "83 − 47", generatore_dentro: true}
      fine: {entro: 999, cambio: true, livello: 3, esempio: "604 − 258", generatore_dentro: true}
      obiettivi: [in2012.p3.tabelline, in2025.p3.operazioni]
      perche: Il prestito con lo zero (604 − 258) è della seconda metà della terza.
    elementari-4:
      inizio: {entro: 999, cambio: true, livello: 3, esempio: "731 − 486", generatore_dentro: true}
      fine: {entro: 99999, cambio: true, livello: 3, esempio: "5 000 − 1 748", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: Come le addizioni della quarta; il generatore resta a tre cifre.
    elementari-5:
      inizio: {entro: 99999, cambio: true, livello: 3, esempio: "8 205 − 3 467", generatore_dentro: true}
      fine: {entro: 999999, cambio: true, livello: 3, esempio: "10 000 − 4 375", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: Grandi numeri e decimali in quinta; il generatore resta sotto.
  moltiplicazioni:
    elementari-2:
      inizio: {entro: 50, livello: 1, esempio: "3 × 4", generatore_dentro: true}
      fine: {entro: 100, livello: 2, esempio: "6 × 7", generatore_dentro: true}
      obiettivi: [in2012.p3.tabelline, in2025.p3.tabelline]
      perche: >-
        Le tabelline si imparano in seconda (prima del 2, 3, 4, 5 e 10, poi le altre: prassi) e
        si sanno «con sicurezza» alla fine della terza (testo 2012).
    elementari-3:
      inizio: {entro: 100, livello: 2, esempio: "7 × 8", generatore_dentro: true}
      fine: {entro: 999, livello: 3, esempio: "34 × 6", generatore_dentro: true}
      obiettivi: [in2012.p3.tabelline, in2025.p3.operazioni, in2025.p3.tabelline]
      perche: >-
        In terza tabelline sicure, poi la moltiplicazione in colonna con una cifra al
        moltiplicatore (prassi).
    elementari-4:
      inizio: {entro: 100, livello: 2, esempio: "9 × 6", generatore_dentro: true}
      fine: {entro: 99999, livello: 3, esempio: "47 × 8", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: >-
        In quarta le tabelline si ripassano (anche a blocchi, come nel caso del 12/10) e si
        moltiplica in colonna anche con due cifre al moltiplicatore, che il generatore non fa.
    elementari-5:
      inizio: {entro: 99999, livello: 3, esempio: "58 × 7", generatore_dentro: true}
      fine: {entro: 999999, livello: 3, esempio: "86 × 9", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: "Moltiplicazioni con i decimali e per 10, 100, 1000: il generatore resta sotto."
  divisioni:
    elementari-3:
      inizio: {entro: 50, livello: 1, esempio: "20 : 4", generatore_dentro: true}
      fine: {entro: 100, livello: 2, esempio: "56 : 7", generatore_dentro: true}
      obiettivi: [in2012.p3.tabelline, in2025.p3.tabelline]
      perche: >-
        La divisione come tabellina al contrario è della terza (prassi; il testo 2012 chiede
        «le operazioni» con gli algoritmi scritti alla fine della terza).
    elementari-4:
      inizio: {entro: 100, livello: 2, esempio: "63 : 9", generatore_dentro: true}
      fine: {entro: 999, livello: 3, esempio: "456 : 6", generatore_dentro: true}
      obiettivi: [in2012.p5.quattro_operazioni, in2025.p5.quattro_operazioni]
      perche: In quarta la divisione in colonna con una cifra al divisore (prassi).
    elementari-5:
      inizio: {entro: 999, livello: 3, esempio: "738 : 9", generatore_dentro: true}
      fine: {entro: 9999, livello: 3, esempio: "864 : 8", generatore_dentro: true}
      obiettivi: [in2012.p5.resto, in2025.p5.resto]
      perche: >-
        In quinta la divisione con resto e con due cifre al divisore (testo ufficiale: «con
        resto»): il generatore fa solo divisioni esatte con una cifra al divisore.
  frazioni:
    elementari-3:
      inizio: {livello: 0, esempio: "", generatore_dentro: false}
      fine: {livello: 0, esempio: "un quarto della torta", generatore_dentro: false}
      obiettivi: [in2012.p5.frazioni, in2025.p5.frazioni]
      perche: >-
        In terza la frazione è un'idea (l'unità frazionaria, dividere in parti uguali): il
        generatore comincia con somme di frazioni (3/7 + 2/7), che sono della quarta. Livello 0:
        nessun esercizio adatto oggi.
    elementari-4:
      inizio: {livello: 1, esempio: "2/5 = ?/10", generatore_dentro: true}
      fine: {livello: 1, esempio: "3/8 + 2/8", generatore_dentro: true}
      obiettivi: [in2012.p5.frazioni, in2025.p5.frazioni]
      perche: Frazioni equivalenti e con lo stesso denominatore in quarta (prassi).
    elementari-5:
      inizio: {livello: 1, esempio: "4/6 = ?/12", generatore_dentro: true}
      fine: {livello: 2, esempio: "qual è più grande: 3/4 o 5/8?", generatore_dentro: true}
      obiettivi: [in2012.p5.frazioni, in2025.p5.frazioni]
      perche: >-
        In quinta frazioni equivalenti, confronto, frazione di un numero e percentuali (testo:
        «riconoscere frazioni equivalenti»). Semplificare ai minimi termini (livello 2) è al
        limite: si fa in prima media con il massimo comune divisore.
    medie-1:
      inizio: {livello: 2, esempio: "semplifica 12/18", generatore_dentro: true}
      fine: {livello: 2, esempio: "semplifica 12/18", generatore_dentro: true}
      obiettivi: [in2012.s3.frazioni_equivalenti, in2025.s3.frazioni_equivalenti]
      perche: Massimo comune divisore e minimo comune multiplo in prima media (prassi).
    medie-2:
      inizio: {livello: 3, esempio: "2/3 + 1/4", generatore_dentro: true}
      fine: {livello: 3, esempio: "3/5 × 2/7", generatore_dentro: true}
      obiettivi: [in2012.s3.operazioni, in2025.s3.operazioni]
      perche: Le quattro operazioni con le frazioni in seconda media (prassi).
  problemi:
    elementari-1:
      inizio: {entro: 20, livello: 1, esempio: "Marta ha 5 mele, ne riceve 3", generatore_dentro: true}
      fine: {entro: 20, livello: 1, esempio: "Tommaso ha 12 biglie, ne regala 4", generatore_dentro: true}
      obiettivi: [in2012.p.problemi, in2025.p5.problemi]
      perche: Un'operazione, aggiungere o togliere (prassi).
    elementari-2:
      inizio: {entro: 20, livello: 1, esempio: "Giulia ha 14 figurine, ne regala 6", generatore_dentro: true}
      fine: {entro: 100, livello: 2, esempio: "4 file da 6 caramelle", generatore_dentro: true}
      obiettivi: [in2012.p.problemi, in2025.p5.problemi]
      perche: In seconda arrivano gli schieramenti (moltiplicazione) e la ripartizione.
    elementari-3:
      inizio: {entro: 100, livello: 2, esempio: "24 matite tra 4 amici", generatore_dentro: true}
      fine: {entro: 100, livello: 3, esempio: "3 quaderni da 2 euro, paga con 10", generatore_dentro: true}
      obiettivi: [in2012.p.problemi, in2025.p5.problemi]
      perche: >-
        In terza i problemi con due domande e con le monete (testo 2012: decimali «con
        riferimento alle monete»). Un'interrogazione sulle addizioni non è un problema a due
        operazioni (caso del 12/10: 150 scatole, ne vende 65, 10 cioccolatini a scatola).
    elementari-4:
      inizio: {entro: 1000, livello: 3, esempio: "pullman da 48 posti, salgono 12 e 9", generatore_dentro: true}
      fine: {entro: 1000, livello: 3, esempio: "pullman da 48 posti, salgono 12 e 9", generatore_dentro: true}
      obiettivi: [in2012.p.problemi, in2025.p5.problemi]
      perche: Il generatore non ha problemi di quarta e quinta (misure, spesa e ricavo, frazioni).
    medie-1:
      inizio: {livello: 3, esempio: "pullman da 48 posti, salgono 12 e 9", generatore_dentro: true}
      fine: {livello: 3, esempio: "pullman da 48 posti, salgono 12 e 9", generatore_dentro: true}
