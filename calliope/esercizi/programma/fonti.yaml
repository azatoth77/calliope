# Le fonti dell'indice del programma (12/10/2026, decisione di Dario: esercizi e interrogazioni
# si basano sul programma ministeriale ufficiale). Testi letti il 12/10/2026 dalle fonti qui
# sotto; le citazioni negli altri file sono copiate dal testo ufficiale (nella Gazzetta
# Ufficiale in HTML le vocali accentate sono scritte con l'apostrofo: «e'», «proprieta'»).
#
# Cosa è testo ufficiale e cosa no:
# - `obiettivi` (in matematica.yaml, italiano.yaml, scienze.yaml): testo ufficiale, citazioni
#   brevi e letterali, con il traguardo a cui appartengono (fine della terza e della quinta
#   primaria, fine della terza secondaria di primo grado: le Indicazioni non vanno oltre).
# - `mappa`: interpolazione nostra. Le Indicazioni non dicono cosa si fa in una certa classe in
#   un certo periodo dell'anno (solo al termine della terza, della quinta e della terza media):
#   il dettaglio per classe e per periodo viene dalla prassi diffusa dei libri di testo e dei
#   curricoli d'istituto, ed è scritto come tale (`perche`). Va confermato con il libro o con
#   la persona: è la fase B (le domande di Calliope quando mancano i dettagli).

fonti:
  in2025:
    titolo: >-
      Decreto del Ministro dell'istruzione e del merito 9 dicembre 2025, n. 221, «Regolamento
      recante indicazioni nazionali per il curricolo della scuola dell'infanzia e del primo
      ciclo d'istruzione» (GU Serie Generale n. 21 del 27/01/2026, in vigore dall'11/02/2026)
    url_atto: https://www.gazzettaufficiale.it/eli/id/2026/01/27/26G00021/sg
    url_allegato: >-
      https://www.gazzettaufficiale.it/atto/vediMenuHTML?atto.dataPubblicazioneGazzetta=2026-01-27&atto.codiceRedazionale=26G00021&tipoSerie=serie_generale&tipoVigenza=originario
    dove: >-
      allegato, parte 1 (Italiano: scuola primaria e secondaria di primo grado) e parte 3
      (Matematica e Scienze); articoli 1, 3 e 5 per i tempi
    letto: 2026-10-12
  in2012:
    titolo: >-
      Decreto del Ministro dell'istruzione, dell'università e della ricerca 16 novembre 2012,
      n. 254, «Indicazioni nazionali per il curricolo della scuola dell'infanzia e del primo
      ciclo d'istruzione» (testo del settembre 2012 allegato al decreto)
    url: https://www.miur.gov.it/documents/20182/51310/DM+254_2012.pdf
    dove: >-
      Italiano (pagine 28–36), Matematica (pagine 49–53), Scienze (pagine 54–57) del PDF del
      Ministero
    letto: 2026-10-12

# Quali Indicazioni valgono (testo ufficiale: DM 221/2025, art. 1 comma 2 e art. 5 commi 1 e 3).
# - art. 1, c. 2: adozione «a partire dalle classi prime della scuola primaria e della scuola
#   secondaria di primo grado», «a decorrere dall'anno scolastico 2026/2027»;
# - art. 5, c. 1: le Indicazioni del 2012 «continuano ad applicarsi per le classi intermedie di
#   scuola primaria e secondaria di primo grado gia' funzionanti nell'anno scolastico
#   2025/2026, fino alla conclusione dei rispettivi corsi»; nel 2027/2028 le terze primarie
#   anticipano le nuove solo per «storia»;
# - art. 5, c. 3: le Indicazioni del 2012 cessano dal 2026/2027 per l'infanzia, dal 2028/2029
#   per la secondaria di primo grado, dal 2030/2031 per la primaria.
# In pratica (calliope/esercizi/programma: indicazioni_per): una classe segue le nuove se la sua
# prima (elementare o media) è cominciata nel 2026/27 o dopo. Nel 2026/27 una terza o una quarta
# elementare seguono ancora quelle del 2012.
validita:
  primaria:
    nuove_dalla_prima_del: 2026
    vecchie_cessano: 2030
  secondaria_primo_grado:
    nuove_dalla_prima_del: 2026
    vecchie_cessano: 2028
  eccezioni:
    - materia: storia
      classe: elementari-3
      anno: 2027
      indicazioni: "2025"
  # Le superiori non sono nelle Indicazioni del primo ciclo (Indicazioni nazionali dei licei,
  # Linee guida di tecnici e professionali): fuori da questo indice
  superiori: null

# I periodi dell'anno scolastico usati dalla mappa (interpolazione: i due quadrimestri)
periodi:
  inizio: [9, 10, 11, 12, 1]        # settembre–gennaio; settembre e ottobre: ripasso dell'anno prima
  fine: [2, 3, 4, 5, 6]             # febbraio–giugno
  estate: [7, 8]                    # luglio e agosto: la classe appena finita, come «fine»
